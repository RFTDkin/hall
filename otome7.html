<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】P戦国乙女7 | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a0b1c; /* 乙女深紫色背景 */
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff4081; /* 乙女粉紅 */
            text-shadow: 0 0 15px rgba(255, 64, 129, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #2c112e;
            border: 2px solid #ff4081;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(255, 64, 129, 0.3);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffd700;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #c2185b;
            color: #fff;
            border: 1px solid #ff4081;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            background-color: #e91e63;
            transform: scale(1.05);
            box-shadow: 0 0 10px #ff4081;
        }

        button:disabled {
            background-color: #4a148c;
            border-color: #311b92;
            color: #9e9e9e;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #ff4081;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #ff4081; font-weight: bold; text-shadow: 0 0 5px #ff4081; }
        .color-hit { color: #ffeb3b; font-weight: bold; text-shadow: 0 0 5px #ffeb3b; }
        .color-normal { color: #9e9e9e; }
        .color-ultimate { color: #ff1744; font-weight: bold; text-shadow: 0 0 10px #ff1744; font-size: 1.1em; }
        .color-jitan { color: #00e5ff; font-weight: bold; }
        .color-charge { color: #e040fb; font-weight: bold; }
        .color-fall { color: #757575; font-weight: bold; }

        .data-lamp-container {
            background-color: #1a0b1c;
            border: 3px solid #ff4081;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.4);
        }

        .data-lamp-title {
            color: #ff4081;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ff4081;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th, table.data-lamp td {
            border: 1px solid #c2185b;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th { background-color: #4a148c; color: #ff4081; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #2c112e; }
        table.data-lamp td.hit-spins { color: #00e5ff; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff4081; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">P戦国乙女7 (1/399.6)</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class SengokuOtome7 {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 🎯 通常時 大当り確率 1/399.6
                if (Math.random() < (1 / 399.6)) {
                    addLog(`\n[${this.session_spins} 回轉] ⚔️ 図柄揃い大当り！`, "color-hit");
                    await this.normal_result();
                    return true;
                } 
                // ⚡ 強カワチャージ (假設合算機率約 1/399.6)
                else if (Math.random() < (1 / 399.6)) {
                    this.session_payout += 280;
                    addLog(`\n[${this.session_spins} 回轉] ⚡ 強カワチャージ (280個獲得) 通常へ戻る`, "color-normal");
                    updateUI();
                    this.record_history();
                    return true;
                }
                
                return false;
            }

            async normal_result() {
                let r = Math.random();

                // 25% 乙女BONUS (280個 + 時短50回)
                if (r < 0.25) {
                    this.session_payout += 280;
                    addLog("🎯 乙女BONUS 280個獲得", "color-normal");
                    await sleep(1000);
                    await this.play_jitan();
                } else {
                    // 75% 真乙女BONUS3000 (LTチャレンジ)
                    addLog("🔥 真乙女BONUS3000 獲得！", "color-ultimate");
                    addLog("⚔️ LTチャレンジ 発生中...", "color-charge");
                    await sleep(2000); // 停頓營造緊張感

                    let r2 = Math.random();
                    let enterST = false;

                    // LTチャレンジ振り分け
                    // 50% 失敗 (3000個)
                    // 42.8% 成功 (3000個 + ST140)
                    // 7.2% 超成功 (5000個以上 + ST140)
                    if (r2 < 0.50) {
                        this.session_payout += 3000;
                        addLog(`💀 LTチャレンジ失敗... 3000個獲得 (通常終了)`, "color-fall");
                    } else if (r2 < 0.928) { // 0.50 + 0.428
                        this.session_payout += 3000;
                        addLog(`🌈 LTチャレンジ成功！！ 3000個獲得`, "color-ultimate");
                        enterST = true;
                    } else {
                        this.session_payout += 5000;
                        addLog(`👑 超LTチャレンジ成功！！ 5000個獲得！`, "color-ultimate");
                        
                        // 25% 上乘 Loop 停頓演出
                        let loop = true;
                        while(loop) {
                            addLog(`⚔️ 上乗せSTOCK 抽選中...`, "color-charge");
                            await sleep(1500);
                            if(Math.random() < 0.25) {
                                this.session_payout += 2000;
                                addLog(`🌈 OVER斬STOCK！！ +2000個！ (合計: ${this.session_payout}個)`, "color-ultimate");
                                await sleep(1000);
                            } else {
                                addLog(`🔄 上乗せ終了`, "color-normal");
                                loop = false;
                            }
                        }
                        enterST = true;
                    }

                    addLog(`💰 累積出玉: ${this.session_payout} 個`);
                    updateUI();

                    if (enterST) {
                        await sleep(1000);
                        await this.play_st();
                    } else {
                        this.record_history();
                    }
                }
            }

            async play_jitan() {
                addLog(`\n===== 🛡️ 出陣モード (時短50回) 開始 =====`, "color-jitan");
                this.state = "JITAN";
                let st_max = 50;
                let current_st = st_max;
                updateUI();
                let hit = false;

                while (this.state === "JITAN" && current_st > 0) {
                    await sleep(30);
                    let current_spin = st_max - current_st + 1;
                    document.getElementById("ui-spins").innerText = `時短中: ${current_spin}/${st_max}`;

                    // 時短中確率 1/399.6
                    if (Math.random() < (1 / 399.6)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [時短 ${current_spin}回転] 激熱當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                        addLog(`🌈 ラッキートリガー発動！！`, "color-ultimate");
                        await sleep(1000);
                        
                        await this.generate_st_payout();
                        hit = true;
                        break;
                    } else {
                        current_st--;
                    }
                }

                if (hit) {
                    await sleep(1000);
                    await this.play_st();
                } else {
                    document.getElementById("ui-spins").innerText = `終了`;
                    addLog("\n💀 時短駆け抜け... 通常終了", "color-fall");
                    this.end_rush();
                }
            }

            async play_st() {
                addLog(`\n===== ⚔️ 乙女 RUSH (ST140回) 開始 =====`, "color-rush");
                this.state = "RUSH";
                let st_max = 140;
                let current_st = st_max;
                updateUI();

                while (this.state === "RUSH" && current_st > 0) {
                    await sleep(40);
                    let current_spin = st_max - current_st + 1;
                    document.getElementById("ui-spins").innerText = `RUSH中: ${current_spin}/${st_max}`;

                    // ST中 大当り確率: 1/97.0
                    if (Math.random() < (1 / 97.0)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [ST ${current_spin}回転] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");

                        await this.generate_st_payout();

                        addLog("⚔️ 乙女 RUSH 継続!!", "color-rush");
                        current_st = st_max; // ST 回復
                        updateUI();
                        await sleep(800);
                    } else {
                        current_st--;
                    }
                }

                if (current_st === 0) {
                    document.getElementById("ui-spins").innerText = `終了`;
                    addLog("\n💀 ST抜け... RUSH終了", "color-fall");
                    this.end_rush();
                }
            }

            async generate_st_payout() {
                this.session_payout += 2000;
                addLog(`💥 OVER斬BONUS！ 2000個獲得！`, "color-hit");
                await sleep(1000);
                
                // 25% で約2000個上乗せループ
                let loop = true;
                while(loop) {
                    addLog(`⚔️ 上乗せSTOCK 抽選中...`, "color-charge");
                    await sleep(1500); // 停頓營造緊張感
                    
                    if(Math.random() < 0.25) {
                        this.session_payout += 2000;
                        addLog(`🌈 OVER斬STOCK！！ +2000個！ (合計: ${this.session_payout}個)`, "color-ultimate");
                        await sleep(1000);
                    } else {
                        addLog(`🔄 上乗せ終了`, "color-normal");
                        loop = false;
                    }
                }
                addLog(`💰 累積出玉: ${this.session_payout} 個`);
                updateUI();
            }

            end_rush() {
                addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                addLog(`💰 最終出玉: ${this.session_payout} 個`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new SengokuOtome7();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== ゲーム開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0 && game.state === "NORMAL") {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>

</html>
