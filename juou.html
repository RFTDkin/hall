<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】e獣王 | パチンコシミュレーター</title>
    <meta name="machine-title" content="e獣王">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #140c04; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #ff9100; text-shadow: 0 0 15px rgba(255, 145, 0, 0.8), 0 0 25px #ff3d00; font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #241608; border: 2px solid #ff9100; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(255, 145, 0, 0.4); }
        .stat-item span { display: block; font-weight: bold; color: #ffea00; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #ff9100 0%, #bf360c 100%); color: white; border: 1px solid #ffea00; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #ff9100; }
        button:disabled { background: #382412; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #ff9100; border-radius: 5px; height: 420px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-hit { color: #ff9100; font-weight: bold; text-shadow: 0 0 5px #ff6d00; }
        .color-normal { color: #bdbdbd; }
        .color-fall { color: #757575; font-weight: bold; }
        .color-rush { color: #00e676; font-weight: bold; text-shadow: 0 0 5px #00e676; }
        .color-judge { color: #00e5ff; font-weight: bold; }
        .color-sc { color: #ffea00; font-weight: 900; text-shadow: 0 0 12px #ff3d00, 0 0 20px #ffea00; font-size: 1.06em; }
        .data-lamp-container { background-color: #241608; border: 3px solid #ff9100; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(255, 145, 0, 0.35); }
        .data-lamp-title { color: #ffea00; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #ff6d00; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #e65100; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #6d2600; color: #ffea00; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #140c04; }
        table.data-lamp td.hit-spins { color: #ffea00; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff9100; font-weight: bold; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>
<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffea00;">e獣王 獅子の一撃 (1/319.7)</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class Juou {
            constructor() {
                this.state = "NORMAL"; // NORMAL, RUSH
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
                this.pScBall = 1 / 4.69; // 實質保留単発期待度 (平均上乗せ5306個逆算値)
            }

            // 🦁 サバンナチャンス (5粒保留ループ・1粒でも当たれば継続)
            async playSavannaChance(initialHits) {
                let scTotal = initialHits * 1500;
                let loopCount = 0;
                addLog(`🦁🔥 【サバンナチャンス】突入！！ (初期確保：${scTotal.toLocaleString()}玉)`, "color-sc");
                await sleep(700);

                while (true) {
                    loopCount++;
                    let loopHits = 0;
                    let icons = ["🦁"]; // 1粒目は当選消化分、残り4粒+補入計5粒抽選

                    // 5粒保留抽選 (1/4.69)
                    let marks = [];
                    for (let b = 1; b <= 5; b++) {
                        if (Math.random() < this.pScBall) {
                            loopHits++;
                            marks.push("🦁");
                        } else {
                            marks.push("✖");
                        }
                    }

                    await sleep(1000);
                    if (loopHits > 0) {
                        const addPayout = loopHits * 1500;
                        scTotal += addPayout;
                        this.session_payout += addPayout;
                        this.session_rush_count += loopHits;
                        addLog(`   ⚡ [SC ${loopCount}セット目] 保留判定：[ ${marks.join(" ")} ] → ${loopHits}個当選 (+${addPayout.toLocaleString()}玉)！継続！！`, "color-sc");
                        updateUI();
                    } else {
                        addLog(`   💨 [SC ${loopCount}セット目] 保留判定：[ ${marks.join(" ")} ] → 上乗せ終了`, "color-normal");
                        break;
                    }
                }

                addLog(`👑 サバンナチャンス決着！！ 一撃獲得合計：${scTotal.toLocaleString()} 玉！！`, "color-sc");
                updateUI();
                await sleep(700);
            }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉数: ${this.session_spins}`, "color-normal");

                // 通常時大当り確率 1/319.7 (2R 約300個)
                if (Math.random() < 1 / 319.7) {
                    this.session_rush_count = 1;
                    this.session_payout += 300;

                    if (Math.random() < 0.50) {
                        addLog(`\n[${this.session_spins} 回轉] 🌈 獣王RUSHチャレンジ成功！！ (300玉)`, "color-hit");
                        this.state = "RUSH";
                        addLog("🦁 獣王RUSH (ST100回転・LT発動) 突入！！", "color-rush");
                        updateUI(); await sleep(1000);
                        await this.play_rush();
                    } else {
                        addLog(`\n[${this.session_spins} 回轉] 🎯 獣王RUSHチャレンジ... (300玉)`, "color-hit");
                        addLog("💀 演出失敗... 通常へ戻る", "color-fall");
                        updateUI(); this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_rush() {
                while (this.state === "RUSH") {
                    addLog(`\n===== 🦁 獣王RUSH (ST100回転・実質1/144.7) =====`, "color-rush");
                    updateUI();

                    let hit = false;

                    for (let i = 1; i <= 100; i++) {
                        if (this.state === "NORMAL") return;
                        await sleep(45);
                        document.getElementById("ui-spins").innerText = `ST残り: ${100 - i}/100`;

                        // 右打ち実質大当り確率 1/144.7
                        if (Math.random() < 1 / 144.7) {
                            hit = true;
                            this.session_rush_count += 1;
                            this.session_payout += 1500;
                            addLog(`\n🎉 [ST ${i}回転目] 大当り！！ 保底1500玉＋残保留4個ジャッジ！！`, "color-hit");
                            updateUI();
                            await sleep(600);

                            // 公式割合: 1500個(33%), 3000個(17%), サバンナチャンス突入(50% = 3個以上当選)
                            const r = Math.random();
                            if (r < 0.33) {
                                // 1/5当選 (1500個)
                                addLog(`🔍 保留ジャッジ：[ 🦁 ✖ ✖ ✖ ✖ ] → 1500玉 BONUS！`, "color-judge");
                            } else if (r < 0.50) {
                                // 2/5当選 (3000個)
                                this.session_payout += 1500;
                                this.session_rush_count += 1;
                                addLog(`🔍 保留ジャッジ：[ 🦁 🦁 ✖ ✖ ✖ ] → 3000玉 BONUS！！`, "color-judge");
                            } else {
                                // 3/5以上当選 (4500個〜7500個スタート＋サバンナチャンス突入)
                                const rSc = Math.random();
                                let initHits = 3; // 3/5 (4500個)
                                let marks = ["🦁", "🦁", "🦁", "✖", "✖"];
                                if (rSc < 0.05) {
                                    initHits = 5; // 5/5 (7500個)
                                    marks = ["🦁", "🦁", "🦁", "🦁", "🦁"];
                                } else if (rSc < 0.25) {
                                    initHits = 4; // 4/5 (6000個)
                                    marks = ["🦁", "🦁", "🦁", "🦁", "✖"];
                                }

                                const extraInit = (initHits - 1) * 1500;
                                this.session_payout += extraInit;
                                this.session_rush_count += (initHits - 1);
                                addLog(`🔍 保留ジャッジ：[ ${marks.join(" ")} ] → ${initHits}/5当選！！`, "color-sc");
                                updateUI();
                                await this.playSavannaChance(initHits);
                            }

                            addLog(`💰 累積出玉: ${this.session_payout.toLocaleString()} 玉`);
                            updateUI();
                            await sleep(700);
                            break;
                        }
                    }

                    if (!hit && this.state === "RUSH") {
                        document.getElementById("ui-spins").innerText = `終了`;
                        addLog(`\n💀 ST100回転スルー... 獣王RUSH終了`, "color-fall");
                        addLog(`📈 總連莊数: ${this.session_rush_count}連`);
                        addLog(`💰 最終出玉: ${this.session_payout.toLocaleString()} 玉`);
                        this.state = "NORMAL";
                        this.record_history();
                        updateUI();
                    }
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.state = "NORMAL";
            }
        }

        let game = new Juou();
        window.game = game;
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            addLog("\n=== e獣王 獅子の一撃 稼働開始！ ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
