<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】Pにゃんこ大戦争〜多様性のネコ〜 | パチンコシミュレーター</title>
    <meta name="machine-title" content="Pにゃんこ大戦争">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #161004; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #ffca28; text-shadow: 0 0 15px rgba(255, 202, 40, 0.8), 0 0 25px #ff6f00; font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #261c08; border: 2px solid #ffca28; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(255, 202, 40, 0.4); }
        .stat-item span { display: block; font-weight: bold; color: #ffea00; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #ffca28 0%, #ff6f00 100%); color: #111; border: 1px solid #fff59d; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: 900; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #ffca28; }
        button:disabled { background: #3a2e18; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #ffca28; border-radius: 5px; height: 420px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-hit { color: #ffca28; font-weight: bold; text-shadow: 0 0 5px #ff6f00; }
        .color-normal { color: #bdbdbd; }
        .color-fall { color: #757575; font-weight: bold; }
        .color-gacha { color: #ff9100; font-weight: bold; text-shadow: 0 0 5px #ff9100; }
        .color-lt { color: #ffea00; font-weight: 900; text-shadow: 0 0 10px #ff6f00, 0 0 20px #ffea00; }
        .color-danger { color: #ff1744; font-weight: bold; }
        .color-zanhoryu { color: #00e5ff; font-weight: bold; }
        .data-lamp-container { background-color: #261c08; border: 3px solid #ffca28; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(255, 202, 40, 0.3); }
        .data-lamp-title { color: #ffea00; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #ff6f00; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #b28704; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #5c4300; color: #ffea00; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #161004; }
        table.data-lamp td.hit-spins { color: #ffea00; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ffca28; font-weight: bold; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>
<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #fff59d;">Pにゃんこ大戦争〜多様性のネコ〜 (1/155)</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class Nyanko {
            constructor() {
                this.state = "NORMAL"; // NORMAL, LT
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
                this.lt_spins = 0;
            }

            // 残り保留4個での引き戻し抽選 (1/26.4 × 4回転 ≒ 14.3%)
            async checkZanhoryu(contextLabel) {
                addLog(`\n🔵 残り保留 4個 引き戻し抽選 (期待度 約14.3%)`, "color-zanhoryu");
                for (let j = 1; j <= 4; j++) {
                    await sleep(250);
                    document.getElementById("ui-spins").innerText = `残保留: ${4 - j}/4`;
                    addLog(`🐾 残保留 ${j}個目...`, "color-zanhoryu");

                    if (Math.random() < 1 / 26.4) {
                        this.session_rush_count += 1;
                        this.session_payout += 1500;
                        addLog(`\n🎉 [残保留 ${j}個目] 奇跡の引き戻し成功！！ (${contextLabel})`, "color-lt");
                        addLog(`▶ 10R BONUS！ 1500玉 獲得 (總 ${this.session_rush_count}連)`, "color-hit");
                        updateUI();
                        await sleep(700);
                        return true;
                    }
                }
                return false;
            }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉数: ${this.session_spins}`, "color-normal");

                // 降臨ガチャ発生率 約1/155
                if (Math.random() < 1 / 155) {
                    this.session_rush_count = 1;
                    this.session_payout += 300; // 2R分の出玉獲得
                    addLog(`\n[${this.session_spins} 回轉] 🐱 降臨ガチャアイコン停止！！ (2R・300玉獲得)`, "color-gacha");
                    updateUI();
                    await sleep(700);

                    // 成功期待度 約1/4 (25%)
                    if (Math.random() < 0.25) {
                        this.session_payout += 2700; // 合計3000個獲得
                        addLog(`🌈 昇格成功！！ SUNRISE BONUS (10R×2回・合計3000玉)！！`, "color-hit");
                        updateUI();
                        await sleep(900);

                        // ジャッジ演出 (残保留14.3%込みでトータル50%突入 -> 直撃約41.66%)
                        addLog(`⚡ 神域ULTIMATE 突入ジャッジ演出発生！！`, "color-gacha");
                        await sleep(700);

                        if (Math.random() < 0.4166) {
                            addLog(`👑 ジャッジ成功！！ ラッキートリガー【神域ULTIMATE】発動！！`, "color-lt");
                            await sleep(900);
                            await this.play_lt();
                        } else {
                            addLog(`💥 ジャッジ失敗... 残り保留に賭ける！！`, "color-danger");
                            const pulledBack = await this.checkZanhoryu("神域ULTIMATE突入");
                            if (pulledBack) {
                                await this.play_lt();
                            } else {
                                addLog(`💀 引き戻しならず... 通常へ戻る`, "color-fall");
                                updateUI();
                                this.record_history();
                            }
                        }
                    } else {
                        // 降臨ガチャ失敗 (300玉で終了＆停止)
                        addLog(`💀 昇格失敗... (2R・300玉) 通常へ戻る`, "color-fall");
                        updateUI();
                        this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_lt() {
                this.state = "LT";
                this.lt_spins = 0;
                addLog(`\n===== 👑 神域ULTIMATE (継続率約88%・ALL1500個) =====`, "color-lt");

                while (this.state === "LT") {
                    await sleep(40);
                    this.lt_spins += 1;
                    document.getElementById("ui-spins").innerText = `神域: ${this.lt_spins}回転`;

                    // 1. 実質大当り抽選 (1/26.4)
                    if (Math.random() < 1 / 26.4) {
                        this.session_rush_count += 1;
                        this.session_payout += 1500;
                        addLog(`\n🎉 [神域 ${this.lt_spins}回転目] 7図柄揃い！！ 1500玉 獲得 (總 ${this.session_rush_count}連)`, "color-hit");

                        // フリーズ発生で保留連演出 (約14.3%)
                        if (Math.random() < 0.143) {
                            await sleep(500);
                            this.session_rush_count += 1;
                            this.session_payout += 1500;
                            addLog(`❄️⚡ フリーズ発生！！ 保留連上乗せ +1500玉！！ (總 ${this.session_rush_count}連)`, "color-lt");
                        }

                        addLog(`💰 累積出玉: ${this.session_payout.toLocaleString()} 玉`);
                        this.lt_spins = 0;
                        updateUI();
                        await sleep(650);
                        continue;
                    }

                    // 2. 転落抽選 (1/155)
                    if (Math.random() < 1 / 155) {
                        addLog(`\n⚠️ [神域 ${this.lt_spins}回転目] カオル君接近... 撃破失敗で転落ピンチ！！`, "color-danger");
                        const revived = await this.checkZanhoryu("神域ULTIMATE継続");
                        if (revived) {
                            this.lt_spins = 0;
                            addLog(`🔥 神域ULTIMATE 復帰！！`, "color-lt");
                            continue;
                        } else {
                            document.getElementById("ui-spins").innerText = `終了`;
                            addLog(`\n💀 神域ULTIMATE 終了...`, "color-fall");
                            addLog(`📈 總連莊数: ${this.session_rush_count}連`);
                            addLog(`💰 最終出玉: ${this.session_payout.toLocaleString()} 玉`);
                            this.state = "NORMAL";
                            this.record_history();
                            updateUI();
                            break;
                        }
                    }

                    if (this.lt_spins % 20 === 0) {
                        addLog(`⏳ 神域ULTIMATE ${this.lt_spins}回転消化中...`, "color-normal");
                    }
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.state = "NORMAL";
            }
        }

        let game = new Nyanko();
        window.game = game;
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            addLog("\n=== Pにゃんこ大戦争〜多様性のネコ〜 稼働開始！ ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
