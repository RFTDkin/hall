<head>

    <title>【無料】P リコリス・リコイル | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d1a;
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff5252;
            text-shadow: 0 0 15px rgba(255, 82, 82, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;

            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel {
            flex: 1;
            min-width: 320px;
            max-width: 500px;

        .right-panel {
            flex: 1;

        .stats-board {
            background-color: #1a0f14;
            border: 2px solid #ff5252;

        .stat-item span {
            display: block;

        button {
            background-color: #d32f2f;

        .log-container {

            color: #ff5252;

        .color-fall {
            color: #757575;
            font-weight: bold;
        }

        .color-music {
            color: #00e676;
            font-style: italic;
        }

        .data-lamp-container {
            background-color: #11080a;
            border: 3px solid #d32f2f;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(211, 47, 47, 0.4);
        }

        .data-lamp-title {
            color: #ff5252;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ff5252;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th,
        table.data-lamp td {
            border: 1px solid #b71c1c;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th {
            background-color: #3e2723;
            color: #ff8a80;
            font-size: 0.9em;
        }

        table.data-lamp tr:nth-child(even) {
            background-color: #210a0f;
        }

        table.data-lamp td.hit-spins {
            color: #ffeb3b;
            font-weight: bold;
        }

        table.data-lamp td.hit-rush {
            color: #00e676;
            font-weight: bold;
        }

        table.data-lamp td.hit-payout {
            color: #ff5252;
        }

        .empty-row {
            color: #444 !important;
        }

        /* 💩 3萬發 プレミアムうんこ 專屬演出 💩 */
        #unko-overlay {
            position: fixed; inset: 0; z-index: 20000; display: none; 
            align-items: center; justify-content: center; background: rgba(255,255,255,0);
            transition: background 2s ease-in; /* 慢白 Fade out */
            overflow: hidden;
        }
        
        /* 逐句彈出嘅對白 */
        #unko-text {
            font-size: 6vw; font-weight: 900; text-align: center;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00e5ff, #c500ff, #ff0000);
            background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text;
            -webkit-text-stroke: 2px #ffffff; filter: drop-shadow(0 0 15px rgba(255,255,255,0.8));
            opacity: 0; transform: scale(0.8); transition: opacity 0.5s, transform 0.5s;
            font-family: "Arial Black", Impact, sans-serif;
            animation: unkoRainbow 2s linear infinite;
        }
        @keyframes unkoRainbow { to { background-position: 200% center; } }
        
        /* 顯示對白嘅 Active Class */
        .unko-text-show { opacity: 1 !important; transform: scale(1) !important; }

        /* 🌟 Blackout 演出 🌟 */
        #unko-overlay.is-blackout { background: #000 !important; transition: none; }
        #unko-overlay.is-blackout::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background: radial-gradient(ellipse 150% 6% at center, #000000 5%, #ff00ff 12%, #ffd700 22%, #00ffff 40%, transparent 60%);
            animation: unkoFlash 6s forwards; filter: contrast(1.5);
        }
        /* 🌟 Blackout 閃光 (改慢閃爍時間，更具爆發力) 🌟 */
        @keyframes unkoFlash {
            0% { opacity: 0; transform: scale(0.2) scaleY(0.05); filter: brightness(3); }
            5% { opacity: 1; transform: scale(1) scaleY(1); filter: brightness(3); }
            20% { opacity: 0; transform: scale(1.5) scaleY(2); filter: brightness(1); }
            100% { opacity: 0; }
        }

        /* 💩 滿天飛屎動畫 (加入 hue-rotate 變成幻彩色屎) */
        .flying-unko {
            position: absolute; font-size: 40px; 
            /* 配合 unkoRainbowColor 令 emoji 本身不斷變色 */
            animation: unkoExplode ease-out forwards, unkoRainbowColor 1s linear infinite;
        }
        @keyframes unkoExplode {
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 1; }
            70% { opacity: 1; } 
            100% { transform: translate(var(--tx), var(--ty)) scale(var(--s)) rotate(var(--r)); opacity: 0; }
        }
        /* 🌈 幻彩濾鏡：令大便與陰影瘋狂變換七色彩虹 */
        @keyframes unkoRainbowColor {
            0% { filter: drop-shadow(0 0 15px rgba(255,0,0,0.8)) hue-rotate(0deg); }
            100% { filter: drop-shadow(0 0 15px rgba(255,0,0,0.8)) hue-rotate(360deg); }
        }

<body>
    <!-- 💩 プレミアムうんこ 演出圖層 -->
    <div id="unko-overlay" aria-hidden="true">
        <div id="unko-text"></div>
    </div>

    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.5em; color: #ffffff;">P リコリス・リコイル (Lycoris Recoil)</span></h1>

    <video id="rush-media" src="https://files.catbox.moe/yg8fcl.mp4" style="display:none;" preload="auto" playsinline
        webkit-playsinline></video>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 開始任務</button>
                
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="4" class="empty-row">- 無紀錄 -</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const rushMedia = document.getElementById("rush-media");
        let audioUnlocked = false;
        // 💩 處理 30000 發「プレミアムうんこ」動畫
        async function playPremiumUnko() {
            const overlay = document.getElementById('unko-overlay');
            const textDiv = document.getElementById('unko-text');

            // 1. 白屏 Fade Out
            overlay.style.display = 'flex';
            void overlay.offsetWidth;
            overlay.style.background = 'rgba(255,255,255,1)';
            await sleep(2000);

            // 2. 逐句對白 (大幅延長時間，拉滿懸念)
            const msgs = [
                "やるね",
                "何でこんなに運がいいの？",
                "そんなあなたに 私が用意した",
                "ホットでプレミアムなうんこ",
                "受け取って"
            ];

            for (let i = 0; i < msgs.length; i++) {
                textDiv.innerText = msgs[i];
                textDiv.classList.add('unko-text-show');
                await sleep(2800); // 👈 每句停留 2.8 秒，保證玩家慢慢睇清楚
                textDiv.classList.remove('unko-text-show');
                await sleep(600);  // 👈 句與句之間停頓 0.6 秒
            }

            // 3. Blackout 音效 (Ghoul Style)
            try {
                if (window.audioCtx) {
                    if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
                    const ctx = window.audioCtx;
                    const osc1 = ctx.createOscillator(); const osc2 = ctx.createOscillator();
                    const filter = ctx.createBiquadFilter(); const gainNode = ctx.createGain();
                    osc1.type = 'sine'; osc1.frequency.setValueAtTime(200, ctx.currentTime); osc1.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);
                    osc2.type = 'square'; osc2.frequency.setValueAtTime(150, ctx.currentTime); osc2.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.2);
                    filter.type = 'lowpass'; filter.frequency.setValueAtTime(800, ctx.currentTime); filter.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4);
                    gainNode.gain.setValueAtTime(0.001, ctx.currentTime); gainNode.gain.linearRampToValueAtTime(1.0, ctx.currentTime + 0.05); gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);
                    osc1.connect(gainNode); osc2.connect(filter); filter.connect(gainNode); gainNode.connect(ctx.destination);
                    osc1.start(ctx.currentTime); osc2.start(ctx.currentTime); osc1.stop(ctx.currentTime + 1.2); osc2.stop(ctx.currentTime + 1.2);
                }
            } catch (e) {}

            // 4. Blackout 視覺 + 終極爆屎
            overlay.classList.add('is-blackout');
            textDiv.innerHTML = "やったぜ！<br>おめでとう";
            textDiv.style.transform = "scale(1.5)";
            textDiv.classList.add('unko-text-show');

            // 💩 激增至 200 嚿屎！
            for (let i = 0; i < 200; i++) {
                let unko = document.createElement('div');
                unko.className = 'flying-unko';
                unko.innerText = "💩";
                
                // 飛得更遠、更大、更誇張
                let angle = Math.random() * Math.PI * 2;
                let distance = 500 + Math.random() * 1000; // 擴散距離加倍
                let tx = Math.cos(angle) * distance;
                let ty = Math.sin(angle) * distance;
                let scale = 0.5 + Math.random() * 3.5; // 有啲極大嚿
                let rot = (Math.random() - 0.5) * 1440; 
                let dur = 3 + Math.random() * 5; // 動畫時間延長至 3 - 8 秒，慢慢飛

                unko.style.setProperty('--tx', `${tx}px`);
                unko.style.setProperty('--ty', `${ty}px`);
                unko.style.setProperty('--s', scale);
                unko.style.setProperty('--r', `${rot}deg`);
                unko.style.animationDuration = `${dur}s`;

                overlay.appendChild(unko);
            }

            // 👈 畀足 10 秒時間玩家欣賞滿天飛屎同截圖！
            await sleep(10000); 

            // 5. 完結清理
            overlay.classList.remove('is-blackout');
            textDiv.classList.remove('unko-text-show');
            overlay.style.background = 'rgba(255,255,255,0)';
            
            // 剷走啲屎
            document.querySelectorAll('.flying-unko').forEach(el => el.remove());

            await sleep(1000);
            overlay.style.display = 'none';

            // 🌟 動畫徹底完結先彈 Alert
            window.alert("🎉 伝説の称号【ホットでプレミアムうんこ】を獲得しました！\nプロフィールから装備できます！\n\n※コンプリート機能により、現在のRUSHは強制終了となります。");
            
            // 🌟 回傳 true 代表需要強制結束
            return true; 
        }

        // 播放影片並等待完結嘅 Function
        // 🌟 正名為 playVideoPopupAndWait，並加入 10 秒防卡死
        function playVideoPopupAndWait(mediaElement) {
            return new Promise((resolve) => {
                if (!mediaElement) return resolve();

                let isResolved = false;
                const finish = () => {
                    if (isResolved) return;
                    isResolved = true;
                    mediaElement.removeEventListener('ended', finish);
                    mediaElement.removeEventListener('error', finish);
                    mediaElement.style.display = "none";
                    resolve();
                };

                mediaElement.style.display = "block";
                mediaElement.style.position = "fixed";
                mediaElement.style.top = "50%";
                mediaElement.style.left = "50%";
                mediaElement.style.transform = "translate(-50%, -50%)";
                mediaElement.style.zIndex = "10000";
                mediaElement.style.width = "90vw";
                mediaElement.style.maxWidth = "900px";
                mediaElement.style.height = "auto";
                mediaElement.style.aspectRatio = "16 / 26";
                mediaElement.style.objectFit = "cover";
                mediaElement.style.objectPosition = "top center"; // 👈 將畫面頂住最上，黑邊就會被推出去下面裁走！
                mediaElement.style.backgroundColor = "transparent";
                mediaElement.style.border = "4px solid #ffeb3b"; // Lycoris 金色框
                mediaElement.style.boxShadow = "0 0 40px rgba(255, 235, 59, 0.8)";
                mediaElement.style.backgroundColor = "#000";
                mediaElement.style.borderRadius = "10px";

                mediaElement.currentTime = 0;
                mediaElement.addEventListener('ended', finish);
                mediaElement.addEventListener('error', finish);

                mediaElement.play().catch(e => {
                    console.log("自動播放被阻擋或出錯", e);
                    finish();
                });

                // 🛡️ 防卡死：10秒超時強制收埋影片繼續
                setTimeout(finish, 40000);
            });
        }

        class LycorisRecoil {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 通常確率 1/259.7
                if (Math.random() < (1 / 259.7)) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 大當たり！`, "color-hit");
                    await this.normal_result();
                    return true;
                }

                return false;
            }

            async normal_result() {
                let r = Math.random();
                let enterLT = false;
                let payout = 0;
                let msg = "";

                // 計算初當分配 (50% 突入 RUSH)
                if (r < 0.001) {
                    payout = 1500; enterLT = true; msg = "🌈 10R 1500玉獲得！";
                } else if (r < 0.450) {
                    payout = 600; enterLT = true; msg = "🔫 4R 600玉獲得！";
                } else if (r < 0.500) {
                    payout = 310; enterLT = true; msg = "🎯 チンアナゴ昇格！ 310玉獲得！";
                } else if (r < 0.800) {
                    payout = 600; msg = "😭 4R 600玉獲得 (通常終了)";
                } else {
                    payout = 310; msg = "😭 チンアナゴ昇格失敗 310玉獲得 (通常終了)";
                }

                this.session_payout += payout;
                addLog(msg, enterLT ? "color-ultimate" : "color-normal");
                addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                updateUI();

                // 判斷是否入 RUSH
                if (enterLT) {
                    addLog("\n🌟 RUSH突入確定！", "color-rush");

                    // 🌟 重點：播完 kurumi.mp4 先執行之後嘅嘢 🌟
                    addLog(`🎵 播放專屬音效 (kurumi.mp4) 中... 請稍候`, "color-music");
                    await playVideoPopupAndWait(rushMedia);

                    await sleep(1000);
                    await this.play_rush();
                } else {
                    addLog("💀 任務失敗... RUSH非突入", "color-fall");
                    this.record_history();
                }
            }

            async play_rush() {
                addLog(`\n===== 🔫 リコリスRUSH (ST132回) 開始 =====`, "color-ultimate");
                this.state = "RUSH";
                let st_max = 132;
                let current_st = st_max;

                // RUSH 開始時有 30% 直入上位 Mode B
                let mode = Math.random() < 0.30 ? "B" : "A";
                if (mode === "B") addLog(`🌈 奇跡！ 初回からモードB (上位) スタート！`, "color-ultimate");

                updateUI();

                while (this.state === "RUSH" && current_st > 0) {
                    await sleep(40);
                    let current_spin = st_max - current_st + 1;

                    document.getElementById("ui-spins").innerText = `RUSH中: ${current_spin}/${st_max}`;

                    // RUSH中 大当り確率: 1/97.1
                    if (Math.random() < (1 / 97.1)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [ST ${current_spin}回転] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");

                        let payout = 0;

                        if (mode === "A") {
                            payout = 750;
                            addLog(`💥 750玉獲得！`);

                            // 50% 升級去 Mode B
                            if (Math.random() < 0.50) {
                                mode = "B";
                                addLog(`🌈 覚醒！ モードB (上位) へ昇格！`, "color-ultimate");
                            } else {
                                addLog(`⚡ モードA 継続！`, "color-rush");
                            }
                        } else {
                            // 處於上位 Mode B
                            if (Math.random() < 0.50) {
                                payout = 6000;
                                let total_loop_payout = 6000; // 用嚟計算今次 Loop 總數
                                addLog(`🔥 神からのギフト！ 6000玉獲得！`, "color-ultimate");

                                // 50% Loop 追加 3000玉
                                while (Math.random() < 0.50) {
                                    await sleep(800);
                                    payout += 3000;
                                    total_loop_payout += 3000;
                                    addLog(`🌈 さらに上乗せ！ +3000玉 (計 ${payout}玉)`, "color-ultimate");
                                }

                                // 🌟 Loop 完結後，檢查今次上乘せ係咪超過 30000 發
                                if (total_loop_payout >= 30000) {
                                    let forceEnd = await playPremiumUnko(); // 等待動畫完結同 Alert 彈出
                                    if (forceEnd) {
                                        current_st = 0; // 🌟 真正強制將 ST 歸零
                                        break; // 🌟 立即跳出 while 迴圈，唔再抽獎
                                    }
                                }
                            } else {
                                payout = 3000;
                                addLog(`💥 3000玉獲得！`, "color-rush");
                            }

                            // Mode B 當選後必定降返 Mode A
                            mode = "A";
                            addLog(`🔄 モードA に戻ります`, "color-normal");
                        }

                        this.session_payout += payout;
                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);

                        current_st = st_max; // ST 回復
                        updateUI();
                        await sleep(800);
                    } else {
                        current_st--;
                    }
                }

                if (current_st === 0) {
                    document.getElementById("ui-spins").innerText = `RUSH中: ${st_max}/${st_max}`;
                    addLog("\n💀 ST抜け... RUSH終了", "color-fall");
                    this.end_rush();
                }
            }

            end_rush() {
                addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new LycorisRecoil();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const btnReset = document.getElementById("btn-reset");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            if(btnReset) btnReset.disabled = true;

            if (!audioUnlocked) {
                rushMedia.load();
                
                // 👇 加入音效解鎖 👇
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    window.audioCtx = new AudioContextClass();
                    if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
                }
                
                audioUnlocked = true;
            }

            addLog("\n=== ミッション開始！ (開始打玉) ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0) {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            if(btnReset) btnReset.disabled = false;
            btnPlay.innerText = "▶️ 繼續任務";
        }

        function resetGame() {
            game = new LycorisRecoil();
            logBox.innerHTML = "";
            renderHistoryTable([]);
            updateUI();

            rushMedia.pause();
            rushMedia.currentTime = 0;

            addLog("遊戲紀錄已重置。", "color-normal");
            btnPlay.innerText = "▶️ 開始任務";
        }
    </script>
