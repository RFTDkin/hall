<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】e終末のワルキューレ | パチンコシミュレーター</title>
    <meta name="machine-title" content="e終末のワルキューレ">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel {
            flex: 1;
            min-width: 320px;
            max-width: 500px;
        }

        .right-panel {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
        }

        .stats-board {
            background-color: #1a1a1a;
            border: 2px solid #ff4500;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(255, 69, 0, 0.5);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffeb3b;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background: linear-gradient(180deg, #ff4500 0%, #b32400 100%);
            color: white;
            border: 1px solid #ff7b00;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #ff4500;
        }

        button:disabled {
            background: #333;
            border-color: #555;
            color: #888;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #ff4500;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #ffd700; font-weight: bold; text-shadow: 0 0 5px #ffd700; }
        .color-hit { color: #ff5252; font-weight: bold; }
        .color-climax { color: #ff00ff; font-weight: 900; text-shadow: 0 0 10px #ff00ff; font-size: 1.1em; }
        .color-normal { color: #b0bec5; }
        .color-fall { color: #757575; font-weight: bold; }

        .data-lamp-container {
            background-color: #111;
            border: 3px solid #ff4500;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.4);
        }

        .data-lamp-title {
            color: #ff9800;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ff9800;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th, table.data-lamp td {
            border: 1px solid #555;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th { background-color: #222; color: #ff4500; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #1a1a1a; }
        table.data-lamp td.hit-spins { color: #ff9800; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ffeb3b; }
        .empty-row { color: #555 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.6em; color: #ff4500;">e終末のワルキューレ</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">現在回転数 <span id="ui-spins">0</span></div>
                <div class="stat-item">獲得出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">連チャン <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (直近10回)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>履歴</th>
                            <th>当選回転数</th>
                            <th>連チャン</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="4" class="empty-row">- 履歴なし -</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class ValkyrieMachine {
            constructor() {
                this.state = "NORMAL";
                this.rush_state = 1; // 1: 1戦目, 2: 2戦目, 3: CLIMAX
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            // 🌟 獨立出嚟慢慢行嘅上乘處理
            async processExtraBonus() {
                let extra = 0;
                let loopCount = 0;
                
                while (Math.random() < 0.50) {
                    loopCount++;
                    await sleep(1000); // 每次上乘嘅停頓，營造緊張感
                    
                    if (Math.random() < 0.50) {
                        extra += 3000;
                        addLog(`  ┣ 🔄 ${loopCount}連目: +3000玉！`, "color-climax");
                    } else {
                        extra += 1500;
                        addLog(`  ┣ 🔄 ${loopCount}連目: +1500玉！`, "color-hit");
                    }
                }
                
                if (loopCount > 0) {
                    await sleep(800);
                    addLog(`  ┗ 🏁 上乗せ終了 (追加 +${extra}玉)`, "color-normal");
                } else {
                    await sleep(500);
                    addLog(`  ┗ 💦 上乗せ発生せず...`, "color-normal");
                }
                
                return { extra, loopCount };
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在の回転数: ${this.session_spins}`, "color-normal");
                }

                if (Math.random() < (1 / 219.9)) {
                    addLog(`\n[${this.session_spins} 回転] 💥 大当り当選！`, "color-hit");
                    await sleep(1000);

                    let r = Math.random();
                    if (r < 0.26) {
                        let basePayout = 3000;
                        addLog(`🌈 VICTORY VALKYRIE BONUS 3000 EXTRA！ (基本3000玉)`, "color-rush");
                        
                        // 慢慢顯示上乘過程
                        let extraData = await this.processExtraBonus();
                        let totalPayout = basePayout + extraData.extra;
                        this.session_payout += totalPayout;
                        
                        if (extraData.extra > 0) {
                            addLog(`🔥 総獲得: ${totalPayout}玉 の爆発力！`, "color-climax");
                        } else {
                            addLog(`✨ 基本の 3000玉 を獲得！`, "color-hit");
                        }
                        
                        await sleep(1500);
                        addLog(`⚔️ 神VS人類最終闘争 突入！`, "color-rush");
                        
                        this.rush_state = 1; 
                        updateUI();
                        await sleep(1500);
                        await this.play_rush();
                    } else {
                        this.session_payout += 300;
                        addLog(`💧 BONUS (2R)... 300玉獲得 (通常終了)`, "color-normal");
                        this.record_history();
                        updateUI();
                        await sleep(1000);
                    }
                    return true;
                }
                return false;
            }

            async play_rush() {
                this.state = "RUSH";
                let current_rush_spins = 0;
                
                while (this.state === "RUSH") {
                    await sleep(150); // 🌟 速度調慢：等你可以睇到數字跳 (原本40)
                    current_rush_spins += 1;

                    let stateName = this.rush_state === 1 ? "1戦目" : (this.rush_state === 2 ? "2戦目" : "CLIMAX");
                    document.getElementById("ui-spins").innerText = `${stateName}: ${current_rush_spins}回転`;

                    let hitProb = (this.rush_state === 3) ? (1 / 19.9) : (1 / 39.9);
                    let fallProb = (this.rush_state === 3) ? (1 / 58.4) : (1 / 116.8);

                    let hitRoll = Math.random() < hitProb;
                    let fallRoll = Math.random() < fallProb;

                    if (hitRoll) {
                        this.session_rush_count += 1;
                        let r = Math.random();
                        let isVVBonus = false;

                        addLog(`\n🎉 [${stateName}] 大当り！ (${current_rush_spins}回転目)`);
                        await sleep(1000); // 中獎後停一停

                        if (this.rush_state === 1) {
                            if (r < 0.05) { isVVBonus = true; this.rush_state = 1; }
                            else { this.rush_state = 2; }
                        } else if (this.rush_state === 2) {
                            if (r < 0.05) { isVVBonus = true; this.rush_state = 1; }
                            else { this.rush_state = 3; }
                        } else if (this.rush_state === 3) {
                            isVVBonus = true;
                            this.rush_state = 1; 
                        }

                        if (isVVBonus) {
                            addLog(`🌈 VV BONUS 3000 EXTRA！ (基本3000玉)`, "color-climax");
                            let extraData = await this.processExtraBonus();
                            let hitPayout = 3000 + extraData.extra;
                            this.session_payout += hitPayout;
                            
                            if (extraData.extra > 0) {
                                addLog(`🔥 一撃 ${hitPayout}玉 獲得！`, "color-climax");
                            } else {
                                addLog(`✨ 3000玉 獲得！`, "color-hit");
                            }
                        } else {
                            this.session_payout += 1500;
                            addLog(`⚔️ VALKYRIE BONUS！ 1500玉獲得！`, "color-hit");
                        }

                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        
                        let nextStateName = this.rush_state === 1 ? "1戦目" : (this.rush_state === 2 ? "2戦目" : "CLIMAX");
                        addLog(`⏭️ 次回状態: ${nextStateName}`, this.rush_state === 3 ? "color-climax" : "color-rush");

                        current_rush_spins = 0; 
                        updateUI();
                        
                        await sleep(2500); // 🌟 睇清楚結果先去下一戰 (原本800)

                    } else if (fallRoll) {
                        await sleep(500);
                        addLog(`\n💀 バトル敗北... 転落 (${current_rush_spins}回転で終了)`, "color-fall");
                        addLog(`📈 総連チャン数: ${this.session_rush_count + 1}連 (初当り含む)`);
                        addLog(`💰 最終出玉: ${this.session_payout} 玉`);

                        this.state = "NORMAL";
                        this.record_history();
                        updateUI();
                        await sleep(1500);
                        break;
                    }
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.rush_state = 1;
            }
        }

        let game = new ValkyrieMachine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 履歴なし -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== 神VS人類最終闘争 開幕 ===", "color-rush");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0 && game.state === "NORMAL") {
                    await sleep(10); // 確保不卡頓
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ 遊技続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>

</html>
