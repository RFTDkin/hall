<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eとある科学の超電磁砲 | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000b18; /* 深藍色背景 */
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #00e5ff; /* 電磁砲藍 */
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel {
            flex: 1;
            min-width: 320px;
            max-width: 500px;
        }

        .right-panel {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
        }

        .stats-board {
            background-color: #001f3f;
            border: 2px solid #00e5ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.3);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ff9100; /* 橘色點綴 */
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #ffab40;
            color: #000;
            border: 1px solid #ffab40;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            background-color: #ff6d00;
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 10px #ff9100;
        }

        button:disabled {
            background-color: #424242;
            border-color: #616161;
            color: #9e9e9e;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #00e5ff;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #00e5ff; font-weight: bold; text-shadow: 0 0 5px #00e5ff; }
        .color-hit { color: #ff9100; font-weight: bold; text-shadow: 0 0 5px #ff9100; }
        .color-normal { color: #9e9e9e; }
        .color-ultimate { color: #ff1744; font-weight: bold; text-shadow: 0 0 10px #ff1744; font-size: 1.1em; }
        .color-overdrive { color: #ffea00; font-weight: bold; text-shadow: 0 0 8px #ffea00; }
        .color-fall { color: #757575; font-weight: bold; }

        .data-lamp-container {
            background-color: #000b18;
            border: 3px solid #00e5ff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .data-lamp-title {
            color: #ff9100;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ff9100;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th, table.data-lamp td {
            border: 1px solid #00e5ff;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th {
            background-color: #001f3f;
            color: #00e5ff;
            font-size: 0.9em;
        }

        table.data-lamp tr:nth-child(even) { background-color: #001529; }
        table.data-lamp td.hit-spins { color: #00e5ff; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #ff9100; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff1744; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">eとある科学の超電磁砲 (1/169.7)</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class Railgun {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 通常時 大当り確率 1/169.7
                if (Math.random() < (1 / 169.7)) {
                    addLog(`\n[${this.session_spins} 回轉] ⚡ 図柄揃い大当り！`, "color-hit");
                    await this.normal_result();
                    return true;
                }
                return false;
            }

            async normal_result() {
                let r = Math.random();
                let enterRush = false;

                // 25% 突入 LT (超 超電磁砲RUSH)
                if (r < 0.25) {
                    this.session_payout += 300;
                    addLog("🌈 突破チャレンジ成功！ 300個獲得", "color-ultimate");
                    addLog("⚡ 超 超電磁砲RUSH (LT) 突入！", "color-rush");
                    enterRush = true;
                } else {
                    // 75% 通常
                    this.session_payout += 300;
                    addLog("😭 BONUS 300個獲得 (突破チャレンジ失敗... 通常終了)", "color-normal");
                }

                addLog(`💰 累積出玉: ${this.session_payout} 個`);
                updateUI();

                if (enterRush) {
                    await sleep(1000);
                    await this.play_rush();
                } else {
                    this.record_history();
                }
            }

            async generate_rush_payout() {
                let r = Math.random();
                let payout_add = 0;
                let text = "";
                let is1GLoop = false;

                // RUSH 中振分: 
                // 47% (1500), 23.1% (3000), 20.6% (4500), 9.3% (6000 or 7500+)
                // 將 9.3% 分拆為: 6% (6000) 及 3.3% (7500+ & 1G連)
                
                if (r < 0.470) {
                    payout_add = 1500;
                    addLog(`💥 超電磁砲BONUS！ 1500個獲得！`, "color-hit");
                    await sleep(500);
                } else {
                    // 進入 OVER DRIVE 停頓演出
                    addLog(`⚡ ギミック落下！ OVER DRIVE 突入！`, "color-overdrive");
                    await sleep(1500);
                    
                    if (r < 0.701) { // 47.0% + 23.1%
                        payout_add = 3000;
                        addLog(`🔥 OVER DRIVE 雷神BONUS！ 3000個獲得！`, "color-overdrive");
                    } else if (r < 0.907) { // 70.1% + 20.6%
                        payout_add = 4500;
                        addLog(`🌈 OVER DRIVE 限界突破！ 4500個獲得！`, "color-ultimate");
                    } else if (r < 0.967) { // 90.7% + 6.0%
                        payout_add = 6000;
                        addLog(`🌈 OVER DRIVE 究極突破！ 6000個獲得！`, "color-ultimate");
                    } else { // 餘下 3.3%
                        payout_add = 7500;
                        addLog(`👑 OVER DRIVE 神域！ 7500個獲得 ＋ 1G連濃厚！`, "color-ultimate");
                        is1GLoop = true;
                    }
                    await sleep(1000);
                }
                
                this.session_payout += payout_add;
                addLog(`💰 累積出玉: ${this.session_payout} 個`);
                updateUI();

                // 處理 1G連 (即刻再抽一次 RUSH 分配，唔扣 ST)
                if (is1GLoop) {
                    await sleep(1500);
                    addLog(`\n⚡ [1G連 発動] 追撃開始！`, "color-ultimate");
                    await this.generate_rush_payout();
                }
            }

            async play_rush() {
                addLog(`\n===== ⚡ 超 超電磁砲RUSH (ST125回) 開始 =====`, "color-rush");
                this.state = "RUSH";
                let st_max = 125;
                let current_st = st_max;
                updateUI();

                while (this.state === "RUSH" && current_st > 0) {
                    await sleep(40);
                    let current_spin = st_max - current_st + 1;

                    document.getElementById("ui-spins").innerText = `RUSH中: ${current_spin}/${st_max}`;

                    // RUSH中 大当り確率: 1/86.8
                    if (Math.random() < (1 / 86.8)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [ST ${current_spin}回転] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");

                        await this.generate_rush_payout();

                        addLog("⚡ RUSH 継続!!", "color-rush");
                        current_st = st_max; // ST 回復
                        updateUI();
                        await sleep(800);
                    } else {
                        current_st--;
                    }
                }

                if (current_st === 0) {
                    document.getElementById("ui-spins").innerText = `終了`;
                    addLog("\n💀 ST抜け... RUSH終了", "color-fall");
                    this.end_rush();
                }
            }

            end_rush() {
                addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                addLog(`💰 最終出玉: ${this.session_payout} 個`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new Railgun();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== ゲーム開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0 && game.state === "NORMAL") {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <!-- 若本機有 hall-shared.js / plugin.js 可以解開以下註解 -->
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>

</html>
