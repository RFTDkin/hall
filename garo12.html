<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】e牙狼12 | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #1a1a00;
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffea00;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background: linear-gradient(180deg, #d4af37 0%, #aa7c11 100%);
            color: #000;
            border: 1px solid #ffd700;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #ffd700;
        }

        button:disabled {
            background: #332b00;
            border-color: #444;
            color: #777;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #ffd700;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #ffeb3b; font-weight: bold; text-shadow: 0 0 5px #ffeb3b; }
        .color-hit { color: #ff1744; font-weight: bold; text-shadow: 0 0 5px #ff1744; }
        .color-normal { color: #bdbdbd; }
        .color-ultimate { color: #ffea00; font-weight: 900; text-shadow: 0 0 15px #ffea00; font-size: 1.1em; }
        .color-garo { color: #00e5ff; font-weight: bold; text-shadow: 0 0 8px #00e5ff; }
        .color-fall { color: #757575; font-weight: bold; }

        .data-lamp-container {
            background-color: #0d0d0d;
            border: 3px solid #ffd700;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .data-lamp-title {
            color: #ffd700;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ffd700;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th, table.data-lamp td {
            border: 1px solid #ffd700;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th { background-color: #1a1a00; color: #ffd700; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #111; }
        table.data-lamp td.hit-spins { color: #ffea00; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff1744; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">e牙狼12 (1/349.99)</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class Garo12 {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                let roll = Math.random();
                
                // 大当り確率 1/349.99 (合算)
                // 液晶図柄揃い: 1/437.49, ガロチャージ: 1/1749.97
                if (roll < (1 / 349.99)) {
                    if (roll < (1 / 437.49)) {
                        addLog(`\n[${this.session_spins} 回轉] ⚔️ 液晶図柄揃い大当り！`, "color-hit");
                        await this.lcd_match_result();
                    } else {
                        // ガロチャージ (2R)
                        this.session_payout += 300;
                        addLog(`\n[${this.session_spins} 回轉] 🛡️ ガロチャージ (2R 300個獲得) 通常へ`, "color-normal");
                        updateUI();
                        this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async lcd_match_result() {
                let r = Math.random();

                // 10R 1500個獲得
                this.session_payout += 1500;
                
                if (r < 0.50) {
                    addLog("🌟 BATTLE BONUS 勝利！ 1500個獲得", "color-ultimate");
                    addLog("🔥 極限7500バトル 突入！", "color-rush");
                    await sleep(1500);
                    await this.play_gokugen_7500();
                } else {
                    addLog("💀 BATTLE BONUS 敗北... 1500個獲得 (通常終了)", "color-normal");
                    addLog(`💰 累積出玉: ${this.session_payout} 個`);
                    updateUI();
                    this.record_history();
                }
            }

            async play_gokugen_7500() {
                addLog(`\n===== ⚔️ 極限7500バトル (1回転勝負) =====`, "color-ultimate");
                await sleep(2000); // 停頓營造緊張感

                if (Math.random() < 0.50) {
                    this.session_rush_count += 1;
                    this.session_payout += 7500;
                    addLog(`🌈 牙狼剣を押し込め！！ 撃破大成功！`, "color-garo");
                    addLog(`👑 10R×5回 7500個獲得 ＆ 魔戒CHANCE LT 発動！！`, "color-ultimate");
                    addLog(`💰 累積出玉: ${this.session_payout} 個`);
                    updateUI();
                    await sleep(1500);
                    await this.play_makai_lt();
                } else {
                    this.session_payout += 1500;
                    addLog(`💀 ホラー撃破ならず... 10R 1500個獲得 (通常へ)`, "color-fall");
                    this.end_rush();
                }
            }

            async play_makai_lt() {
                addLog(`\n===== 🐺 魔戒CHANCE LT (継続率 約76%) 開始 =====`, "color-garo");
                this.state = "RUSH";
                updateUI();

                let in_lt = true;

                while (in_lt && this.state === "RUSH") {
                    await sleep(1000);
                    addLog(`⚔️ ゲート選択... 危機回避なるか!?`, "color-normal");
                    await sleep(1500);

                    let lt_roll = Math.random();

                    if (lt_roll < 0.25) {
                        // 25% で 7500個
                        this.session_rush_count += 1;
                        this.session_payout += 7500;
                        addLog(`🌈 超魔戒BONUS！！ 10R×5回 7500個獲得！ (總 ${this.session_rush_count + 1}連)`, "color-ultimate");
                        addLog(`💰 累積出玉: ${this.session_payout} 個`);
                        addLog("🐺 魔戒CHANCE LT 継続!!", "color-garo");
                        updateUI();
                    } else if (lt_roll < 0.76) {
                        // 51% で 1500個継続
                        this.session_rush_count += 1;
                        this.session_payout += 1500;
                        addLog(`💥 魔戒BONUS！ 10R 1500個獲得！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                        addLog(`💰 累積出玉: ${this.session_payout} 個`);
                        addLog("🐺 魔戒CHANCE LT 継続!!", "color-garo");
                        updateUI();
                    } else {
                        // 24% で 1500個通常落ち
                        this.session_payout += 1500;
                        addLog(`💀 危機回避失敗... 10R 1500個獲得`, "color-fall");
                        in_lt = false;
                    }
                }
                
                this.end_rush();
            }

            end_rush() {
                addLog(`\n💀 魔戒CHANCE 終了`, "color-fall");
                addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                addLog(`💰 最終出玉: ${this.session_payout} 個`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new Garo12();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== ゲーム開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0 && game.state === "NORMAL") {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>

</html>
