<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eA フィーバー炎炎ノ消防隊2Y | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0400;
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff5722;
            text-shadow: 0 0 15px rgba(255, 87, 34, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel {
            flex: 1;
            min-width: 320px;
            max-width: 500px;
        }

        .right-panel {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
        }

        .stats-board {
            background-color: #1a0800;
            border: 2px solid #ff5722;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 10px rgba(255, 87, 34, 0.3);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ff9800;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #b71c1c;
            color: white;
            border: 1px solid #ff5252;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            background-color: #d50000;
            transform: scale(1.05);
            box-shadow: 0 0 10px #ff5252;
        }

        button:disabled {
            background-color: #3e2723;
            border-color: #444;
            color: #777;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #bf360c;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #ff9800; font-weight: bold; text-shadow: 0 0 5px #ff9800; }
        .color-hit { color: #ff5252; font-weight: bold; text-shadow: 0 0 5px #ff5252; }
        .color-challenge { color: #4caf50; font-weight: bold; text-shadow: 0 0 5px #4caf50; }
        .color-normal { color: #9e9e9e; }
        .color-ultimate { color: #d500f9; font-weight: bold; text-shadow: 0 0 10px #d500f9; font-size: 1.1em; }
        .color-fall { color: #757575; font-weight: bold; }

        .data-lamp-container {
            background-color: #110500;
            border: 3px solid #bf360c;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(191, 54, 12, 0.4);
        }

        .data-lamp-title {
            color: #ff5722;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ff5722;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th, table.data-lamp td {
            border: 1px solid #bf360c;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th { background-color: #3e1100; color: #ff9800; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #210800; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff5252; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>
    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.5em; color: #ffffff;">eA フィーバー炎炎ノ消防隊2Y</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 鎮魂開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class FireForce {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 通常時大当り確率: 1/99.9
                if (Math.random() < (1 / 99.9)) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 初当り當選！`, "color-hit");
                    await this.normal_result();
                    return true;
                }
                return false;
            }

            async normal_result() {
                let roll = Math.random();
                this.session_rush_count = 1;

                if (roll < 0.01) {
                    // 1%: 9R + LT直行
                    this.session_payout += 900;
                    addLog("🌈 奇跡！ 9R (900玉) 獲得！ アドラバースト直行！", "color-ultimate");
                    updateUI();
                    await sleep(1000);
                    await this.play_lt();
                } else if (roll < 0.01 + 0.50) {
                    // 50%: 4R + 炎上RUSH
                    this.session_payout += 400;
                    addLog("🔥 激アツ！ 4R (400玉) 獲得！ 炎上RUSH突入！", "color-rush");
                    updateUI();
                    await sleep(1000);
                    await this.play_rush();
                } else {
                    // 49%: 4R + 命の呼吸チャレンジ
                    this.session_payout += 400;
                    addLog("✨ 4R (400玉) 獲得。命の呼吸チャレンジへ", "color-challenge");
                    updateUI();
                    await sleep(1000);
                    await this.play_challenge();
                }
            }

            // 命の呼吸チャレンジ: ST1回転 + 残り保留4個 = 計5回転
            async play_challenge() {
                addLog(`\n===== ⚔️ 命の呼吸チャレンジ 開始 =====`, "color-challenge");
                this.state = "CHALLENGE";
                let max_spins = 5;

                for (let i = 1; i <= max_spins; i++) {
                    await sleep(400); // 慢速倒數增加緊張感
                    let isReserve = i > 1; // 第 2 轉開始就係残保
                    let current_spin = isReserve ? (i - 1) : i;

                    if (!isReserve) {
                        document.getElementById("ui-spins").innerText = `チャレンジ中: ${current_spin}/1`;
                    } else {
                        document.getElementById("ui-spins").innerText = `残保留: ${current_spin}/4`;
                        addLog(`⏳ 残保留 ${current_spin}回転目...`, "color-normal");
                    }

                    // 右打ち実質大当り確率: 1/23.8
                    if (Math.random() < (1 / 23.8)) {
                        let phaseName = isReserve ? '残保留' : 'ST';
                        addLog(`\n🎉 [${phaseName} ${current_spin}回転目] 突破成功！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                        await this.right_hit();
                        return; 
                    }
                }

                // 失敗
                document.getElementById("ui-spins").innerText = `終了`;
                addLog("\n💀 チャレンジ失敗... 通常へ戻る", "color-fall");
                this.end_rush();
            }

            // 炎上RUSH: ST30回転 + 残り保留4個 = 計34回転
            async play_rush() {
                addLog(`\n===== 🔥 炎上RUSH 開始 =====`, "color-rush");
                this.state = "RUSH";
                let max_spins = 34;

                for (let i = 1; i <= max_spins; i++) {
                    let isReserve = i > 30; // 第 31 轉開始係残保
                    let current_spin = isReserve ? (i - 30) : i;

                    if (!isReserve) {
                        await sleep(60); // ST 中快速消化
                        document.getElementById("ui-spins").innerText = `RUSH中: ${current_spin}/30`;
                    } else {
                        await sleep(400); // 残保留慢速倒數
                        document.getElementById("ui-spins").innerText = `残保留: ${current_spin}/4`;
                        addLog(`⏳ 残保留 ${current_spin}回転目...`, "color-normal");
                    }

                    if (Math.random() < (1 / 23.8)) {
                        let phaseName = isReserve ? '残保留' : 'ST';
                        addLog(`\n🎉 [${phaseName} ${current_spin}回転目] 炎上當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                        await this.right_hit();
                        return;
                    }
                }

                document.getElementById("ui-spins").innerText = `終了`;
                addLog("\n💀 ST抜け... RUSH終了", "color-fall");
                this.end_rush();
            }

            // 右打ち中 (Challenge / RUSH) 當選分配
            async right_hit() {
                this.session_rush_count += 1;
                let roll = Math.random();

                if (roll < 0.01) {
                    // 1%: 9R + LT昇格
                    this.session_payout += 900;
                    addLog("🌈 究極覚醒！ 9R (900玉) 獲得！ アドラバースト突入！", "color-ultimate");
                    updateUI();
                    await sleep(1500);
                    await this.play_lt();
                } else if (roll < 0.01 + 0.19) {
                    // 19%: 9R + RUSH継続
                    this.session_payout += 900;
                    addLog("💥 BIG BONUS！ 9R (900玉) 獲得！", "color-hit");
                    addLog("🔥 炎上RUSH 継続!!", "color-rush");
                    updateUI();
                    await sleep(800);
                    await this.play_rush();
                } else {
                    // 80%: 4R + RUSH継続
                    this.session_payout += 400;
                    addLog("✨ BONUS 4R (400玉) 獲得", "color-normal");
                    addLog("🔥 炎上RUSH 継続!!", "color-rush");
                    updateUI();
                    await sleep(800);
                    await this.play_rush();
                }
            }

            // アドラバースト (LT): ST64回転 + 残り保留4個 = 計68回転
            async play_lt() {
                addLog(`\n===== 🔥 アドラバースト (LT) 開始 =====`, "color-ultimate");
                this.state = "LT";
                let max_spins = 68;

                for (let i = 1; i <= max_spins; i++) {
                    let isReserve = i > 64; // 第 65 轉開始係残保
                    let current_spin = isReserve ? (i - 64) : i;

                    if (!isReserve) {
                        await sleep(50); // ST 中快速消化
                        document.getElementById("ui-spins").innerText = `LT中: ${current_spin}/64`;
                    } else {
                        await sleep(400); // 残保留慢速倒數
                        document.getElementById("ui-spins").innerText = `残保留: ${current_spin}/4`;
                        addLog(`⏳ 残保留 ${current_spin}回転目...`, "color-normal");
                    }

                    if (Math.random() < (1 / 23.8)) {
                        this.session_rush_count += 1;
                        let phaseName = isReserve ? '残保留' : 'LT';
                        addLog(`\n🎉 [${phaseName} ${current_spin}回転目] アドラ當選！ (總 ${this.session_rush_count}連)`, "color-ultimate");
                        
                        let roll = Math.random();
                        if (roll < 0.20) {
                            // 20%: 9R + LT継続
                            this.session_payout += 900;
                            addLog("🌈 超絶BONUS！ 9R (900玉) 獲得！", "color-ultimate");
                        } else {
                            // 80%: 4R + LT継続
                            this.session_payout += 400;
                            addLog("✨ BONUS 4R (400玉) 獲得", "color-hit");
                        }
                        
                        addLog("🔥 アドラバースト 継続!!", "color-ultimate");
                        updateUI();
                        await sleep(800);
                        
                        // 重新遞歸進入下一圈 LT
                        await this.play_lt();
                        return;
                    }
                }

                document.getElementById("ui-spins").innerText = `終了`;
                addLog("\n💀 LT抜け... アドラバースト終了", "color-fall");
                this.end_rush();
            }

            end_rush() {
                addLog(`📈 總連莊數: ${this.session_rush_count}連 (含初當)`);
                addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count,
                    payout: this.session_payout
                });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new FireForce();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== 鎮魂開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();
                if (game.session_spins % 100 === 0) await sleep(10);
                if (hit) { isPlaying = false; break; }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ 繼續鎮魂";
        }
    </script>
    <script src="hall-shared.js"></script>

    </div>
</body>
