<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】e Re:ゼロから始める異世界生活 鬼がかり2 | パチンコシミュレーター</title>
    <meta name="machine-title" content="e Re:ゼロから始める異世界生活 鬼がかり2">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #b785f6;
            text-shadow: 0 0 15px rgba(183, 133, 246, 0.7);
            font-weight: 900;
            letter-spacing: 1px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel, .right-panel {
            flex: 1;
            min-width: 320px;
            max-width: 500px;
        }

        .stats-board {
            background-color: #1f2833;
            border: 2px solid #b785f6;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 10px rgba(183, 133, 246, 0.3);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #66fcf1;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #45a29e;
            color: white;
            border: 1px solid #66fcf1;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: 0.2s;
        }

        button:hover {
            background-color: #66fcf1;
            color: #0b0c10;
            box-shadow: 0 0 10px #66fcf1;
        }

        button:disabled {
            background-color: #2c3e50;
            border-color: #34495e;
            color: #7f8c8d;
            cursor: not-allowed;
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #45a29e;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #b785f6; font-weight: bold; text-shadow: 0 0 5px #b785f6; }
        .color-hit { color: #ffeb3b; font-weight: bold; }
        .color-normal { color: #90caf9; }
        .color-ultimate { color: #ff1744; font-weight: bold; text-shadow: 0 0 10px #ff1744; font-size: 1.1em; }
        .color-wedding { color: #ff4081; font-weight: bold; text-shadow: 0 0 15px #ff4081, 0 0 25px #fff; font-size: 1.2em; }
        .color-fall { color: #757575; font-style: italic; }
        .color-reset { color: #00e676; font-weight: bold; }

        .data-lamp-container {
            background-color: #1a1a2e;
            border: 3px solid #b785f6;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(183, 133, 246, 0.4);
        }

        .data-lamp-title {
            color: #b785f6;
            margin-top: 0; margin-bottom: 15px;
            text-align: center;
            text-shadow: 0 0 5px #b785f6;
            letter-spacing: 2px;
        }

        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #45a29e; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #0f3460; color: #66fcf1; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #16213e; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff5252; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>
    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.5em; color: #ffffff;">e Re:ゼロから始める異世界生活 鬼がかり2 (1/349.9)</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr><th>前次</th><th>當選回轉數</th><th>連莊數</th><th>獲得出玉</th></tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class ReZero2Machine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
                this.last_hit_was_6000 = false;
            }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 通常時 1/349.9
                if (Math.random() < (1 / 349.9)) {
                    let roll = Math.random();
                    let enterRush = false;

                    // 10% -> 3000 BONUS + RUSH
                    if (roll < 0.10) {
                        this.session_payout += 3000;
                        enterRush = true;
                        addLog(`\n[${this.session_spins} 回轉] 🎯 7図柄揃い當選！！！`, "color-ultimate");
                        addLog("🌈 超激アツ！ 3000 BONUS 獲得！", "color-ultimate");
                    }
                    // 45% -> 1500 BONUS + RUSH
                    else if (roll < 0.55) {
                        this.session_payout += 1500;
                        enterRush = true;
                        addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い當選！`, "color-hit");
                        addLog("✨ 昇格成功！ Re:ゼロ BONUS (1500玉)", "color-hit");
                    }
                    // 45% -> 1500 BONUS (通常終了)
                    else {
                        this.session_payout += 1500;
                        addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い當選`, "color-normal");
                        addLog("💀 チャレンジ BONUS 昇格失敗 (1500玉)", "color-fall");
                        addLog("💀 通常へ戻る", "color-fall");
                    }

                    updateUI();

                    if (enterRush) {
                        addLog("🔥 鬼がかり RUSH 突入！ (ST 144回転)", "color-rush");
                        await sleep(1000);
                        this.last_hit_was_6000 = false; // 初期化
                        await this.play_rush();
                    } else {
                        this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_rush() {
                this.state = "RUSH";
                let st_max = 144;
                let current_st = st_max;
                updateUI();

                while (this.state === "RUSH" && current_st > 0) {
                    await sleep(40);
                    let current_spin = st_max - current_st + 1;
                    
                    document.getElementById("ui-spins").innerText = `RUSH中: ${current_spin}/${st_max}`;

                    if (Math.random() < (1 / 99.9)) {
                        this.session_rush_count += 1;
                        let r = Math.random();
                        let is_current_6000 = false; // 紀錄當前是否6000，用黎判定ウエディング

                        addLog(`\n🎉 [ST ${current_spin}回転] RUSH 大当り！ (總 ${this.session_rush_count + 1}連)`, "color-hit");

                        // 1. 處理當前中獎
                        if (r < 0.25) {
                            addLog(`🔥 極上！ 6000 BONUS 獲得！！`, "color-ultimate");
                            this.session_payout += 6000;
                            is_current_6000 = true;
                        } else if (r < 0.80) {
                            addLog(`✨ Re:ゼロ BONUS (1500玉)`, "color-hit");
                            this.session_payout += 1500;
                        } else if (r < 0.86) {
                            addLog(`💧 BONUS 青V (300玉)`, "color-normal");
                            this.session_payout += 300;
                        } else {
                            addLog(`🔄 ST リセット！ Re:Start (出玉なし)`, "color-reset");
                        }
                        
                        updateUI();
                        await sleep(600);

                        // 2. 即時判定 4 粒保留
                        addLog(`🔍 保留4個 判定中...`, "color-normal");
                        await sleep(500);

                        for (let i = 1; i <= 4; i++) {
                            if (Math.random() < (1 / 99.9)) {
                                this.session_rush_count += 1;
                                let hr = Math.random();
                                
                                addLog(`\n🎉 [保留連 ${i}個目] 當選！！！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                                
                                if (hr < 0.25) {
                                    if (is_current_6000) {
                                        addLog(`💍 奇跡の保留連！！！ ウエディング 12000 BONUS 達成！！！`, "color-wedding");
                                    } else {
                                        addLog(`🔥 極上！ 6000 BONUS 獲得！！ (保留連)`, "color-ultimate");
                                    }
                                    this.session_payout += 6000;
                                    is_current_6000 = true; // 繼續維持6000狀態，若下個保留又中可繼續Wedding
                                } else if (hr < 0.80) {
                                    addLog(`✨ Re:ゼロ BONUS (1500玉) (保留連)`, "color-hit");
                                    this.session_payout += 1500;
                                    is_current_6000 = false;
                                } else if (hr < 0.86) {
                                    addLog(`💧 BONUS 青V (300玉) (保留連)`, "color-normal");
                                    this.session_payout += 300;
                                    is_current_6000 = false;
                                } else {
                                    addLog(`🔄 ST リセット！ (保留連)`, "color-reset");
                                    is_current_6000 = false;
                                }
                                updateUI();
                                await sleep(600);
                            }
                        }

                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        
                        // 3. 所有保留處理完畢，ST 回復
                        current_st = st_max; 
                        updateUI();
                        await sleep(800);
                    } 
                    else {
                        current_st--;
                    }
                }

                if (current_st === 0) {
                    document.getElementById("ui-spins").innerText = `終了`;
                    addLog(`\n💀 ST 144回転終了... RUSH 終了`, "color-fall");
                    addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);

                    this.state = "NORMAL";
                    this.record_history();
                    updateUI();
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.last_hit_was_6000 = false;
            }
        }

        let game = new ReZero2Machine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            addLog("\n=== スマパチ Re:ゼロ 開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (hit) { isPlaying = false; break; }
            }
            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ 繼續遊技";
        }
    </script>
    
    <!-- 引入 Firebase 外掛 -->
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
