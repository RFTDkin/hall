<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - バーチャル パチンコホール</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #050505; color: #fff; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-image: radial-gradient(circle at center, #1a001a 0%, #000000 100%); }
        .login-box { background: #111; border: 2px solid #00e5ff; border-radius: 15px; padding: 40px; width: 350px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }
        h1 { color: #ffeb3b; text-shadow: 0 0 10px rgba(255, 235, 59, 0.6); margin-top: 0; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-size: 1em; }
        button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; border: none; font-weight: bold; font-size: 1.1em; cursor: pointer; transition: 0.2s; }
        .btn-submit { background: #00e5ff; color: #000; box-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
        .btn-submit:hover { background: #00b8d4; }
        .toggle-text { color: #888; margin-top: 20px; cursor: pointer; font-size: 0.9em; text-decoration: underline; }
        .toggle-text:hover { color: #fff; }
        .hint-text { font-size: 0.8em; color: #aaa; margin-top: -5px; margin-bottom: 10px; text-align: left; padding-left: 5%; }
    </style>
<link rel="stylesheet" href="mobile.css">
</head>
<body>

    <div class="login-box">
        <h1 id="title">ログイン</h1>
        
        <input type="text" id="username" placeholder="プレイヤー名" style="display:none;">
        <input type="text" id="login-id" placeholder="ログインID (半角英数字)">
        <input type="password" id="password" placeholder="パスワード (6文字以上)">
        <div class="hint-text">※メールアドレスは不要です</div>
        
        <button class="btn-submit" id="submit-btn" onclick="handleAuth()">ログイン</button>
        
        <div class="toggle-text" onclick="toggleMode()" id="toggle-btn">新規登録はこちら</div>
    </div>

    <script>
        // Firebaseのコンフィグ設定
        const firebaseConfig = {
            apiKey: "AIzaSyBfaLasiMg8AWvKvFONPePt-dIZ46x3yus",
            authDomain: "p-hall.firebaseapp.com",
            databaseURL: "https://p-hall-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "p-hall",
            storageBucket: "p-hall.firebasestorage.app",
            messagingSenderId: "656958771527",
            appId: "1:656958771527:web:baee4ad9c5350ee31e3c62",
            measurementId: "G-46M19VQVY2"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let isRegisterMode = false;

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById("title").innerText = isRegisterMode ? "新規登録" : "ログイン";
            document.getElementById("submit-btn").innerText = isRegisterMode ? "登録する" : "ログイン";
            document.getElementById("toggle-btn").innerText = isRegisterMode ? "すでにアカウントをお持ちの方" : "新規登録はこちら";
            document.getElementById("username").style.display = isRegisterMode ? "block" : "none";
        }

        function handleAuth() {
            const loginId = document.getElementById("login-id").value.trim();
            const password = document.getElementById("password").value;
            const username = document.getElementById("username").value.trim();

            if (!loginId || !password) {
                return alert("IDとパスワードを入力してください！");
            }

            if (!/^[a-zA-Z0-9]+$/.test(loginId)) {
                return alert("IDは半角英数字のみ使用可能です！");
            }

            // FirebaseのEmail要件を回避するためのダミードメイン
            const dummyEmail = loginId + "@phall.local";

            if (isRegisterMode) {
                if (!username) return alert("プレイヤー名を入力してください！");
                
                auth.createUserWithEmailAndPassword(dummyEmail, password)
                    .then((userCredential) => {
                        return db.ref('users/' + userCredential.user.uid).set({
                            username: username,
                            balance: 50000,
                            daily_spins: 0,
                            daily_profit: 0,
                            last_date: new Date().toDateString()
                        });
                    })
                    .then(() => {
                        alert("登録完了！50,000円をプレゼントしました！");
                        window.location.href = "index.html";
                    })
                    .catch((error) => {
                        if (error.code === 'auth/email-already-in-use') {
                            alert("このIDはすでに使用されています。");
                        } else if (error.code === 'auth/weak-password') {
                            alert("パスワードは6文字以上にしてください。");
                        } else {
                            alert("登録エラー: " + error.message);
                        }
                    });
            } else {
                auth.signInWithEmailAndPassword(dummyEmail, password)
                    .then(() => { window.location.href = "index.html"; })
                    .catch((error) => {
                        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                            alert("IDまたはパスワードが間違っています。");
                        } else {
                            alert("ログインエラー: " + error.message);
                        }
                    });
            }
        }
    </script>

            atOptions = {

                'format' : 'iframe',

                'width' : 320,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="//www.highperformanceformat.com/ead8f1e5fdd30faaed33da77b3333cf4/invoke.js"></script>
    </div>
</body>
</html>
