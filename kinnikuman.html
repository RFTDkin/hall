<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eフィーバーキン肉マン | パチンコシミュレーター</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a0000; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #ff1744; text-shadow: 0 0 15px rgba(255, 23, 68, 0.7); font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #2b0000; border: 2px solid #ff1744; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(255, 23, 68, 0.5); }
        .stat-item span { display: block; font-weight: bold; color: #ffd700; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #d50000 0%, #880000 100%); color: white; border: 1px solid #ff5252; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #ff1744; }
        button:disabled { background: #3e0000; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #ff1744; border-radius: 5px; height: 400px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-rush { color: #ffd700; font-weight: bold; text-shadow: 0 0 5px #ffd700; }
        .color-hit { color: #ff5252; font-weight: bold; text-shadow: 0 0 5px #ff5252; }
        .color-normal { color: #bdbdbd; }
        .color-lt { color: #ff3d00; font-weight: 900; text-shadow: 0 0 15px #ff3d00; font-size: 1.1em; }
        .color-ultimate { color: #ffea00; font-weight: 900; text-shadow: 0 0 15px #ffea00; font-size: 1.1em; }
        .color-fall { color: #757575; font-weight: bold; }
        .data-lamp-container { background-color: #2b0000; border: 3px solid #ff1744; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(255, 23, 68, 0.5); }
        .data-lamp-title { color: #ff5252; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #ff5252; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #d50000; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #4a0000; color: #ffea00; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #2b0000; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff5252; font-weight: bold; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">eフィーバーキン肉マン</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        class Kinnikuman {
            constructor() { this.state = "NORMAL"; this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.history = []; this.rush_spins = 0; }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉数: ${this.session_spins}`, "color-normal");

                // 🌟 分離抽獎：図柄揃い vs 悪魔CHARGE
                let roll = Math.random();
                let pHit = 1 / 399.9;
                let pCharge = 1 / 2706.0;

                // 🎯 1. 図柄揃い (1/399.9)
                if (roll < pHit) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い當選！`, "color-hit");
                    this.session_payout += 1500;

                    // 50%: 1500個 + RUSH (LT) 直行
                    if (Math.random() < 0.50) {
                        addLog("🔥 マッスルBONUS！ (1500玉)", "color-ultimate");
                        addLog("🌈 正義超人BATTLE MODE (ST145回) 突入！！", "color-lt");
                        this.session_rush_count = 1;
                        updateUI(); await sleep(2000);
                        await this.play_rush();
                    } 
                    // 50%: 1500個 + 通常
                    else {
                        addLog("💥 BONUS！ (1500玉)", "color-hit");
                        addLog("💀 演出失敗... 通常へ戻る", "color-normal");
                        updateUI(); this.record_history();
                    }
                    return true;
                }
                // ⚡ 2. 悪魔CHARGE (1/2706.0)
                else if (roll < pHit + pCharge) {
                    addLog(`\n[${this.session_spins} 回轉] ⚡ 悪魔CHARGE當選！ (300玉)`, "color-normal");
                    this.session_payout += 300;
                    updateUI();
                    await sleep(1500); // 停頓等昇格判定
                    
                    // 1%: 300個 + RUSH (LT)
                    if (Math.random() < 0.01) {
                        addLog("🌈 奇跡の昇格発生！！ 正義超人BATTLE MODE 突入！！", "color-lt");
                        this.session_rush_count = 1;
                        updateUI(); await sleep(2000);
                        await this.play_rush();
                    } 
                    // 99%: 300個 + 通常
                    else {
                        addLog("💨 昇格ならず... 通常へ戻る", "color-fall");
                        this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_rush() {
                this.state = "ST";
                let max_spins = 145;
                let hitRate = 1 / 92.3;
                let modeName = "正義超人BATTLE";
                
                addLog(`\n===== 💪 ${modeName} MODE =====`, "color-lt");
                
                let initial_rush_count = this.session_rush_count;
                updateUI();

                while (this.state === "ST") {
                    let hit = false;

                    for (this.rush_spins = 1; this.rush_spins <= max_spins; this.rush_spins++) {
                        await sleep(40);
                        
                        let remaining = max_spins - this.rush_spins;
                        document.getElementById("ui-spins").innerText = `ST残り: ${remaining}/${max_spins}`;

                        // 🎯 右打ち中リーチ確率 (1/92.3)
                        if (Math.random() < hitRate) {
                            hit = true;
                            addLog(`\n⏳ [ST ${this.rush_spins}回転目] リーチ成立！ 電チューチャージ中...`, "color-normal");
                            await sleep(1500); // 🌟 停頓營造抽獎緊張感

                            let right_r = Math.random() * 100;

                            // 4.0%: STリセット
                            if (right_r < 4.0) {
                                addLog(`💦 STリセット... (出玉なし)`, "color-fall");
                                addLog(`💪 気を取り直してST再開！`, "color-rush");
                            } 
                            // 出玉獲得 (89%期待度・実質96%の出玉振り分け)
                            else {
                                this.session_rush_count += 1;
                                addLog(`🎉 勝利！！ (總 ${this.session_rush_count}連)`, "color-hit");

                                if (right_r < 4.0 + 33.1) {
                                    this.session_payout += 1500;
                                    addLog(`✨ 1500 BONUS！ 1500玉獲得`, "color-hit");
                                } else if (right_r < 37.1 + 36.5) {
                                    this.session_payout += 3000;
                                    addLog(`💥 3000 BONUS！ 3000玉獲得`, "color-lt");
                                } else if (right_r < 73.6 + 20.2) {
                                    this.session_payout += 4500;
                                    addLog(`🔥 4500 BONUS！ 4500玉獲得`, "color-ultimate");
                                } else if (right_r < 93.8 + 5.6) {
                                    this.session_payout += 6000;
                                    addLog(`👑 6000 BONUS！！ 6000玉獲得！`, "color-ultimate");
                                } else {
                                    this.session_payout += 7500;
                                    addLog(`🌈 7500 BONUS！！！ 驚異の7500玉獲得！！`, "color-ultimate");
                                }
                                addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            }
                            
                            updateUI(); await sleep(1500);
                            break; // 擊中後跳出 for loop，重置 ST
                        }
                    }

                    // 💀 ST 消化完畢無中獎 (駆け抜け)
                    if (!hit) {
                        document.getElementById("ui-spins").innerText = `終了`;
                        let endMsg = (this.session_rush_count === initial_rush_count) ? `\n💀 ST終了 (駆け抜け)` : `\n💀 ST終了`;
                        addLog(endMsg, "color-fall");
                        addLog(`📈 總連莊数: ${this.session_rush_count}連 (含初當)`);
                        addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                        this.state = "NORMAL"; 
                        this.record_history(); 
                        updateUI();
                        break;
                    }
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0;
            }
        }

        let game = new Kinnikuman();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            addLog("\n=== キン肉マン ファイト開始！ ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
    <div style="position: fixed; bottom: 0; left: 0; width: 100%; background-color: rgba(0,0,0,0.8); z-index: 9999; text-align: center; padding: 5px 0; border-top: 1px solid #333;">

        <script type="text/javascript" src="//www.highperformanceformat.com/ead8f1e5fdd30faaed33da77b3333cf4/invoke.js"></script>
    </div>
</body>
</html>
