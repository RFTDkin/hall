<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eアクダマドライブ | パチンコシミュレーター</title>
    <meta name="machine-title" content="eアクダマドライブ">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050a0f;
            color: #ffffff;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #00e676;
            text-shadow: 0 0 10px #00e676;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #0a1520;
            border: 2px solid #00e676;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(0, 230, 118, 0.4);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffeb3b;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background: linear-gradient(180deg, #00c853 0%, #009624 100%);
            color: white;
            border: 1px solid #69f0ae;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00e676;
        }

        button:disabled {
            background: #223; border-color: #445; color: #778;
            cursor: not-allowed; transform: scale(1); box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #00e676;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-st { color: #00e676; font-weight: bold; }
        .color-lt { color: #ff1744; font-weight: 900; text-shadow: 0 0 10px #ff1744; font-size: 1.1em; }
        .color-hit { color: #ffeb3b; font-weight: bold; }
        .color-normal { color: #90a4ae; }
        .color-fall { color: #546e7a; font-weight: bold; }

        .data-lamp-container {
            background-color: #0a1015;
            border: 3px solid #00e676;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
        }

        .data-lamp-title {
            color: #00e676; margin-top: 0; margin-bottom: 15px; text-align: center;
            font-family: 'Courier New', Courier, monospace; letter-spacing: 2px;
        }

        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #334; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #112; color: #00e676; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #0c141a; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff1744; font-weight: bold;}
        .empty-row { color: #445 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.6em; color: #00e676;">eアクダマドライブ</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">現在回転数 <span id="ui-spins">0</span></div>
                <div class="stat-item">獲得出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">連チャン <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (直近10回)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>履歴</th>
                            <th>当選回転数</th>
                            <th>連チャン</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="4" class="empty-row">- 履歴なし -</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class AkudamaMachine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
                
                this.is_lt = false;
                this.hits_10r = 0;
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在の回転数: ${this.session_spins}`, "color-normal");
                }

                // 通常時 大当り確率 1/319.6[cite: 35]
                if (Math.random() < (1 / 319.6)) {
                    addLog(`\n[${this.session_spins} 回転] 💥 大当り当選！`, "color-hit");
                    await sleep(1000);

                    // 100% ST突入 (4R)[cite: 35]
                    this.session_payout += 600;
                    this.is_lt = false;
                    this.hits_10r = 0;

                    addLog(`✨ アクダマBONUS (4R)！ 600玉獲得！`, "color-hit");
                    addLog(`🔥 ドラマチックST (ST78回) 突入！`, "color-st");
                    
                    updateUI();
                    await sleep(1500);
                    await this.play_rush();
                    return true;
                }
                return false;
            }

            async play_rush() {
                this.state = "RUSH";
                
                // ST78回 or LT120回 + 残り保留4回[cite: 35]
                let max_st = this.is_lt ? 120 : 78;
                let st_remain = max_st + 4; 
                
                while (this.state === "RUSH" && st_remain > 0) {
                    await sleep(40); 
                    
                    let current_spin = (max_st + 4) - st_remain + 1;
                    let is_zan = current_spin > max_st;
                    
                    let stateName = this.is_lt ? "アクダマドライブ" : "ドラマチックST";
                    let phaseName = is_zan ? "残保留" : (this.is_lt ? "LT中" : "ST中");
                    let displayMax = is_zan ? 4 : max_st;
                    let displaySpin = is_zan ? (current_spin - max_st) : current_spin;

                    document.getElementById("ui-spins").innerText = `${phaseName}: ${displaySpin}/${displayMax}`;

                    // 右打ち 実質大当り確率 1/85.9[cite: 35]
                    if (Math.random() < (1 / 85.9)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [${phaseName} ${displaySpin}回転目] 大当り！`);
                        await sleep(1000);

                        // 残り保留での大当りはすべてST初回状態にリセット[cite: 35]
                        if (is_zan) {
                            if (this.is_lt) addLog(`⚠️ 残り保留での引き戻しにつき、通常STへ移行します`, "color-normal");
                            this.is_lt = false;
                            this.hits_10r = 0;
                        }

                        if (this.is_lt && !is_zan) {
                            // LT中の大当りはオール3000個[cite: 35]
                            this.session_payout += 3000;
                            addLog(`🌈 アクダマドライブBONUS！ 一撃3000玉獲得！`, "color-lt");
                            st_remain = 120 + 4;
                            max_st = 120;
                        } else {
                            // 通常ST中 (78回転 or 残り保留) の振り分け[cite: 35]
                            let r = Math.random();
                            if (r < 0.19) {
                                // 19% STリセット (出玉なし・段階進行は進まない)[cite: 35, 36]
                                addLog(`🔄 超回復！ STリセット (出玉なし)`, "color-normal");
                                st_remain = 78 + 4;
                                max_st = 78;
                            } else {
                                // 81% 10R 1500玉[cite: 35]
                                this.session_payout += 1500;
                                this.hits_10r++;
                                
                                // 2回目の10R獲得でLT発動[cite: 36]
                                if (this.hits_10r >= 2) {
                                    addLog(`✨ アクダマBONUS！ 1500玉獲得！`, "color-hit");
                                    await sleep(1000);
                                    addLog(`⚡ 大当り2回獲得達成！`, "color-hit");
                                    addLog(`🌈 ラッキートリガー発動！ アクダマドライブへ！`, "color-lt");
                                    
                                    this.is_lt = true;
                                    st_remain = 120 + 4;
                                    max_st = 120;
                                } else {
                                    addLog(`✨ アクダマBONUS！ 1500玉獲得！`, "color-hit");
                                    addLog(`🔥 ドラマチックST 継続！ (10R: ${this.hits_10r}回目)`, "color-st");
                                    st_remain = 78 + 4;
                                    max_st = 78;
                                }
                            }
                        }

                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        updateUI();
                        await sleep(2000);
                    } else {
                        st_remain--;
                    }
                }

                // 抜け
                if (this.state === "RUSH") {
                    await sleep(500);
                    addLog(`\n💀 決着... RUSH終了`, "color-fall");
                    addLog(`📈 総連チャン数: ${this.session_rush_count + 1}連 (初当り含む)`);
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                    this.state = "NORMAL";
                    this.record_history();
                    updateUI();
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new AkudamaMachine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 履歴なし -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== 遊技開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0 && game.state === "NORMAL") {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ 遊技続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>

</html>
