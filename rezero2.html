<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】e Re:ゼロから始める異世界生活 season2 | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050011;
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #d500f9;
            text-shadow: 0 0 15px rgba(213, 0, 249, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel {
            flex: 1;
            min-width: 320px;
            max-width: 500px;
        }

        .right-panel {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
        }

        .stats-board {
            background-color: #120024;
            border: 2px solid #d500f9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(213, 0, 249, 0.3);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #00e5ff;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #6200ea;
            color: white;
            border: 1px solid #d500f9;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            background-color: #3700b3;
            transform: scale(1.05);
            box-shadow: 0 0 10px #d500f9;
        }

        button:disabled {
            background-color: #311b92;
            border-color: #444;
            color: #777;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        #btn-reset {
            background-color: #424242;
            border-color: #616161;
        }

        #btn-reset:hover {
            background-color: #212121;
            box-shadow: 0 0 10px #616161;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #6200ea;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry {
            margin: 5px 0;
        }

        .color-rush {
            color: #00e5ff;
            font-weight: bold;
            text-shadow: 0 0 5px #00e5ff;
        }

        .color-hit {
            color: #ea80fc;
            font-weight: bold;
            text-shadow: 0 0 5px #ea80fc;
        }

        .color-normal {
            color: #9e9e9e;
        }

        .color-ultimate {
            color: #ff1744;
            font-weight: bold;
            text-shadow: 0 0 10px #ff1744;
            font-size: 1.1em;
        }

        .color-charge {
            color: #ff9100;
            font-weight: bold;
        }

        .color-fall {
            color: #757575;
            font-weight: bold;
        }

        .data-lamp-container {
            background-color: #0a001a;
            border: 3px solid #6200ea;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(98, 0, 234, 0.4);
        }

        .data-lamp-title {
            color: #d500f9;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #d500f9;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th,
        table.data-lamp td {
            border: 1px solid #6200ea;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th {
            background-color: #311b92;
            color: #b388ff;
            font-size: 0.9em;
        }

        table.data-lamp tr:nth-child(even) {
            background-color: #120024;
        }

        table.data-lamp td.hit-spins {
            color: #00e5ff;
            font-weight: bold;
        }

        table.data-lamp td.hit-rush {
            color: #69f0ae;
            font-weight: bold;
        }

        table.data-lamp td.hit-payout {
            color: #ea80fc;
        }

        .empty-row {
            color: #444 !important;
        }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">e Re:ゼロから始める異世界生活 season2</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="4" class="empty-row">- 無紀錄 -</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class ReZeroS2 {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 通常時 大当り確率 1/349.9
                if (Math.random() < (1 / 349.9)) {
                    addLog(`\n[${this.session_spins} 回轉] 🦋 図柄揃い大当り！`, "color-hit");
                    await this.normal_result();
                    return true;
                }
                return false;
            }

            async normal_result() {
                let r = Math.random();
                let enterRush = false;

                // 55% 突入 RUSH (10R×2回+α 約3000個+α)
                if (r < 0.55) {
                    let current_payout = 3000;
                    addLog("🌈 大兎殲滅戦BONUS 成功！ (3000個獲得)", "color-ultimate");
                    await sleep(1000);
                    
                    // 25% 上乘 Loop 停頓演出
                    let loop = true;
                    while(loop) {
                        addLog(`🔥 超強欲ループ 抽選中...`, "color-charge");
                        await sleep(1500); // 停頓等玩家有feel
                        
                        if(Math.random() < 0.25) {
                            current_payout += 1500;
                            addLog(`🌈 上乗せ成功！ +1500個！ (合計: ${current_payout}個)`, "color-ultimate");
                            await sleep(1000);
                        } else {
                            addLog(`🔄 上乗せ終了 (強欲RUSH突入)`, "color-normal");
                            loop = false;
                        }
                    }
                    
                    this.session_payout += current_payout;
                    enterRush = true;
                } else {
                    // 45% 通常 (10R 約1500個)
                    this.session_payout += 1500;
                    addLog("😭 10R 1500個獲得 (大兎殲滅戦BONUS 失敗... 通常終了)", "color-normal");
                }

                addLog(`💰 累積出玉: ${this.session_payout} 個`);
                updateUI();

                if (enterRush) {
                    await sleep(1000);
                    await this.play_rush();
                } else {
                    this.record_history();
                }
            }

            async play_rush() {
                addLog(`\n===== 🦋 強欲 RUSH (ST145回) 開始 =====`, "color-ultimate");
                this.state = "RUSH";
                let st_max = 145;
                let current_st = st_max;
                updateUI();

                while (this.state === "RUSH" && current_st > 0) {
                    await sleep(40);
                    let current_spin = st_max - current_st + 1;

                    document.getElementById("ui-spins").innerText = `RUSH中: ${current_spin}/${st_max}`;

                    // RUSH中 大当り確率: 1/99.9
                    if (Math.random() < (1 / 99.9)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [ST ${current_spin}回転] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");

                        let r = Math.random();
                        let payout_add = 0;

                        // RUSH 中振分: 25% (3000+α), 55% (1500), 20% (300)
                        if (r < 0.25) {
                            payout_add = 3000;
                            addLog(`🌈 10R×2回+α 超強欲BONUS (3000個獲得)!`, "color-ultimate");
                            await sleep(1000);
                            
                            // 25% 上乘 Loop 停頓演出
                            let loop = true;
                            while(loop) {
                                addLog(`🔥 超強欲ループ 抽選中...`, "color-charge");
                                await sleep(1500);
                                
                                if(Math.random() < 0.25) {
                                    payout_add += 1500;
                                    addLog(`🌈 上乗せ成功！ +1500個！ (合計: ${payout_add}個)`, "color-ultimate");
                                    await sleep(1000);
                                } else {
                                    addLog(`🔄 上乗せ終了 (RUSH継続)`, "color-normal");
                                    loop = false;
                                }
                            }
                        } else if (r < 0.80) { // 0.25 + 0.55 = 0.80
                            payout_add = 1500;
                            addLog(`💥 10R Re:ゼロBONUS 1500個獲得！`, "color-hit");
                        } else {
                            payout_add = 300;
                            addLog(`🎯 2R大当り 300個獲得！`, "color-charge");
                        }

                        this.session_payout += payout_add;
                        addLog(`💰 累積出玉: ${this.session_payout} 個`);
                        addLog("🦋 RUSH 継続!!", "color-rush");

                        current_st = st_max; // ST 回復
                        updateUI();
                        await sleep(800);
                    } else {
                        current_st--;
                    }
                }

                if (current_st === 0) {
                    document.getElementById("ui-spins").innerText = `終了`;
                    addLog("\n💀 ST抜け... RUSH終了", "color-fall");
                    this.end_rush();
                }
            }

            end_rush() {
                addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                addLog(`💰 最終出玉: ${this.session_payout} 個`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new ReZeroS2();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== ゲーム開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0 && game.state === "NORMAL") {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>

    <script src="plugin.js"></script>

    </div>
</body>
