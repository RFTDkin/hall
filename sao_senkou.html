<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eソードアート・オンライン〜閃光の軌跡〜 | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a000d;
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff4081;
            text-shadow: 0 0 15px rgba(255, 64, 129, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #2b0015;
            border: 2px solid #ff4081;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(255, 64, 129, 0.3);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #f48fb1;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #e91e63;
            color: #fff;
            border: 1px solid #ff80ab;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            background-color: #c2185b;
            transform: scale(1.05);
            box-shadow: 0 0 10px #ff4081;
        }

        button:disabled {
            background-color: #310015;
            border-color: #444;
            color: #777;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #ff4081;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #f48fb1; font-weight: bold; text-shadow: 0 0 5px #f48fb1; }
        .color-lt { color: #d500f9; font-weight: bold; text-shadow: 0 0 8px #d500f9; }
        .color-hit { color: #ff1744; font-weight: bold; text-shadow: 0 0 5px #ff1744; }
        .color-normal { color: #9e9e9e; }
        .color-ultimate { color: #ffea00; font-weight: bold; text-shadow: 0 0 10px #ffea00; font-size: 1.1em; }
        .color-fall { color: #757575; font-weight: bold; }

        .data-lamp-container {
            background-color: #1a000d;
            border: 3px solid #ff4081;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.4);
        }

        .data-lamp-title {
            color: #ff4081;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ff4081;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th, table.data-lamp td {
            border: 1px solid #ff4081;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th { background-color: #310015; color: #ff80ab; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #2b0015; }
        table.data-lamp td.hit-spins { color: #f48fb1; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #d500f9; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff1744; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">e SAO 〜閃光の軌跡〜 (1/199.9)</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class SaoSenkou {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 通常時 大当り確率 1/199.9
                if (Math.random() < (1 / 199.9)) {
                    addLog(`\n[${this.session_spins} 回轉] ⚔️ 図柄揃い大当り！`, "color-hit");
                    await this.normal_result();
                    return true;
                }
                return false;
            }

            async normal_result() {
                let r = Math.random();

                if (r < 0.01) {
                    // 1% LT直行
                    this.session_payout += 1500;
                    addLog("🌈 全回転リーチ！ EPILOGUE BONUS (10R 1500個)", "color-ultimate");
                    addLog("⚡ LT直行！ LIGHTNING RUSH (次回まで) 突入！", "color-lt");
                    await sleep(1500);
                    await this.play_rush("LIGHTNING_NEXT");
                } else if (r < 0.70) {
                    // 69% RUSH突入
                    this.session_payout += 300;
                    addLog("⚔️ 血盟DUEL BONUS (2R 300個) 勝利！", "color-rush");
                    addLog("🚀 SWORD RUSH (ST50回) 突入！", "color-rush");
                    await sleep(1000);
                    await this.play_rush("SWORD");
                } else {
                    // 30% 通常
                    this.session_payout += 300;
                    addLog("😭 血盟DUEL BONUS (2R 300個) 敗北... (通常終了)", "color-normal");
                    addLog(`💰 累積出玉: ${this.session_payout} 個`);
                    updateUI();
                    this.record_history();
                }
            }

            async play_rush(mode) {
                let isLightning = mode.startsWith("LIGHTNING");
                let st_max = mode === "SWORD" ? 50 : (mode === "LIGHTNING_NEXT" ? 10000 : 115);
                let current_st = st_max;
                
                let rushName = isLightning ? "LIGHTNING RUSH" : "SWORD RUSH";
                let colorClass = isLightning ? "color-lt" : "color-rush";
                let displayMax = st_max === 10000 ? '実質次回まで' : `ST${st_max}回`;
                
                addLog(`\n===== ⚔️ ${rushName} (${displayMax}) 開始 =====`, colorClass);
                this.state = "RUSH";
                updateUI();

                while (this.state === "RUSH" && current_st > 0) {
                    await sleep(40);
                    let current_spin = st_max - current_st + 1;
                    document.getElementById("ui-spins").innerText = `RUSH中: ${current_spin}/${st_max === 10000 ? '∞' : st_max}`;

                    // 右打ち中 実質確率 1/59.9
                    if (Math.random() < (1 / 59.9)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [${st_max === 10000 ? '次回まで' : 'ST'} ${current_spin}回転] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");

                        let r = Math.random();
                        let nextMode = "";
                        
                        if (!isLightning) {
                            // --- SWORD RUSH 中 振り分け ---
                            if (r < 0.03) {
                                this.session_payout += 1500;
                                addLog(`🌈 EPILOGUE BONUS！ 10R 1500個獲得！`, "color-ultimate");
                                addLog(`⚡ 次回まで ＋ ラッキートリガー 発動！！`, "color-ultimate");
                                nextMode = "LIGHTNING_NEXT";
                            } else if (r < 0.30) { // 3% + 27%
                                this.session_payout += 1500;
                                addLog(`⚡ LAST ATTACK CHANCE 成功！！ 10R 1500個獲得！`, "color-lt");
                                addLog(`🚀 LIGHTNING RUSH (LT) 突入！`, "color-lt");
                                nextMode = "LIGHTNING";
                                await sleep(1000);
                            } else if (r < 0.70) { // 30% + 40%
                                this.session_payout += 1500;
                                addLog(`💥 10R大当り 1500個獲得！`, "color-hit");
                                nextMode = "SWORD";
                            } else {
                                this.session_payout += 300;
                                addLog(`🎯 2R大当り 300個獲得`, "color-normal");
                                nextMode = "SWORD";
                            }
                        } else {
                            // --- LIGHTNING RUSH 中 振り分け ---
                            if (r < 0.225) {
                                this.session_payout += 1500;
                                addLog(`🌈 10R大当り 1500個獲得！ ＋ 次回まで濃厚！`, "color-ultimate");
                                nextMode = "LIGHTNING_NEXT";
                            } else if (r < 0.70) { // 22.5% + 47.5%
                                this.session_payout += 1500;
                                addLog(`💥 10R大当り 1500個獲得！`, "color-hit");
                                nextMode = "LIGHTNING";
                            } else {
                                this.session_payout += 300;
                                addLog(`🎯 2R大当り 300個獲得`, "color-normal");
                                nextMode = "LIGHTNING";
                            }
                        }
                        
                        addLog(`💰 累積出玉: ${this.session_payout} 個`);
                        await sleep(800);
                        
                        // 再帰的に次のRUSHへ
                        await this.play_rush(nextMode);
                        return;
                    } else {
                        current_st--;
                    }
                }

                if (current_st === 0) {
                    await this.play_zanboryu();
                }
            }
            
            async play_zanboryu() {
                addLog(`\n⏳ 残り保留 4回転... (SWORD RUSH 振り分け)`, "color-normal");
                updateUI();
                
                for(let i = 1; i <= 4; i++) {
                    await sleep(500);
                    document.getElementById("ui-spins").innerText = `残保留: ${i}/4`;
                    
                    if (Math.random() < (1 / 59.9)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [残保留 ${i}回転] 奇跡の引き戻し！！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                        
                        // 残り保留での大当りはすべて SWORD RUSH と同じ振り分け
                        let r = Math.random();
                        let nextMode = "";
                        
                        if (r < 0.03) {
                            this.session_payout += 1500;
                            addLog(`🌈 EPILOGUE BONUS！ 10R 1500個獲得！`, "color-ultimate");
                            addLog(`⚡ 次回まで ＋ ラッキートリガー 発動！！`, "color-ultimate");
                            nextMode = "LIGHTNING_NEXT";
                        } else if (r < 0.30) {
                            this.session_payout += 1500;
                            addLog(`⚡ LAST ATTACK CHANCE 成功！！ 10R 1500個獲得！`, "color-lt");
                            addLog(`🚀 LIGHTNING RUSH (LT) 突入！`, "color-lt");
                            nextMode = "LIGHTNING";
                        } else if (r < 0.70) {
                            this.session_payout += 1500;
                            addLog(`💥 10R大当り 1500個獲得！`, "color-hit");
                            nextMode = "SWORD";
                        } else {
                            this.session_payout += 300;
                            addLog(`🎯 2R大当り 300個獲得`, "color-normal");
                            nextMode = "SWORD";
                        }
                        
                        addLog(`💰 累積出玉: ${this.session_payout} 個`);
                        await sleep(1000);
                        await this.play_rush(nextMode);
                        return;
                    }
                }
                
                addLog(`💀 決着... RUSH終了`, "color-fall");
                this.end_rush();
            }

            end_rush() {
                addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                addLog(`💰 最終出玉: ${this.session_payout} 個`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new SaoSenkou();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== ゲーム開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0 && game.state === "NORMAL") {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>

</html>
