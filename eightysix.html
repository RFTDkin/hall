<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eエイティシックス | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10;
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #45a29e;
            text-shadow: 0 0 15px rgba(69, 162, 158, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #1f2833;
            border: 2px solid #45a29e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(69, 162, 158, 0.3);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #66fcf1;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #45a29e;
            color: #0b0c10;
            border: 1px solid #66fcf1;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            background-color: #66fcf1;
            color: #0b0c10;
            transform: scale(1.05);
            box-shadow: 0 0 10px #66fcf1;
        }

        button:disabled {
            background-color: #1f2833;
            border-color: #444;
            color: #777;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #45a29e;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #66fcf1; font-weight: bold; text-shadow: 0 0 5px #66fcf1; }
        .color-hit { color: #ff5252; font-weight: bold; text-shadow: 0 0 5px #ff5252; }
        .color-normal { color: #9e9e9e; }
        .color-ultimate { color: #ffeb3b; font-weight: bold; text-shadow: 0 0 10px #ffeb3b; font-size: 1.1em; }
        .color-blood { color: #d50000; font-weight: bold; text-shadow: 0 0 8px #d50000; }
        .color-fall { color: #757575; font-weight: bold; }

        .data-lamp-container {
            background-color: #0b0c10;
            border: 3px solid #45a29e;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(69, 162, 158, 0.4);
        }

        .data-lamp-title {
            color: #66fcf1;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #66fcf1;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th, table.data-lamp td {
            border: 1px solid #45a29e;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th { background-color: #1f2833; color: #66fcf1; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #12181f; }
        table.data-lamp td.hit-spins { color: #66fcf1; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff5252; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">eエイティシックス (1/239.1)</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class EightySix {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 通常時 大当り確率 1/239.1
                if (Math.random() < (1 / 239.1)) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い大当り！`, "color-hit");
                    await this.normal_result();
                    return true;
                }
                return false;
            }

            async normal_result() {
                let r = Math.random();

                if (r < 0.005) {
                    // 0.5% 直行 LT
                    this.session_payout += 4500;
                    addLog("🌈 全回転リーチ当り！ 4500個獲得", "color-ultimate");
                    addLog("🚀 Operation86 (LT) 突入！", "color-rush");
                    await sleep(1500);
                    await this.play_operation86();
                } else if (r < 0.55) {
                    // 54.5% 突破チャレンジ
                    this.session_payout += 300;
                    addLog("⚔️ 86BONUS 300個獲得 (突破チャレンジ突入！)", "color-rush");
                    await sleep(1000);
                    await this.play_breakthrough();
                } else {
                    // 45.0% 通常終了
                    this.session_payout += 300;
                    addLog("😭 86BONUS 300個獲得 (通常終了)", "color-normal");
                    addLog(`💰 累積出玉: ${this.session_payout} 個`);
                    updateUI();
                    this.record_history();
                }
            }

            async play_breakthrough() {
                addLog(`\n===== ⚔️ 突破チャレンジ (5 VS 5) 開始 =====`, "color-rush");
                await sleep(1500);

                // 突破成功率約55% (包含LAST JUDGE 29%)
                // 扣除 Last Judge，實際戰鬥勝率約 36.6%
                let battle_win = Math.random() < 0.366;

                if (battle_win) {
                    this.session_rush_count += 1;
                    addLog(`🎉 敵全滅！突破成功！`, "color-hit");
                    await this.generate_rush_payout(); // 出玉抽選
                    await this.play_operation86();
                } else {
                    addLog(`💀 味方全滅... (突破失敗)`, "color-fall");
                    await sleep(1000);
                    await this.play_last_judge();
                }
            }

            async play_last_judge() {
                addLog(`\n⚖️ LAST JUDGE (1回転) 抽選中...`, "color-ultimate");
                await sleep(2000); // 緊張感

                // 引き戻し期待度 約29%
                if (Math.random() < 0.29) {
                    this.session_rush_count += 1;
                    addLog(`🌈 引き戻し大成功！！`, "color-ultimate");
                    await this.generate_rush_payout();
                    await this.play_operation86();
                } else {
                    addLog(`💀 LAST JUDGE 失敗... 終了`, "color-fall");
                    this.end_rush();
                }
            }

            async play_operation86() {
                addLog(`\n===== 🚀 Operation86 (LT) 開始 =====`, "color-ultimate");
                this.state = "RUSH";
                updateUI();

                // LT継続率約79% (包含LAST JUDGE 29%)
                // 扣除 Last Judge，實際戰鬥勝率約 70.4%
                let in_lt = true;

                while (in_lt && this.state === "RUSH") {
                    await sleep(500);
                    addLog(`⚔️ 敵と交戦中... (5 VS 3)`, "color-normal");
                    await sleep(1000);

                    if (Math.random() < 0.704) {
                        this.session_rush_count += 1;
                        addLog(`🎉 敵全滅！BONUS獲得！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                        await this.generate_rush_payout();
                        addLog("🚀 Operation86 継続!!", "color-rush");
                        updateUI();
                        await sleep(800);
                    } else {
                        addLog(`💀 味方全滅...`, "color-fall");
                        in_lt = false;
                        await sleep(1000);
                        await this.play_last_judge();
                    }
                }
            }

            async generate_rush_payout() {
                let r = Math.random();
                
                // RUSH中振分: 70% 1500個, 30% 300個
                if (r < 0.30) {
                    this.session_payout += 300;
                    addLog(`🎯 BONUS 300個獲得`, "color-normal");
                } else {
                    this.session_payout += 1500;
                    addLog(`💥 1500BONUS 獲得！`, "color-hit");
                    
                    // 1500BONUS獲得時の約30%でキリヤ血戦突入
                    if (Math.random() < 0.30) {
                        await sleep(1000);
                        await this.play_kiriya_blood();
                    }
                }
                
                addLog(`💰 累積出玉: ${this.session_payout} 個`);
                updateUI();
            }

            async play_kiriya_blood() {
                addLog(`\n🩸 キリヤ血戦 突入！！ (上乗せ特化BONUS)`, "color-blood");
                await sleep(1500);
                
                let blood_active = true;
                let battle_count = 1;

                // 最大5戦，V獲得期待度 約70%
                while (blood_active && battle_count <= 5) {
                    addLog(`🔥 ${battle_count}戦目 V獲得 抽選中...`, "color-charge");
                    await sleep(1500);

                    // 🌟 修正：1戦目はV獲得濃厚
                    let winRate = (battle_count === 1) ? 1.0 : 0.70;
                    
                    if (Math.random() < winRate) {
                        // V獲得成功
                        if (battle_count < 5) {
                            // 1~4戰: 70% 1500個, 30% 300個
                            let add_payout = (Math.random() < 0.70) ? 1500 : 300;
                            this.session_payout += add_payout;
                            addLog(`🌈 V獲得！ ${add_payout}個 上乗せ！`, "color-ultimate");
                            battle_count++;
                        } else {
                            // 第5戰 (完走): 50% 4500個, 50% 4800個
                            let add_payout = (Math.random() < 0.50) ? 4500 : 4800;
                            this.session_payout += add_payout;
                            addLog(`👑 最終決戦 勝利！ ${add_payout}個 極上乗せ！！`, "color-ultimate");
                            blood_active = false; // 完走結束
                        }
                    } else {
                        // V獲得失敗
                        addLog(`💀 敗北... 上乗せ終了`, "color-fall");
                        blood_active = false;
                    }
                    await sleep(1000);
                }
            }

            end_rush() {
                addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                addLog(`💰 最終出玉: ${this.session_payout} 個`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new EightySix();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== ゲーム開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0 && game.state === "NORMAL") {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>

</html>
