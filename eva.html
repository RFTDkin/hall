<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】e新世紀エヴァンゲリオン | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #080012;
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #76ff03;
            text-shadow: 0 0 15px rgba(118, 255, 3, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel {
            flex: 1;
            min-width: 320px;
            max-width: 500px;
        }

        .right-panel {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
        }

        .stats-board {
            background-color: #1a0029;
            border: 2px solid #9c27b0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(156, 39, 176, 0.5);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #76ff03;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background: linear-gradient(180deg, #9c27b0 0%, #6a1b9a 100%);
            color: white;
            border: 1px solid #e040fb;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #e040fb;
        }

        button:disabled {
            background: #2a0b38;
            border-color: #444;
            color: #777;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #6a1b9a;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #e040fb; font-weight: bold; text-shadow: 0 0 5px #e040fb; }
        .color-hit { color: #76ff03; font-weight: bold; text-shadow: 0 0 5px #76ff03; }
        .color-normal { color: #b39ddb; }
        .color-ultimate { color: #ffea00; font-weight: 900; text-shadow: 0 0 10px #ffea00; font-size: 1.1em; }
        .color-fall { color: #757575; font-weight: bold; }

        .data-lamp-container {
            background-color: #0d0015;
            border: 3px solid #6a1b9a;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(106, 27, 154, 0.5);
        }

        .data-lamp-title {
            color: #e040fb;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #e040fb;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th,
        table.data-lamp td {
            border: 1px solid #4a148c;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th {
            background-color: #311b92;
            color: #b39ddb;
            font-size: 0.9em;
        }

        table.data-lamp tr:nth-child(even) { background-color: #1a0029; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #76ff03; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #e040fb; }
        .empty-row { color: #444 !important; }
    </style>
<link rel="stylesheet" href="mobile.css">
</head>

<body>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">e新世紀エヴァンゲリオン</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 出撃 (遊技開始)</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="4" class="empty-row">- 無紀錄 -</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class Evangelion {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_step() {
                if (this.state === "NORMAL") return await this.play_normal();
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 🌟 完美單次抽獎：分拆「図柄」與「Charge」 🌟
                let roll = Math.random();

                // 🎯 路線 1: 図柄揃い (1/399.9)
                if (roll < (1 / 399.9)) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い當選！`, "color-hit");

                    let r = Math.random();
                    // 0.5% 10R ST / 50% 2R ST / 49.5% 2R 時短100回
                    if (r < 0.005) {
                        this.session_payout += 1500;
                        addLog("🌈 金7図柄揃い！ 10R 1500玉獲得 ＋ IMPACT MODE突入！", "color-ultimate");
                        updateUI(); await sleep(1000); await this.play_rush();
                    } else if (r < 0.505) {
                        this.session_payout += 300;
                        addLog("🔥 奇数図柄！ 2R 300玉獲得 ＋ IMPACT MODE突入！", "color-rush");
                        updateUI(); await sleep(1000); await this.play_rush();
                    } else {
                        this.session_payout += 300;
                        addLog("💧 偶数図柄揃い... 2R 300玉獲得 (チャンスタイム 100回へ)", "color-normal");
                        updateUI(); await sleep(1000); await this.play_jitan();
                    }
                    return true;
                }
                // ⚡ 路線 2: エヴァチャージ (機率疊加至合算 1/349.9)
                else if (roll < (1 / 349.9)) {
                    addLog(`\n[${this.session_spins} 回轉] ⚡ エヴァチャージ 發生！`, "color-charge");
                    
                    let r = Math.random();
                    // 🌟 1% 奇蹟入RUSH / 99% 無時短通常終了 🌟
                    if (r < 0.01) {
                        this.session_payout += 300;
                        addLog("🌈 奇跡のチャージ昇格！ 2R 300玉獲得 ＋ IMPACT MODE突入！", "color-ultimate");
                        updateUI(); await sleep(1000); await this.play_rush();
                    } else {
                        this.session_payout += 300;
                        addLog("💥 チャージ終了... 2R 300玉獲得 (通常へ戻る)", "color-fall");
                        updateUI();
                        this.record_history();
                    }
                    return true;
                }

                return false;
            }

            async play_jitan() {
                addLog(`\n===== ⏱️ チャンスタイム (時短100回) 開始 =====`, "color-normal");
                this.state = "JITAN";
                let jitan_max = 100;
                let current_jitan = 0;
                updateUI();

                while (this.state === "JITAN" && current_jitan < jitan_max) {
                    await sleep(40);
                    current_jitan++;
                    this.session_spins++; 
                    document.getElementById("ui-spins").innerText = `時短中: ${current_jitan}/${jitan_max}`;

                    // 時短中の大当り確率: 1/399.9 (引き戻し約22%)
                    if (Math.random() < (1 / 399.9)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 引き戻し成功！ (${current_jitan}回転目で大当り)`, "color-hit");

                        // 特図2 振り分け (右打ち)
                        let r2 = Math.random();
                        let payout = (r2 < 0.005) ? 4800 : 2400;
                        this.session_payout += payout;

                        if (payout === 4800) {
                            addLog(`👑 奇跡の 0.5%！ 8R×4回 4800玉獲得！`, "color-ultimate");
                        } else {
                            addLog(`💥 右打ち大当り！ 8R×2回 2400玉獲得！`, "color-hit");
                        }

                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        updateUI();
                        await sleep(1000);
                        await this.play_rush();
                        return; 
                    }
                }

                addLog("\n💀 引き戻し失敗... チャンスタイム終了", "color-fall");
                addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            async play_rush() {
                addLog(`\n===== 覚醒 IMPACT MODE (ST157回) 開始 =====`, "color-ultimate");
                this.state = "RUSH";
                let st_max = 157;
                let current_st = st_max;
                updateUI();

                while (this.state === "RUSH" && current_st > 0) {
                    await sleep(40);
                    let current_spin = st_max - current_st + 1;
                    document.getElementById("ui-spins").innerText = `ST中: ${current_spin}/${st_max}`;

                    // ST中の大当り確率: 1/99.6
                    if (Math.random() < (1 / 99.6)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [ST ${current_spin}回転] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");

                        // 特図2 振り分け (右打ち)
                        let r2 = Math.random();
                        let payout = (r2 < 0.005) ? 4800 : 2400;
                        this.session_payout += payout;

                        if (payout === 4800) {
                            addLog(`👑 超覚醒 0.5%！ 8R×4回 4800玉獲得！`, "color-ultimate");
                        } else {
                            addLog(`💥 ALL2400個！ 8R×2回 2400玉獲得！`, "color-hit");
                        }

                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        addLog("⚡ IMPACT MODE 継続!!", "color-rush");

                        current_st = st_max; // ST回復
                        updateUI();
                        await sleep(800);
                    } else {
                        current_st--;
                    }
                }

                if (current_st === 0) {
                    document.getElementById("ui-spins").innerText = `ST中: ${st_max}/${st_max}`;
                    addLog("\n💀 ST抜け... RUSH終了", "color-fall");
                    addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                    this.state = "NORMAL";
                    this.record_history();
                    updateUI();
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new Evangelion();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== エヴァ、出撃！ ===", "color-hit");

            while (isPlaying) {
                let ended = await game.play_step();
                updateUI();

                if (game.session_spins % 100 === 0 && game.state === "NORMAL") {
                    await sleep(10);
                }

                if (ended) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="plugin.js"></script>

</body>
