<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eフィーバー妖怪ウォッチ | パチンコシミュレーター</title>
    <meta name="machine-title" content="e妖怪ウォッチ">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a0b00; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #ff5722; text-shadow: 0 0 15px rgba(255, 87, 34, 0.7); font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #2b1100; border: 2px solid #ff5722; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(255, 87, 34, 0.5); }
        .stat-item span { display: block; font-weight: bold; color: #ff9100; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #e64a19 0%, #bf360c 100%); color: white; border: 1px solid #ff5722; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #ff5722; }
        button:disabled { background: #3e1a00; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #ff5722; border-radius: 5px; height: 400px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-yodel { color: #ff5722; font-weight: bold; text-shadow: 0 0 5px #ff5722; } /* ジバニャン色 */
        .color-koma { color: #00b0ff; font-weight: bold; text-shadow: 0 0 5px #00b0ff; } /* コマさん色 */
        .color-final { color: #d500f9; font-weight: bold; text-shadow: 0 0 5px #d500f9; } /* 最終決戦色 */
        .color-3000 { color: #ffea00; font-weight: 900; text-shadow: 0 0 15px #ffea00; font-size: 1.1em; } 
        .color-hit { color: #ff1744; font-weight: bold; }
        .color-normal { color: #bdbdbd; }
        .color-fall { color: #757575; font-weight: bold; }
        .data-lamp-container { background-color: #2b1100; border: 3px solid #ff5722; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(255, 87, 34, 0.5); }
        .data-lamp-title { color: #ff9100; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #ff9100; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #bf360c; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #4a1c00; color: #ffea00; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #331400; }
        table.data-lamp td.hit-spins { color: #ffea00; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff5722; font-weight: bold; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>
<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">eフィーバー妖怪ウォッチ</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 妖怪メダル セット</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        class YokaiWatch {
            constructor() { this.state = "NORMAL"; this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.history = []; this.rush_spins = 0; }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉数: ${this.session_spins}`, "color-normal");

                // 1/319.7 初当り抽選
                if (Math.random() < 1 / 319.7) {
                    this.session_rush_count = 1;
                    let roll = Math.random();
                    
                    if (roll < 0.005) { // 0.5% 3000玉 + ヨーデル
                        this.session_payout += 3000;
                        addLog(`\n[${this.session_spins} 回轉] 🌈 全回転ムービー等！ (3000玉)`, "color-3000");
                        addLog("🚀 ヨーデルSONIC怪闘 直行！！", "color-yodel");
                        this.state = "YODEL";
                    } else if (roll < 0.500) { // 49.5% 300玉 + ヨーデル
                        this.session_payout += 300;
                        addLog(`\n[${this.session_spins} 回轉] 🎯 真打FEVER！ (300玉)`, "color-hit");
                        addLog("🔥 ヨーデルSONIC怪闘 突入！", "color-yodel");
                        this.state = "YODEL";
                    } else { // 50% 300玉 + コマチャレンジ
                        this.session_payout += 300;
                        addLog(`\n[${this.session_spins} 回轉] 🎯 妖怪FEVER (300玉)`, "color-hit");
                        addLog("❄️ 演出失敗... コマチャレンジ(時短100回)へ", "color-koma");
                        this.state = "KOMA";
                    }
                    
                    updateUI(); await sleep(1500);
                    
                    while (this.state !== "NORMAL") {
                        if (this.state === "YODEL") await this.play_yodel();
                        else if (this.state === "FINAL") await this.play_final();
                        else if (this.state === "KOMA") await this.play_koma();
                    }
                    return true;
                }
                return false;
            }

            async play_yodel() {
                addLog(`\n===== 🔥 ヨーデルSONIC怪闘 (転落or大当り) =====`, "color-yodel");
                this.rush_spins = 0;
                let hit = false, fall = false;
                
                while(true) {
                    await sleep(40);
                    this.rush_spins++;
                    document.getElementById("ui-spins").innerText = `怪闘中: ${this.rush_spins}回転`;

                    // ガチのダブル抽選
                    let rHit = Math.random() < (1 / 47.6);
                    let rFall = Math.random() < (1 / 88.0);

                    if (rHit) { hit = true; break; }
                    if (rFall) { fall = true; break; } // 同時当選時は当り優先
                }

                if (hit) {
                    this.session_rush_count += 1;
                    addLog(`\n🎉 [怪闘 ${this.rush_spins}回転目] 当選！ (總 ${this.session_rush_count}連)`, "color-hit");
                    
                    let r = Math.random();
                    if (r < 0.057) {
                        // ウバウネ決戦 3000玉 + α
                        this.session_payout += 3000;
                        addLog(`🌈 ウバウネ決戦！！ 3000玉 獲得！`, "color-3000");
                        updateUI(); await sleep(800);
                        
                        // 50%ループで1500玉上乗せ
                        let loop_count = 0;
                        while(Math.random() < 0.50) {
                            loop_count++;
                            this.session_payout += 1500;
                            addLog(`   ⚡ 追撃の1500玉 上乗せ成功！！ (計+${loop_count*1500})`, "color-3000");
                            updateUI(); await sleep(600);
                        }
                        if (loop_count > 0) addLog(`▶ 怒涛のループ終了！`, "color-3000");
                        
                    } else if (r < 0.284) {
                        // エンマインパクト 3000玉 (5.7 + 22.7 = 28.4%)
                        this.session_payout += 3000;
                        addLog(`👑 エンマインパクト等！ 3000玉 獲得！`, "color-3000");
                    } else {
                        // SONIC FEVER 1500玉
                        this.session_payout += 1500;
                        addLog(`▶ SONIC FEVER！ 1500玉 獲得`, "color-yodel");
                    }
                    
                    addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                    this.state = "YODEL";
                    updateUI(); await sleep(1000);
                } else if (fall) {
                    addLog(`\n⚠️ [怪闘 ${this.rush_spins}回転目] 転落の危機... 最終決戦へ`, "color-final");
                    this.state = "FINAL";
                    await sleep(1000);
                }
            }

            async play_final() {
                addLog(`\n===== ⚔️ 最終決戦 (1球勝負) =====`, "color-final");
                document.getElementById("ui-spins").innerText = `最終決戦`;
                await sleep(1000);
                
                // 1/4 で勝利
                if (Math.random() < 0.25) {
                    this.session_rush_count += 1;
                    this.session_payout += 1500;
                    addLog(`🌈 勝利！！ 1500玉 獲得！`, "color-hit");
                    addLog(`🚀 ヨーデルSONIC怪闘 復帰！！`, "color-yodel");
                    addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                    this.state = "YODEL";
                    updateUI(); await sleep(1500);
                } else {
                    addLog(`💀 敗北... まだだ！ コマチャレンジへ！`, "color-koma");
                    this.state = "KOMA";
                    await sleep(1000);
                }
            }

            async play_koma() {
                addLog(`\n===== ❄️ コマチャレンジ (時短100回転) =====`, "color-koma");
                let hit = false;
                
                for(let i = 1; i <= 100; i++) {
                    await sleep(40);
                    document.getElementById("ui-spins").innerText = `時短: ${i}/100`;
                    
                    // 実質 1/399.6
                    if (Math.random() < (1 / 399.6)) {
                        hit = true;
                        this.session_rush_count += 1;
                        this.session_payout += 1500;
                        addLog(`\n🎉 [時短 ${i}回転目] 引き戻し成功！！ (總 ${this.session_rush_count}連)`, "color-hit");
                        addLog(`▶ 1500玉 獲得！ ヨーデルSONIC怪闘 復帰！！`, "color-yodel");
                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        this.state = "YODEL";
                        updateUI(); await sleep(1500);
                        break;
                    }
                }
                
                if (!hit) {
                    document.getElementById("ui-spins").innerText = `終了`;
                    addLog(`\n💀 チャレンジ失敗... (RUSH終了)`, "color-fall");
                    addLog(`📈 總連莊数: ${this.session_rush_count}連`);
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                    this.state = "NORMAL"; 
                    this.record_history(); 
                    updateUI();
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.state = "NORMAL";
            }
        }

        let game = new YokaiWatch();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            addLog("\n=== eフィーバー妖怪ウォッチ 稼働開始！ ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
