<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】e女神のカフェテラス | パチンコシミュレーター</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1f000f; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #ff6090; text-shadow: 0 0 15px rgba(255, 96, 144, 0.7); font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #2e0016; border: 2px solid #ff6090; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(255, 96, 144, 0.5); }
        .stat-item span { display: block; font-weight: bold; color: #ffeb3b; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #ec407a 0%, #ad1457 100%); color: white; border: 1px solid #f48fb1; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #ff6090; }
        button:disabled { background: #38001b; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #d81b60; border-radius: 5px; height: 400px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-rush { color: #ffca28; font-weight: bold; text-shadow: 0 0 5px #ffca28; }
        .color-hit { color: #ff6090; font-weight: bold; text-shadow: 0 0 5px #ff6090; }
        .color-normal { color: #bdbdbd; }
        .color-lt { color: #ff5252; font-weight: 900; text-shadow: 0 0 15px #ff5252; font-size: 1.1em; }
        .color-ultimate { color: #e040fb; font-weight: 900; text-shadow: 0 0 15px #e040fb; font-size: 1.1em; }
        .color-fall { color: #757575; font-weight: bold; }
        .data-lamp-container { background-color: #2e0016; border: 3px solid #ff6090; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(255, 96, 144, 0.5); }
        .data-lamp-title { color: #f48fb1; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #f48fb1; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #d81b60; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #880e4f; color: #ffeb3b; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #4a0024; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff6090; font-weight: bold; }
        .empty-row { color: #444 !important; }

        /* 🌟 ブラックアウト演出 (女神彩蛋版) 🌟 */
        .blackout-overlay {
            position: fixed; inset: 0; z-index: 20000; display: flex; align-items: center; justify-content: center; pointer-events: none; 
            background: #000;
            opacity: 0; visibility: hidden;
        }
        .blackout-overlay::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background: 
                radial-gradient(ellipse 150% 6% at center, #000000 5%, #ff007f 12%, #ffd700 22%, #ff6090 40%, transparent 60%),
                radial-gradient(ellipse 8% 55% at center, #000000 5%, #ff007f 15%, #ffd700 25%, #ff6090 45%, transparent 65%),
                #ffffff;
            opacity: 0;
            filter: contrast(1.5);
        }
        .blackout-overlay.is-active { visibility: visible; animation: blackout-bg 8s forwards; }
        .blackout-overlay.is-active::before { animation: blackout-flash 8s forwards; }
        .blackout-overlay.is-active .blackout-message { animation: blackout-text 8s forwards; }

        .blackout-message { display: flex; flex-direction: column; align-items: center; gap: 0.2em; font-family: "Arial Black", Impact, sans-serif; font-size: clamp(1.5rem, 5vw, 4rem); line-height: 1.2; letter-spacing: 0.04em; text-align: center; transform: scale(0.8); opacity: 0; }
        
        .blackout-rainbow {
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00e5ff, #c500ff, #ff0000);
            background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: blackout-rainbow 2s linear infinite; filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.75)); font-weight: 900;
        }
        @keyframes blackout-rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        @keyframes blackout-bg { 0% { opacity: 0; } 2%, 85% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        @keyframes blackout-flash {
            0% { opacity: 0; transform: scale(0.2) scaleY(0.05); filter: brightness(2); }
            2% { opacity: 1; transform: scale(1) scaleY(1); filter: brightness(2); }
            10% { opacity: 0; transform: scale(1.5) scaleY(2); filter: brightness(1); }
            100% { opacity: 0; }
        }
        @keyframes blackout-text { 
            0%, 33% { opacity: 0; transform: scale(1.35); } 
            40%, 80% { opacity: 1; transform: scale(1); } 
            100% { opacity: 0; transform: scale(0.96); } 
        }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>
    <div id="blackout-overlay" class="blackout-overlay" aria-hidden="true">
        <div class="blackout-message">
            <div class="blackout-rainbow" style="font-size: 0.8em;">にゃんにゃんにゃんにゃん</div>
            <div class="blackout-rainbow" style="font-size: 0.5em;">約1/907000テラスチャージ昇格</div>
            <div class="blackout-rainbow" style="font-size: 0.9em;">なんでこんなに運がいいの！？おめでとう！！！</div>
        </div>
    </div>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">e女神のカフェテラス</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        let audioUnlocked = false;

        function playBlackout演出() {
            try {
                if (window.audioCtx) {
                    if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
                    const ctx = window.audioCtx;
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const filter = ctx.createBiquadFilter();
                    const gainNode = ctx.createGain();

                    osc1.type = 'sine'; osc1.frequency.setValueAtTime(200, ctx.currentTime); osc1.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);
                    osc2.type = 'square'; osc2.frequency.setValueAtTime(150, ctx.currentTime); osc2.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.2);
                    filter.type = 'lowpass'; filter.frequency.setValueAtTime(800, ctx.currentTime); filter.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4);
                    gainNode.gain.setValueAtTime(0.001, ctx.currentTime); gainNode.gain.linearRampToValueAtTime(1.0, ctx.currentTime + 0.05); gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);

                    osc1.connect(gainNode); osc2.connect(filter); filter.connect(gainNode); gainNode.connect(ctx.destination);
                    osc1.start(ctx.currentTime); osc2.start(ctx.currentTime); osc1.stop(ctx.currentTime + 1.2); osc2.stop(ctx.currentTime + 1.2);
                }
            } catch (e) { console.log(e); }

            const overlay = document.getElementById("blackout-overlay");
            if (!overlay) return sleep(8000);
            overlay.classList.remove("is-active");
            void overlay.offsetWidth;
            overlay.classList.add("is-active");
            return sleep(8000).then(() => { overlay.classList.remove("is-active"); });
        }
        class CafeTerrace {
            constructor() { this.state = "NORMAL"; this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.history = []; this.rush_spins = 0; }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉数: ${this.session_spins}`, "color-normal");

                let roll = Math.random();

                // 🎯 路線 1: 通常時大当り確率 (1/399)
                if (roll < 1 / 399.0) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い當選！`, "color-hit");
                    let r = Math.random();
                    this.session_payout += 300;

                    if (r < 0.40) {
                        addLog("🎀 女神のカフェテラス BONUS 成功！ (300玉)", "color-ultimate");
                        addLog("🌈 女神の交響曲TIME (ST100回) 突入！！", "color-lt");
                        this.session_rush_count = 1;
                        updateUI(); await sleep(2000);
                        await this.play_rush();
                    } else {
                        addLog("💦 女神のカフェテラス BONUS 失敗... (300玉)", "color-normal");
                        addLog("💀 通常へ戻る", "color-normal");
                        updateUI(); this.record_history();
                    }
                    return true;
                } 
                // ⚡ 路線 2: テラスチャージ (1/2721)
                else if (roll < (1 / 399.0) + (1 / 2721.0)) {
                    addLog(`\n[${this.session_spins} 回轉] ⚡ テラスチャージ 發生！`, "color-normal");
                    
                    // 0.3% 奇蹟昇格判定
                    if (Math.random() < 0.003) {
                        this.session_payout += 300;
                        addLog(`んんんんんんん？？？`, "color-normal");
                        await sleep(2000);
                        // 播放神級彩蛋 Blackout
                        await playBlackout演出();
                        
                        addLog(`🌈 約1/907000の奇跡！テラスチャージ昇格発生！`, "color-ultimate");
                        addLog("🌈 女神の交響曲TIME (ST100回) 突入！！", "color-lt");
                        
                        this.session_rush_count = 1;
                        updateUI(); 
                        await sleep(1500);
                        await this.play_rush();
                    } else {
                        this.session_payout += 300;
                        addLog("💦 昇格なし... 300玉獲得 (通常終了)", "color-fall");
                        updateUI(); this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_rush() {
                this.state = "ST";
                let max_spins = 100;
                let hitRate = 1 / 73.0;
                let modeName = "女神の交響曲TIME";
                
                addLog(`\n===== ☕ ${modeName} =====`, "color-lt");
                
                let initial_rush_count = this.session_rush_count;
                let isFirstHit = true; // 🌟 標記 LT 初回 (不發生吐息CHANCE)
                updateUI();

                while (this.state === "ST") {
                    let hit = false;

                    for (this.rush_spins = 1; this.rush_spins <= max_spins; this.rush_spins++) {
                        await sleep(40);
                        
                        let remaining = max_spins - this.rush_spins;
                        document.getElementById("ui-spins").innerText = `ST残り: ${remaining}/${max_spins}`;

                        // 🎯 右打ち中大当り抽選 (1/73)
                        if (Math.random() < hitRate) {
                            hit = true;
                            this.session_rush_count += 1;
                            addLog(`\n🎉 [ST ${this.rush_spins}回転目] 當選！ (總 ${this.session_rush_count}連)`, "color-hit");

                            let right_r = Math.random();
                            let currentPayout = 0;

                            // 25%: 4500個 + α
                            if (right_r < 0.25) {
                                currentPayout = 4500;
                                this.session_payout += currentPayout;
                                addLog(`💋 胸のせBONUS！！ 4500玉獲得！`, "color-ultimate");
                                updateUI();
                                
                                // 🌟 吐息CHANCE (LT初回は発生しない)
                                if (!isFirstHit) {
                                    let inToiki = true;
                                    let loopCount = 0;

                                    while (inToiki) {
                                        addLog(`⏳ 吐息CHANCE... (25%で上乗せ)`, "color-normal");
                                        await sleep(1500); // 🌟 停頓 1.5 秒營造緊張感

                                        if (Math.random() < 0.25) {
                                            loopCount++;
                                            let rr = Math.random();
                                            let added = 0;

                                            if (rr < 0.25) { added = 4500; addLog(`💋 ム、ム、ム、胸のせ！！吐息CHANCE成功！！ +4500玉 (計 ${this.session_payout + added}玉)`, "color-ultimate"); }
                                            else if (rr < 0.75) { added = 3000; addLog(`💋 モ、モ、モ、腿のせ！！吐息CHANCE成功！！ +3000玉 (計 ${this.session_payout + added}玉)`, "color-lt"); }
                                            else { added = 1500; addLog(`💋 吐息CHANCE成功！！ +1500玉 (計 ${this.session_payout + added}玉)`, "color-hit"); }

                                            this.session_payout += added;
                                            updateUI();
                                            await sleep(1000);

                                            // 只有再次中 4500 先可以繼續 Loop
                                            if (added !== 4500) {
                                                inToiki = false;
                                                addLog(`💨 上乗せ終了`, "color-normal");
                                            }
                                        } else {
                                            if (loopCount === 0) { addLog(`💦 チャンスならず...`, "color-fall"); } 
                                            else { addLog(`💨 上乗せ終了`, "color-normal"); }
                                            inToiki = false;
                                        }
                                    }
                                } else {
                                    addLog(`ℹ️ LT初回は SeaSide RUSHスタートのため、吐息CHANCEは発生しません。`, "color-normal");
                                }
                            } 
                            // 50%: 3000個
                            else if (right_r < 0.75) {
                                currentPayout = 3000;
                                this.session_payout += currentPayout;
                                addLog(`💥 女神BONUS！腿のせ！！ 3000玉獲得`, "color-lt");
                            } 
                            // 25%: 1500個
                            else {
                                currentPayout = 1500;
                                this.session_payout += currentPayout;
                                addLog(`✨ BONUS！ 1500玉獲得`, "color-hit");
                            }
                            
                            isFirstHit = false; // 解除初回標記
                            addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            updateUI(); await sleep(1500);
                            break; // 擊中後跳出 for loop，重置 ST
                        }
                    }

                    // 💀 ST 消化完畢無中獎 (駆け抜け)
                    if (!hit) {
                        document.getElementById("ui-spins").innerText = `終了`;
                        let endMsg = (this.session_rush_count === initial_rush_count) ? `\n💀 ST抜け... ${modeName}終了 (駆け抜け)` : `\n💀 ST抜け... ${modeName}終了`;
                        addLog(endMsg, "color-fall");
                        addLog(`📈 總連莊数: ${this.session_rush_count}連 (含初當)`);
                        addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                        this.state = "NORMAL"; 
                        this.record_history(); 
                        updateUI();
                        break;
                    }
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0;
            }
        }

        let game = new CafeTerrace();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            
            // 👇 加入解鎖音效代碼 👇
            if (!audioUnlocked) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    window.audioCtx = new AudioContextClass();
                    if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
                }
                audioUnlocked = true;
            }
            // 👆 加入完畢 👆

            addLog("\n=== 女神のカフェテラス 開店！ ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>

        <script type="text/javascript" src="//www.highperformanceformat.com/ead8f1e5fdd30faaed33da77b3333cf4/invoke.js"></script>
    </div>
</body>
