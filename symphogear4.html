<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eフィーバー戦姫絶唱シンフォギア4F | パチンコシミュレーター</title>
    <meta name="machine-title" content="eフィーバー戦姫絶唱シンフォギア4F">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0208;
            color: #e0e0e0;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff9100;
            text-shadow: 0 0 15px rgba(255, 145, 0, 0.7);
            font-weight: 900;
            letter-spacing: 1px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel, .right-panel {
            flex: 1;
            min-width: 320px;
            max-width: 500px;
        }

        .stats-board {
            background-color: #210000;
            border: 2px solid #ff1744;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(255, 23, 68, 0.4);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffd600;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #d50000;
            color: white;
            border: 1px solid #ff1744;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: 0.2s;
        }

        button:hover {
            background-color: #ff1744;
            box-shadow: 0 0 15px #ff1744;
        }

        button:disabled {
            background-color: #424242;
            border-color: #616161;
            color: #9e9e9e;
            cursor: not-allowed;
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #ff9100;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #ff3d00; font-weight: bold; text-shadow: 0 0 5px #ff3d00; }
        .color-hit { color: #ffd600; font-weight: bold; }
        .color-normal { color: #90caf9; }
        .color-ultimate { color: #d500f9; font-weight: bold; text-shadow: 0 0 10px #d500f9; font-size: 1.1em; }
        .color-burning { color: #ff1744; font-weight: bold; text-shadow: 0 0 15px #ff1744, 0 0 20px #ffea00; font-size: 1.3em; }
        .color-vstock { color: #00e5ff; font-weight: bold; text-shadow: 0 0 10px #00e5ff; }
        .color-charge { color: #4caf50; }
        .color-fall { color: #757575; font-style: italic; }

        .data-lamp-container {
            background-color: #1a0000;
            border: 3px solid #ff1744;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.4);
        }

        .data-lamp-title {
            color: #ff9100; margin-top: 0; margin-bottom: 15px;
            text-align: center; text-shadow: 0 0 5px #ff9100; letter-spacing: 2px;
        }

        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #ff5252; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #b71c1c; color: #ffd600; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #3e2723; }
        table.data-lamp td.hit-spins { color: #ffd600; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #69f0ae; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff8a80; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>
    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.5em; color: #ffffff;">eフィーバー戦姫絶唱シンフォギア4F</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr><th>前次</th><th>當選回轉數</th><th>連莊數</th><th>獲得出玉</th></tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class Symphogear4Machine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 抽選 1/399.7 (図柄揃い)
                let hit_399 = Math.random() < (1 / 399.7);
                // 抽選 1/266.4 (戦姫チャージ)
                let hit_266 = Math.random() < (1 / 266.4);

                if (hit_399) {
                    let enterRush = Math.random() < 0.50; // 50% 突入
                    this.session_payout += 1500;
                    
                    addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い大当り！ (1/399)`, "color-hit");
                    addLog(`💎 1500玉獲得`, "color-hit");
                    updateUI();
                    
                    if (enterRush) {
                        addLog("🔥 最終決戦突破！ 絶唱RUSH突入！", "color-rush");
                        await sleep(1000);
                        await this.play_rush(15);
                    } else {
                        addLog("💀 RUSH非突入... 通常へ", "color-fall");
                        this.record_history();
                    }
                    return true;
                }
                else if (hit_266) {
                    let enterRush = Math.random() < 0.001; // 0.1% 突入
                    this.session_payout += 192;
                    
                    addLog(`\n[${this.session_spins} 回轉] 🔋 戦姫チャージ當選 (1/266)`, "color-charge");
                    addLog(`💧 192玉獲得`, "color-charge");
                    updateUI();
                    
                    if (enterRush) {
                        addLog("🌈 奇跡の昇格！ 絶唱RUSH直行！！！", "color-ultimate");
                        await sleep(1000);
                        await this.play_rush(15);
                    } else {
                        // チャージ後通常時は履歴を残してカウンタをリセットする
                        this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_rush(initial_st) {
                this.state = "RUSH";
                let current_st = initial_st; // 15 or 10000
                updateUI();
                addLog(`\n===== ⚔️ 絶唱RUSH (ST ${current_st}回) 開始 =====`, "color-rush");

                while (this.state === "RUSH" && current_st > 0) {
                    await sleep(400);
                    let current_spin = (initial_st === 10000) ? 
                        `∞ (${10000 - current_st + 1}轉)` : 
                        `${initial_st - current_st + 1}/${initial_st}`;
                    
                    document.getElementById("ui-spins").innerText = `RUSH中: ${current_spin}`;

                    // 右打ち中実質確率 1/10.9
                    if (Math.random() < (1 / 10.9)) {
                        this.session_rush_count += 1;
                        let processing_v_stock = true;
                        let next_st = 15; // 預設下一轉ST為15
                        
                        addLog(`\n🎉 [ST ${current_spin}] RUSH 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");

                        // V-STOCK 無限重抽迴圈
                        while(processing_v_stock) {
                            let r = Math.random();
                            await sleep(500);
                            
                            // 5% バーニングエクスドライブ (3000 + V-STOCK)
                            if (r < 0.05) {
                                addLog(`🔥 バーニングエクスドライブ！！！ (3000玉)`, "color-burning");
                                addLog(`⚡ 限界突破！ V-STOCK獲得 (継続濃厚)`, "color-vstock");
                                this.session_payout += 3000;
                                updateUI();
                                this.session_rush_count += 1;
                                // V-STOCK 繼續抽
                            } 
                            // 5% 3000 + ST10000
                            else if (r < 0.10) {
                                addLog(`🌈 SPECIAL絶唱FEVER3000！！！`, "color-ultimate");
                                addLog(`🚀 次回大当り濃厚 (ST 10000回)`, "color-normal");
                                this.session_payout += 3000;
                                next_st = 10000;
                                processing_v_stock = false;
                            } 
                            // 40% 3000 + ST15
                            else if (r < 0.50) {
                                addLog(`🌈 SPECIAL絶唱FEVER3000！！！`, "color-ultimate");
                                this.session_payout += 3000;
                                next_st = 15;
                                processing_v_stock = false;
                            } 
                            // 5% 1500 + V-STOCK
                            else if (r < 0.55) {
                                addLog(`✨ SPECIAL FEVER (1500玉)`, "color-hit");
                                addLog(`⚡ V-STOCK獲得 (継続濃厚)`, "color-vstock");
                                this.session_payout += 1500;
                                updateUI();
                                this.session_rush_count += 1;
                                // V-STOCK 繼續抽
                            } 
                            // 5% 1500 + ST10000
                            else if (r < 0.60) {
                                addLog(`✨ SPECIAL FEVER (1500玉)`, "color-hit");
                                addLog(`🚀 次回大当り濃厚 (ST 10000回)`, "color-normal");
                                this.session_payout += 1500;
                                next_st = 10000;
                                processing_v_stock = false;
                            } 
                            // 40% 1500 + ST15
                            else {
                                addLog(`✨ SPECIAL FEVER (1500玉)`, "color-hit");
                                this.session_payout += 1500;
                                next_st = 15;
                                processing_v_stock = false;
                            }
                        }

                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        current_st = next_st;
                        initial_st = next_st; // 更新 UI 顯示用的分母
                        updateUI();
                        await sleep(800);
                    } 
                    else {
                        current_st--;
                    }
                }

                if (current_st === 0) {
                    document.getElementById("ui-spins").innerText = `終了`;
                    addLog(`\n💀 ST終了... RUSH 終了`, "color-fall");
                    addLog(`📈 總連莊數: ${this.session_rush_count + 1}連`);
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);

                    this.state = "NORMAL";
                    this.record_history();
                    updateUI();
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new Symphogear4Machine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            addLog("\n=== スマパチ シンフォギア4F 開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (hit) { isPlaying = false; break; }
            }
            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ 繼續遊技";
        }
    </script>
    
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
