<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】P ソードアート・オンライン LT | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #e0e0e0;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ffca28;
            text-shadow: 0 0 15px rgba(255, 202, 40, 0.7);
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #161b22;
            border: 2px solid #ffca28;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(255, 202, 40, 0.5);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #4fc3f7;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #c2185b; /* 預設紅色系 */
            color: white;
            border: 1px solid #ff4081;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        button:hover { background-color: #e91e63; box-shadow: 0 0 10px #ff4081; }
        button:disabled { background-color: #1a2a3a; border-color: #444; color: #777; cursor: not-allowed; box-shadow: none; }
        
        #btn-reset { background-color: #424242; border-color: #616161; }
        #btn-reset:hover { background-color: #212121; box-shadow: 0 0 10px #616161; }

        .log-container {
            background-color: #000000;
            border: 1px solid #ffca28;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-wou { color: #ff5252; font-weight: bold; text-shadow: 0 0 10px #ff5252; font-size: 1.1em; }
        .color-sword { color: #00e676; font-weight: bold; text-shadow: 0 0 5px #00e676; }
        .color-hit { color: #ffca28; font-weight: bold; }
        .color-normal { color: #9e9e9e; }
        .color-fall { color: #757575; font-style: italic; }

        .data-lamp-container {
            background-color: #0d1117;
            border: 3px solid #ffca28;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(255, 202, 40, 0.4);
        }

        .data-lamp-title {
            color: #ffca28;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ffca28;
            letter-spacing: 2px;
        }

        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #c2185b; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #161b22; color: #ffca28; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #10141a; }
        table.data-lamp td.hit-spins { color: #ffca28; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #ff5252; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #4fc3f7; font-weight: bold; }
        .empty-row { color: #555 !important; }

        .blackout-overlay {
            position: fixed;
            inset: 0;
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            background: #000;
            opacity: 0;
            visibility: hidden;
        }

        .blackout-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 150% 6% at center, #000 5%, #0011ff 12%, #ffd700 22%, #00aaff 40%, transparent 60%),
                radial-gradient(ellipse 8% 55% at center, #000 5%, #0011ff 15%, #ffd700 25%, #00aaff 45%, transparent 65%),
                #fff;
            opacity: 0;
            filter: contrast(1.5);
        }

        .blackout-overlay.is-active { opacity: 1; visibility: visible; }
        .blackout-overlay.is-active::before { animation: blackout-flash 6s forwards; }
        .blackout-message {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 1.3em;
            font-family: "Arial Black", Impact, sans-serif;
            font-size: clamp(1.8rem, 7vw, 5rem);
            line-height: 1.2;
            letter-spacing: 0.04em;
            text-align: center;
        }

        .blackout-line {
            display: none;
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00e5ff, #c500ff, #ff0000);
            background-size: 200% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.75));
            font-weight: 900;
        }

        .blackout-line.is-visible {
            display: block;
            animation: blackout-line-pop 0.7s ease-out, blackout-rainbow 2s linear infinite;
        }

        @keyframes blackout-rainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes blackout-flash {
            0% { opacity: 0; transform: scale(0.2) scaleY(0.05); filter: brightness(2); }
            2% { opacity: 1; transform: scale(1) scaleY(1); filter: brightness(2); }
            10%, 100% { opacity: 0; transform: scale(1.5) scaleY(2); filter: brightness(1); }
        }

        @keyframes blackout-line-pop {
            0% { opacity: 0; transform: scale(0.65); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 🌟 特殊動畫圖層基礎設定 🌟 */
        .special-overlay {
            position: fixed; inset: 0; z-index: 25000;
            background: rgba(0, 0, 0, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.3s;
        }
        .special-overlay.is-active { opacity: 1; visibility: visible; }
        .special-title { font-size: 2.5em; text-shadow: 0 0 10px currentColor; letter-spacing: 5px; }

        /* 🎰 轉盤樣式 */
        .roulette-box { position: relative; width: 320px; height: 320px; margin-top: 20px; }
        .roulette-pointer {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            font-size: 50px; color: #ff5252; z-index: 10; text-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }
        .roulette-wheel {
            width: 100%; height: 100%; border-radius: 50%;
            /* 🌟 改成 6 等份 (每份 60 度)，最後一格加入紅色突顯 9000+α */
            background: conic-gradient(
                #161b22 0deg 60deg, 
                #c2185b 60deg 120deg, 
                #161b22 120deg 180deg, 
                #c2185b 180deg 240deg, 
                #161b22 240deg 300deg, 
                #ff5252 300deg 360deg
            );
            border: 6px solid #ffca28; box-shadow: 0 0 30px rgba(255, 202, 40, 0.5);
            position: relative; overflow: hidden;
            transition: transform 10s cubic-bezier(0.1, 0.8, 0.2, 1); 
        }
        .r-seg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: center center; }
        .r-num {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            font-size: 32px; font-weight: 900; color: white; text-shadow: 0 0 8px #000;
        }

        /* 💨 左至右滑動數字樣式 */
        .slide-container { 
            position: relative; /* 🌟 修正疊字：改為 relative，等佢乖乖排喺標題下面 🌟 */
            width: 100%; 
            display: flex; justify-content: flex-start; overflow: hidden; 
            padding: 20px 0; /* 加返少少上下空間，無咁擠迫 */
        }
        .slide-number {
            font-size: clamp(6rem, 15vw, 12rem); font-family: 'Courier New', monospace; font-weight: 900;
            background: linear-gradient(90deg, #fff, #ffca28, #ff5252); -webkit-background-clip: text; color: transparent;
            letter-spacing: 5px; filter: drop-shadow(0 0 15px rgba(255, 82, 82, 0.6));
            /* 預設收埋喺畫面極左邊 (利用自身闊度 100% 完美隱藏) */
            transform: translateX(-100%); 
        }

        .special-overlay.is-active .slide-number {
            animation: creep-reveal 7.5s linear forwards;
        }

        /* 🌟 神級懸念時間軸：利用自身闊度百分比，確保每次只露一個 0！ 🌟 */
        @keyframes creep-reveal {
            0% { transform: translateX(-100%); }
            10% { transform: translateX(-80%); } /* 啱啱好露出最後一個 0 */
            25% { transform: translateX(-50%); } /* 極度緩慢擠出第二、第三個 0 */
            35% { transform: translateX(-35%); } /* 第三個數字繼續慢慢出現 */
            55% { transform: translateX(-20%); } /* 第四個數字先露出一半 */
            75% { transform: translateX(calc(50vw - 50%)); } /* 最後先瞬間飛入正中心！ */
            100% { transform: translateX(calc(50vw - 50%)); }
        }
    </style>

<body>

    <div id="blackout-overlay" class="blackout-overlay" aria-hidden="true">
        <div class="blackout-message">
            <div id="blackout-line" class="blackout-line"></div>
        </div>
    </div>

    <!-- 🌟 ぼくの英雄 / 咲け、花たち 專用轉盤動畫 🌟 -->
    <div id="roulette-overlay" class="special-overlay" aria-hidden="true">
        <h2 id="roulette-title" class="special-title">ぼくの英雄</h2>
        <div class="roulette-box">
            <div class="roulette-pointer">▼</div>
            <div class="roulette-wheel" id="roulette-wheel">
                <div class="r-seg" style="transform: rotate(0deg);"><span class="r-num">3000</span></div>
                <div class="r-seg" style="transform: rotate(60deg);"><span class="r-num">4500</span></div>
                <div class="r-seg" style="transform: rotate(120deg);"><span class="r-num">6000</span></div>
                <div class="r-seg" style="transform: rotate(180deg);"><span class="r-num">7500</span></div>
                <div class="r-seg" style="transform: rotate(240deg);"><span class="r-num">9000</span></div>
                <div class="r-seg" style="transform: rotate(300deg);"><span class="r-num" style="color: #ffea00; font-size: 26px; top: 10px;">9000<br>+α</span></div>
            </div>
        </div>
    </div>

    <!-- 🌟 SWORD DRIVE 專用左至右滑動數字動畫 🌟 -->
    <div id="slide-overlay" class="special-overlay" aria-hidden="true">
        <h2 class="special-title" style="color: #ffca28; margin-bottom: 50px;">SWORD DRIVE 獲得玉數</h2>
        <div class="slide-container">
            <div id="slide-number" class="slide-number">6000</div>
        </div>
    </div>

    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.6em; color: #4fc3f7;">P ソードアート・オンライン (SAO)</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ LINK START</button>
                
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉数</th>
                            <th>連莊数</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        let audioUnlocked = false;
        let youtubeApiPromise;

        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return Promise.resolve();
            if (youtubeApiPromise) return youtubeApiPromise;

            youtubeApiPromise = new Promise(resolve => {
                const previousReady = window.onYouTubeIframeAPIReady;
                window.onYouTubeIframeAPIReady = () => {
                    if (previousReady) previousReady();
                    resolve();
                };

                const script = document.createElement('script');
                script.src = 'https://www.youtube.com/iframe_api';
                document.head.appendChild(script);
            });

            return youtubeApiPromise;
        }

        class SaoMachine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = []; 
            }

            // 🌟 ぼくの英雄 / 咲け、花たち (完美 Loop 版)
            async play_plus_alpha_loop(name) {
                addLog(`\n🌈 ${name} 発動！！！`, "color-wou");
                let driving = true;
                let display_total = 0;
                let loop_count = 1; // 紀錄係第幾次轉
                
                while (driving) {
                    // 🌟 測試必中 +α 可以將下面改成： let sd = loop_count === 1 ? 0.999 : Math.random();
                    let sd = Math.random();
                    let current_gain = 0;
                    let is_to_bonus = false;
                    let is_in_drive = false;
                    
                    if (sd < 0.082) { current_gain = 3000; } 
                    else if (sd < 0.363) { current_gain = 3000; } 
                    else if (sd < 0.724) { current_gain = 4500; } 
                    else if (sd < 0.931) { current_gain = 6000; } 
                    else if (sd < 0.975) { current_gain = 7500; } 
                    else if (sd < 0.990) { current_gain = 9000; is_to_bonus = true; } 
                    else { current_gain = 7500; is_in_drive = true; }
                    
                    // 1. 播轉盤 (如果中 1G連，指針向 9000+α)
                    let roulette_target = is_in_drive ? "9000+α" : current_gain;
                    let display_title = loop_count > 1 ? `+α 追擊！` : name;
                    await playRouletteAnimation(display_title, roulette_target);
                    
                    // 2. 如果中 1G連，即刻播 STAY COOL！
                    if (is_in_drive) {
                        await playStayCoolBlackout();
                    }
                    
                    // 3. 消化今次抽出嚟嘅玉數
                    let chunks = current_gain / 1500;
                    for (let i = 0; i < chunks; i++) {
                        display_total += 1500;
                        this.session_payout += 1500;
                        this.session_rush_count++; 
                        addLog(`✨ V-STOCK 消化！ (+1500)  [計: ${display_total}]`, "color-hit");
                        updateUI();
                        await sleep(250);
                    }

                    if (is_to_bonus) addLog(`✨ ９０００BONUS！！！`, "color-hit");
                    if (is_in_drive) addLog(`⚡ ９０００✙α！！！ (ループ継続)`, "color-wou");
                    
                    // 4. 判斷係咪繼續
                    if (!is_in_drive) {
                        driving = false; 
                    }
                    loop_count++;
                }
                
                addLog(`👑 ${name} トータル: ${display_total}個 獲得！`);
            }

            // 🌟 SWORD DRIVE 專用 (完美 Loop 版)
            async play_sword_drive_loop() {
                addLog(`\n🌈 神器解放 SWORD DRIVE 発動！！！`, "color-wou");
                let driving = true;
                let display_total = 0;
                let loop_count = 1;
                
                while (driving) {
                    // 🌟 測試必中 DRIVE in DRIVE 可以將下面改成： let sd = loop_count === 1 ? 0.999 : Math.random();
                    let sd = Math.random();
                    let current_gain = 0;
                    let is_to_bonus = false;
                    let is_in_drive = false;
                    
                    if (sd < 0.082) { current_gain = 1500; }
                    else if (sd < 0.363) { current_gain = 3000; } 
                    else if (sd < 0.724) { current_gain = 4500; } 
                    else if (sd < 0.931) { current_gain = 6000; } 
                    else if (sd < 0.975) { current_gain = 7500; } 
                    else if (sd < 0.990) { current_gain = 9000; is_to_bonus = true; } 
                    else { current_gain = 7500; is_in_drive = true; }
                    
                    // 1. 播滑動數字
                    await playSlideAnimation(current_gain);
                    
                    // 2. 如果中 DRIVE in DRIVE，數字顯示 7500 後突襲 STAY COOL！
                    if (is_in_drive) {
                        await playStayCoolBlackout();
                    }
                    
                    // 3. 消化今次抽出嚟嘅玉數
                    let chunks = current_gain / 1500;
                    for (let i = 0; i < chunks; i++) {
                        display_total += 1500;
                        this.session_payout += 1500;
                        this.session_rush_count++;
                        addLog(`✨ SWORD DRIVE 獲得！ (+1500) [計: ${display_total}]`, "color-hit");
                        updateUI();
                        await sleep(250);
                    }

                    if (is_to_bonus) addLog(`✨ DRIVE to BONUS ！ (9000BONUS)`, "color-hit");
                    if (is_in_drive) addLog(`🔥 DRIVE in DRIVE 発生！！ (1G連継続)`, "color-wou");
                    
                    // 4. 判斷係咪繼續
                    if (!is_in_drive) {
                        driving = false; 
                    }
                    loop_count++;
                }
                
                addLog(`👑 SWORD DRIVE トータル: ${display_total}個 獲得！`);
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 大当り確率: 1/199.9
                if (Math.random() < (1 / 199.9)) {
                    let r = Math.random();
                    
                    // 1.5% 直行 War of Underworld
                    if (r < 0.015) {
                        addLog(`\n[${this.session_spins} 回轉] 🌈 全回転！！`, "color-wou");
                        await playHeroBlackout演出();
                        
                        await this.play_plus_alpha_loop("Epilogue BONUS (ぼくの英雄)");
                        
                        addLog(`🔥 War of Underworld (上位ST) 直行！`, "color-wou");
                        this.state = "WOU";
                        await this.play_rush();
                    } 
                    // 48.5% SWORD RUSH 突入
                    else if (r < 0.015 + 0.485) {
                        addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い (300玉)`, "color-hit");
                        this.session_payout += 300;
                        updateUI();
                        await sleep(1000);
                        addLog(`⚔️ SWORD RUSH (ST53回) 突入！`, "color-sword");
                        this.state = "SWORD";
                        await this.play_rush();
                    } 
                    // 50.0% 通常
                    else {
                        addLog(`\n[${this.session_spins} 回轉] 💧 図柄揃い (300玉)... 通常へ`, "color-normal");
                        this.session_payout += 300;
                        addLog(`💰 本次總出玉: ${this.session_payout} 玉`);
                        this.record_history();
                        updateUI();
                    }
                    return true;
                } 
                return false;
            }

            async play_rush() {
                let isPlayingRush = true;
                
                while (isPlayingRush) {
                    let st_max = this.state === "SWORD" ? 53 : 70;
                    let st_remaining = st_max;
                    let modeName = this.state === "SWORD" ? "SWORD RUSH" : "War of Underworld";
                    
                    addLog(`\n===== ${modeName} (ST${st_max}回) 開始 =====`, this.state === "SWORD" ? "color-sword" : "color-wou");
                    updateUI();

                    let hit = false;

                    while (st_remaining > 0) {
                        await sleep(50); 
                        st_remaining--;
                        document.getElementById("ui-spins").innerText = `ST残り: ${st_remaining}/${st_max}`;

                        // 右打ち中確率: 1/51.6
                        if (Math.random() < (1 / 51.6)) {
                            let used_spin = st_max - st_remaining;
                            addLog(`\n🎯 大当り！ (${used_spin}回転目)`, "color-hit");
                            
                            let pr = Math.random();

                            if (this.state === "SWORD") {
                                // --- SWORD RUSH 振分 ---
                                if (pr < 0.11) {
                                    // 11% 咲け、花たち
                                    await this.play_plus_alpha_loop("咲け、花たち");
                                    addLog(`🔥 War of Underworld へ昇格！`, "color-wou");
                                    this.state = "WOU";
                                } else if (pr < 0.11 + 0.11) {
                                    // 11% 決意の刃・成功
                                    this.session_payout += 1500;
                                    this.session_rush_count++;
                                    addLog(`✨ 決意の刃 成功！ 1500個獲得！`, "color-hit");
                                    addLog(`🔥 War of Underworld へ昇格！`, "color-wou");
                                    this.state = "WOU";
                                } else if (pr < 0.11 + 0.11 + 0.33) {
                                    // 33% 決意の刃・失敗
                                    this.session_payout += 1500;
                                    this.session_rush_count++;
                                    addLog(`💧 決意の刃 失敗... 1500個獲得`, "color-hit");
                                    addLog(`⚔️ SWORD RUSH 継続`, "color-sword");
                                } else {
                                    // 45% BONUS
                                    this.session_payout += 1500;
                                    this.session_rush_count++;
                                    addLog(`✨ BONUS 1500個獲得`, "color-hit");
                                    addLog(`⚔️ SWORD RUSH 継続`, "color-sword");
                                }
                            } else {
                                // --- War of Underworld 振分 ---
                                if (pr < 0.40) {
                                    // 40% 発動 SWORD DRIVE
                                    await this.play_sword_drive_loop();
                                } else {
                                    // 60% BONUS
                                    this.session_payout += 1500;
                                    this.session_rush_count++;
                                    addLog(`✨ BONUS 1500個獲得`, "color-hit");
                                }
                                addLog(`🔥 War of Underworld 継続！`, "color-wou");
                            }

                            addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            updateUI();
                            await sleep(1500);
                            hit = true;
                            break; 
                        }
                    }

                    // ST 抜け
                    if (!hit) {
                        document.getElementById("ui-spins").innerText = `ST残り: 0/${st_max}`;
                        addLog(`\n💀 ST抜け... RUSH終了`, "color-fall");
                        addLog(`📈 總連莊數: ${this.session_rush_count}連`);
                        addLog(`💰 最終出玉: ${this.session_payout} 玉`);

                        this.state = "NORMAL";
                        this.record_history();
                        updateUI();
                        isPlayingRush = false;
                    }
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new SaoMachine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const btnReset = document.getElementById("btn-reset");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function playHeroBlackout演出() {
            const overlay = document.getElementById("blackout-overlay");
            const line = document.getElementById("blackout-line");
            const phrases = ["キリト　君なら", "もう一度立てる", "何度だって", "立ち上がれる", "ぼくの英雄"];

            try {
                if (window.audioCtx) {
                    if (window.audioCtx.state === "suspended") await window.audioCtx.resume();
                    const ctx = window.audioCtx;
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const filter = ctx.createBiquadFilter();
                    const gainNode = ctx.createGain();

                    osc1.type = "sine";
                    osc1.frequency.setValueAtTime(200, ctx.currentTime);
                    osc1.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);
                    osc2.type = "square";
                    osc2.frequency.setValueAtTime(150, ctx.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.2);
                    filter.type = "lowpass";
                    filter.frequency.setValueAtTime(800, ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4);
                    gainNode.gain.setValueAtTime(0.001, ctx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(1.0, ctx.currentTime + 0.05);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);
                    osc1.connect(gainNode);
                    osc2.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    osc1.start(ctx.currentTime);
                    osc2.start(ctx.currentTime);
                    osc1.stop(ctx.currentTime + 1.2);
                    osc2.stop(ctx.currentTime + 1.2);
                }
            } catch (error) {
                console.log(error);
            }

            if (!overlay || !line) return;
            overlay.classList.add("is-active");
            await sleep(3000);
            for (const phrase of phrases) {
                line.classList.remove("is-visible");
                void line.offsetWidth;
                line.innerText = phrase;
                line.classList.add("is-visible");
                await sleep(3000);
            }
            line.classList.remove("is-visible");
            overlay.classList.remove("is-active");
        }

        async function playStayCoolBlackout() {
            const overlay = document.getElementById("blackout-overlay");
            const line = document.getElementById("blackout-line");

            if (!overlay || !line) return;

            // 🎵 用返「ぼくの英雄」嗰個沉穩低頻嘅經典 Blackout 音效
            try {
                if (window.audioCtx && window.audioCtx.state !== "suspended") {
                    const ctx = window.audioCtx;
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const filter = ctx.createBiquadFilter();
                    const gainNode = ctx.createGain();

                    osc1.type = "sine";
                    osc1.frequency.setValueAtTime(200, ctx.currentTime);
                    osc1.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);
                    osc2.type = "square";
                    osc2.frequency.setValueAtTime(150, ctx.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.2);
                    filter.type = "lowpass";
                    filter.frequency.setValueAtTime(800, ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4);
                    gainNode.gain.setValueAtTime(0.001, ctx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(1.0, ctx.currentTime + 0.05);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);
                    osc1.connect(gainNode);
                    osc2.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    osc1.start(ctx.currentTime);
                    osc2.start(ctx.currentTime);
                    osc1.stop(ctx.currentTime + 1.2);
                    osc2.stop(ctx.currentTime + 1.2);
                }
            } catch (e) {}

            // 設定文字為兩行嘅 STAY COOL
            line.innerHTML = "STAY<br>COOL";
            line.classList.remove("is-visible");
            void line.offsetWidth;

            // 觸發全黑同彩虹字體動畫
            overlay.classList.add("is-active");
            line.classList.add("is-visible");

            // 畀玩家欣賞 3 秒
            await sleep(3000);

            line.classList.remove("is-visible");
            overlay.classList.remove("is-active");
        }

        async function playRouletteAnimation(title, targetAmount) {
            const overlay = document.getElementById('roulette-overlay');
            const wheel = document.getElementById('roulette-wheel');
            const titleEl = document.getElementById('roulette-title');
            
            titleEl.innerText = title;
            titleEl.style.color = title.includes("咲け") ? "#ff5252" : "#ffca28";

            // 🌟 更新：6個選項，每格相距 60 度
            const degMap = { 3000: 0, 4500: -60, 6000: -120, 7500: -180, 9000: -240, "9000+α": -300 };
            let targetDeg = degMap[targetAmount] || 0;
            
            let finalRotation = (360 * 6) + targetDeg;

            wheel.style.transition = 'none';
            wheel.style.transform = `rotate(0deg)`;
            void wheel.offsetWidth; 

            overlay.classList.add('is-active');
            
            // 🌟 節奏修改：配合 CSS 嘅 10 秒動畫
            wheel.style.transition = 'transform 10s cubic-bezier(0.1, 0.8, 0.2, 1)';
            wheel.style.transform = `rotate(${finalRotation}deg)`;
            
            // 🌟 等待時間加長至 10.5 秒，確保睇住佢慢慢停定
            await sleep(10500); 
            wheel.style.boxShadow = "0 0 50px #ff5252, inset 0 0 20px #ffca28"; 
            await sleep(1500);
            
            overlay.classList.remove('is-active');
            wheel.style.boxShadow = "0 0 30px rgba(255, 202, 40, 0.5)";
        }

        async function playSlideAnimation(totalAmount) {
            const overlay = document.getElementById('slide-overlay');
            const numberEl = document.getElementById('slide-number');
            
            numberEl.innerText = totalAmount;
            
            // 🌟 1. 重置狀態，並將數字「死死地封印住」，唔畀佢行住！
            numberEl.style.transition = 'none';
            numberEl.style.animation = 'none'; 
            numberEl.style.transform = 'translateX(-100%)'; 
            void numberEl.offsetWidth;     

            // 🌟 2. 畫面即刻變黑，畀玩家一種「入mode」嘅感覺，但數字未出
            overlay.classList.add('is-active');
            
            // 🎵 3. 等 YouTube 真正進入 PLAYING，唔只係等 iframe 載入
            const ytAudio = document.createElement('div');
            ytAudio.style.cssText = 'position: fixed; width: 1px; height: 1px; left: -9999px; top: -9999px;';
            const playerHost = document.createElement('div');
            ytAudio.appendChild(playerHost);
            document.body.appendChild(ytAudio);

            await loadYouTubeApi();
            let player;
            await new Promise(resolve => {
                let settled = false;
                const finish = () => {
                    if (settled) return;
                    settled = true;
                    resolve();
                };

                player = new YT.Player(playerHost, {
                    width: '1',
                    height: '1',
                    videoId: '5NokjNCbCY4',
                    playerVars: { autoplay: 1, start: 2, end: 9, controls: 0, playsinline: 1 },
                    events: {
                        onReady: event => event.target.playVideo(),
                        onStateChange: event => {
                            if (event.data === YT.PlayerState.PLAYING) finish();
                        }
                    }
                });

                // Autoplay 被瀏覽器封鎖時，唔好令動畫永久停住。
                setTimeout(finish, 2000);
            });

            // 🎶 歌已開始（或 autoplay 被封鎖後超時），先解除數字封印
            numberEl.style.animation = ''; 
            numberEl.style.transform = ''; 
            
            // 等待動畫播完 (7.5秒) + 畀玩家爽 0.5 秒
            await sleep(8000); 
            
            // 瞬間飛入正中嘅震撼放大
            numberEl.style.transition = 'transform 0.1s';
            numberEl.style.transform = 'translateX(calc(50vw - 50%)) scale(1.2)';
            await sleep(100);
            numberEl.style.transform = 'translateX(calc(50vw - 50%)) scale(1)';
            await sleep(1500);
            
            overlay.classList.remove('is-active');

            // 🧹 清理 YouTube 播放器
            if (player) player.destroy();
            ytAudio.remove();
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            if(btnReset) btnReset.disabled = true;

            if (!audioUnlocked) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    window.audioCtx = new AudioContextClass();
                    if (window.audioCtx.state === "suspended") await window.audioCtx.resume();
                }
                audioUnlocked = true;
            }

            addLog("\n=== LINK START ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0) {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            if(btnReset) btnReset.disabled = false;
            btnPlay.innerText = "▶️ 繼續打玉";
        }

        function resetGame() {
            game = new SaoMachine();
            logBox.innerHTML = "";
            renderHistoryTable([]);
            updateUI();
            addLog("遊戲紀錄已重置。", "color-normal");
            btnPlay.innerText = "▶️ LINK START";
        }
    </script>
