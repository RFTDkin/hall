<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柏青哥模擬器 (P ソードアート・オンライン LT)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #e0e0e0;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ffca28;
            text-shadow: 0 0 15px rgba(255, 202, 40, 0.7);
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #161b22;
            border: 2px solid #ffca28;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(255, 202, 40, 0.5);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #4fc3f7;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #c2185b; /* 預設紅色系 */
            color: white;
            border: 1px solid #ff4081;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        button:hover { background-color: #e91e63; box-shadow: 0 0 10px #ff4081; }
        button:disabled { background-color: #1a2a3a; border-color: #444; color: #777; cursor: not-allowed; box-shadow: none; }
        
        #btn-reset { background-color: #424242; border-color: #616161; }
        #btn-reset:hover { background-color: #212121; box-shadow: 0 0 10px #616161; }

        .log-container {
            background-color: #000000;
            border: 1px solid #ffca28;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-wou { color: #ff5252; font-weight: bold; text-shadow: 0 0 10px #ff5252; font-size: 1.1em; }
        .color-sword { color: #00e676; font-weight: bold; text-shadow: 0 0 5px #00e676; }
        .color-hit { color: #ffca28; font-weight: bold; }
        .color-normal { color: #9e9e9e; }
        .color-fall { color: #757575; font-style: italic; }

        .data-lamp-container {
            background-color: #0d1117;
            border: 3px solid #ffca28;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(255, 202, 40, 0.4);
        }

        .data-lamp-title {
            color: #ffca28;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ffca28;
            letter-spacing: 2px;
        }

        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #c2185b; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #161b22; color: #ffca28; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #10141a; }
        table.data-lamp td.hit-spins { color: #ffca28; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #ff5252; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #4fc3f7; font-weight: bold; }
        .empty-row { color: #555 !important; }
    </style>
<link rel="stylesheet" href="mobile.css">
</head>

<body>

    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.6em; color: #4fc3f7;">P ソードアート・オンライン (SAO)</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ LINK START</button>
                
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉数</th>
                            <th>連莊数</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class SaoMachine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = []; 
            }

            // 隨機產生 3000~9000+α 嘅函數
            getRandomHugeBonus() {
                const options = [3000, 4500, 6000, 7500, 9000];
                return options[Math.floor(Math.random() * options.length)];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 大当り確率: 1/199.9
                if (Math.random() < (1 / 199.9)) {
                    let r = Math.random();
                    
                    // 1.5% 直行 War of Underworld
                    if (r < 0.015) {
                        let bonus = this.getRandomHugeBonus();
                        addLog(`\n[${this.session_spins} 回轉] 🌈 Epilogue BONUS (ぼくの英雄)！`, "color-wou");
                        addLog(`✨ ${bonus}個 獲得！`, "color-hit");
                        this.session_payout += bonus;
                        updateUI();
                        await sleep(1500);
                        addLog(`🔥 War of Underworld (上位ST) 直行！`, "color-wou");
                        this.state = "WOU";
                        await this.play_rush();
                    } 
                    // 48.5% SWORD RUSH 突入
                    else if (r < 0.015 + 0.485) {
                        addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い (300玉)`, "color-hit");
                        this.session_payout += 300;
                        updateUI();
                        await sleep(1000);
                        addLog(`⚔️ SWORD RUSH (ST53回) 突入！`, "color-sword");
                        this.state = "SWORD";
                        await this.play_rush();
                    } 
                    // 50.0% 通常
                    else {
                        addLog(`\n[${this.session_spins} 回轉] 💧 図柄揃い (300玉)... 通常へ`, "color-normal");
                        this.session_payout += 300;
                        addLog(`💰 本次總出玉: ${this.session_payout} 玉`);
                        this.record_history();
                        updateUI();
                    }
                    return true;
                } 
                return false;
            }

            async play_rush() {
                let isPlayingRush = true;
                
                while (isPlayingRush) {
                    let st_max = this.state === "SWORD" ? 53 : 70;
                    let st_remaining = st_max;
                    let modeName = this.state === "SWORD" ? "SWORD RUSH" : "War of Underworld";
                    
                    addLog(`\n===== ${modeName} (ST${st_max}回) 開始 =====`, this.state === "SWORD" ? "color-sword" : "color-wou");
                    updateUI();

                    let hit = false;

                    while (st_remaining > 0) {
                        await sleep(30); 
                        st_remaining--;
                        document.getElementById("ui-spins").innerText = `ST残り: ${st_remaining}/${st_max}`;

                        // 右打ち中確率: 1/51.6
                        if (Math.random() < (1 / 51.6)) {
                            this.session_rush_count++;
                            let used_spin = st_max - st_remaining;
                            addLog(`\n🎯 大当り！ (${used_spin}回転目)`, "color-hit");
                            
                            let pr = Math.random();

                            if (this.state === "SWORD") {
                                // --- SWORD RUSH 振分 ---
                                if (pr < 0.11) {
                                    let bonus = this.getRandomHugeBonus();
                                    this.session_payout += bonus;
                                    addLog(`🌈 咲け、花たち！ ${bonus}個獲得！！！`, "color-wou");
                                    addLog(`🔥 War of Underworld へ昇格！`, "color-wou");
                                    this.state = "WOU";
                                } else if (pr < 0.11 + 0.11) {
                                    this.session_payout += 1500;
                                    addLog(`✨ 決意の刃 成功！ 1500個獲得！`, "color-hit");
                                    addLog(`🔥 War of Underworld へ昇格！`, "color-wou");
                                    this.state = "WOU";
                                } else if (pr < 0.11 + 0.11 + 0.33) {
                                    this.session_payout += 1500;
                                    addLog(`💧 決意の刃 失敗... 1500個獲得`, "color-hit");
                                    addLog(`⚔️ SWORD RUSH 継続`, "color-sword");
                                } else {
                                    this.session_payout += 1500;
                                    addLog(`✨ BONUS 1500個獲得`, "color-hit");
                                    addLog(`⚔️ SWORD RUSH 継続`, "color-sword");
                                }
                            } else {
                                // --- War of Underworld 振分 ---
                                if (pr < 0.40) {
                                    // 40% 發動 SWORD DRIVE (精準比例抽籤)
                                    let sd = Math.random();
                                    let sd_bonus = 0;
                                    if (sd < 0.082) sd_bonus = 1500;
                                    else if (sd < 0.082 + 0.281) sd_bonus = 3000;
                                    else if (sd < 0.082 + 0.281 + 0.361) sd_bonus = 4500;
                                    else if (sd < 0.082 + 0.281 + 0.361 + 0.207) sd_bonus = 6000;
                                    else if (sd < 0.082 + 0.281 + 0.361 + 0.207 + 0.044) sd_bonus = 7500;
                                    else if (sd < 0.082 + 0.281 + 0.361 + 0.207 + 0.044 + 0.015) sd_bonus = 9000; // 7500+1500
                                    else sd_bonus = 10500; // 7500+SWORD DRIVE (簡易化作額外3000)

                                    this.session_payout += sd_bonus;
                                    addLog(`🌈 神器解放 SWORD DRIVE！ ${sd_bonus}個獲得！！！`, "color-wou");
                                } else {
                                    this.session_payout += 1500;
                                    addLog(`✨ BONUS 1500個獲得`, "color-hit");
                                }
                                addLog(`🔥 War of Underworld 継続！`, "color-wou");
                            }

                            addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            updateUI();
                            await sleep(1500);
                            hit = true;
                            break; 
                        }
                    }

                    // ST 抜け
                    if (!hit) {
                        document.getElementById("ui-spins").innerText = `ST残り: 0/${st_max}`;
                        addLog(`\n💀 ST抜け... RUSH終了`, "color-fall");
                        addLog(`📈 總連莊數: ${this.session_rush_count}連`);
                        addLog(`💰 最終出玉: ${this.session_payout} 玉`);

                        this.state = "NORMAL";
                        this.record_history();
                        updateUI();
                        isPlayingRush = false;
                    }
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new SaoMachine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const btnReset = document.getElementById("btn-reset");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            btnReset.disabled = true;

            addLog("\n=== LINK START ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0) {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnReset.disabled = false;
            btnPlay.innerText = "▶️ 繼續打玉";
        }

        function resetGame() {
            game = new SaoMachine();
            logBox.innerHTML = "";
            renderHistoryTable([]);
            updateUI();
            addLog("遊戲紀錄已重置。", "color-normal");
            btnPlay.innerText = "▶️ LINK START";
        }
    </script>
    
    <script src="plugin.js"></script>
<!-- 🌟 置底懸浮廣告區塊 🌟 -->

                'params' : {}
            };
        </script>

    </div>
</body>
