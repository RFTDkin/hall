<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柏青哥模擬器 (P 機動戦士ガンダムSEED LT)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b1021;
            color: #e0e0e0;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #29b6f6;
            text-shadow: 0 0 15px rgba(41, 182, 246, 0.7);
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #151e3a;
            border: 2px solid #29b6f6;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(41, 182, 246, 0.5);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffca28;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #1976d2;
            color: white;
            border: 1px solid #29b6f6;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        button:hover { background-color: #1e88e5; box-shadow: 0 0 10px #29b6f6; }
        button:disabled { background-color: #1a2a3a; border-color: #444; color: #777; cursor: not-allowed; box-shadow: none; }
        
        #btn-reset { background-color: #424242; border-color: #616161; }
        #btn-reset:hover { background-color: #212121; box-shadow: 0 0 10px #616161; }

        .log-container {
            background-color: #000000;
            border: 1px solid #29b6f6;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-climax { color: #ff5252; font-weight: bold; text-shadow: 0 0 10px #ff5252; font-size: 1.1em; }
        .color-rush { color: #ffca28; font-weight: bold; text-shadow: 0 0 5px #ffca28; }
        .color-hit { color: #29b6f6; font-weight: bold; }
        .color-normal { color: #9e9e9e; }
        .color-down { color: #00e676; font-style: italic; }
        .color-fall { color: #757575; font-style: italic; }

        .data-lamp-container {
            background-color: #0b1021;
            border: 3px solid #29b6f6;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(41, 182, 246, 0.4);
        }

        .data-lamp-title {
            color: #29b6f6;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #29b6f6;
            letter-spacing: 2px;
        }

        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #1976d2; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #151e3a; color: #ffca28; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #0e152d; }
        table.data-lamp td.hit-spins { color: #29b6f6; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #ff5252; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ffca28; font-weight: bold; }
        .empty-row { color: #555 !important; }
    </style>
<link rel="stylesheet" href="mobile.css">
</head>

<body>

    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.6em; color: #ffca28;">P 機動戦士ガンダムSEED LT</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 發進 (PLAY)</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉数</th>
                            <th>連莊数</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class SeedMachine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = []; 
            }

async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉數: ${this.session_spins}`, "color-normal");

                // 🎯 1. 圖柄揃い抽選: 1/399.9
                if (Math.random() < (1 / 399.9)) {
                    let r = Math.random();
                    
                    if (r < 0.516) {
                        // 🟡 51.6% -> 10R RUSH
                        addLog(`\n[${this.session_spins} 回轉] 🎯 FEVER 図柄揃い！ (1500玉)`, "color-hit");
                        this.session_payout += 1500;
                        updateUI();
                        await sleep(1000);
                        addLog("🔥 昇格成功！ FULLBURST RUSH CLIMAX 突入！", "color-climax");
                        await sleep(1000);
                        await this.play_rush("CLIMAX");
                        return true;
                    } 
                    else if (r < 0.999) {
                        // 🔵 48.3% -> 10R 通常 (0.516 + 0.483 = 0.999)
                        addLog(`\n[${this.session_spins} 回轉] 🎯 FEVER 図柄揃い！ (1500玉)`, "color-hit");
                        this.session_payout += 1500;
                        updateUI();
                        await sleep(1000);
                        addLog("😭 昇格失敗... (通常へ戻る)", "color-normal");
                        addLog(`💰 本次總出玉: ${this.session_payout} 玉`);
                        this.record_history();
                        return true;
                    } 
                    else {
                        // 🔴 0.1% -> 2R チャージ昇格 RUSH
                        addLog(`\n[${this.session_spins} 回轉] ⚡ SEEDチャージ当選！ (300玉)`, "color-normal");
                        this.session_payout += 300;
                        updateUI();
                        await sleep(1000);
                        addLog("🌈 奇跡のチャージ昇格！！！ FULLBURST RUSH CLIMAX 突入！", "color-climax");
                        await sleep(1000);
                        await this.play_rush("CLIMAX"); 
                        return true;
                    }
                }

                // ⚡ 2. 普通の SEED チャージ抽選 (約 1/2731.4) -> 必定通常
                if (Math.random() < (1 / 2731.4)) {
                    addLog(`\n[${this.session_spins} 回轉] ⚡ SEEDチャージ当選！ (300玉)`, "color-normal");
                    this.session_payout += 300;
                    updateUI();
                    await sleep(1000);
                    addLog("😭 チャージ終了... (通常へ戻る)", "color-normal");
                    addLog(`💰 本次總出玉: ${this.session_payout} 玉`);
                    this.record_history();
                    return true;
                }

                return false;
            }

            async play_rush(startMode = "CLIMAX") {
                this.state = startMode; 
                let st_max = 130;
                let st_remaining = st_max;
                
                let modeDisplayName = this.state === "CLIMAX" ? "RUSH CLIMAX" : "RUSH";
                addLog(`\n===== ⚔️ FULLBURST ${modeDisplayName} 開始 =====`, "color-climax");
                updateUI();

                while (this.state !== "NORMAL") {
                    await sleep(20);
                    st_remaining--;
                    
                    let modeName = this.state === "CLIMAX" ? "CLIMAX" : "RUSH";
                    document.getElementById("ui-spins").innerText = `${modeName} 残り: ${st_remaining}/${st_max}`;

                    // 右打ち中 大当り確率: 1/95.6
                    if (Math.random() < (1 / 95.6)) {
                        this.session_rush_count++;
                        let used_spin = st_max - st_remaining;

                        addLog(`\n🎯 大当り！ (${used_spin}回転目)`, "color-hit");
                        let pr = Math.random();

                        if (this.state === "CLIMAX") {
                            // CLIMAX中 振分
                            if (pr < 0.51) {
                                this.session_payout += 4500;
                                addLog(`🌈 限界突破！ 4500個獲得！！！`, "color-climax");
                                addLog(`🔥 CLIMAX 継続！`, "color-climax");
                            } else {
                                this.session_payout += 3000;
                                addLog(`💥 3000個獲得！`, "color-hit");
                                addLog(`💧 FULLBURST RUSH へ降格...`, "color-down");
                                this.state = "RUSH"; // 降格
                            }
                        } else {
                            // 普通 RUSH中 振分
                            if (pr < 0.03) {
                                this.session_payout += 4500;
                                addLog(`🌈 奇跡！ 4500個獲得！！！`, "color-climax");
                                addLog(`🔥 FULLBURST RUSH CLIMAX へ昇格！`, "color-climax");
                                this.state = "CLIMAX"; // 昇格
                            } else if (pr < 0.03 + 0.47) {
                                this.session_payout += 3000;
                                addLog(`💥 3000個獲得！`, "color-hit");
                                addLog(`🔥 FULLBURST RUSH CLIMAX へ昇格！`, "color-climax");
                                this.state = "CLIMAX"; // 昇格
                            } else {
                                this.session_payout += 1500;
                                addLog(`✨ 1500個獲得！`, "color-hit");
                                addLog(`⚡ FULLBURST RUSH 継続`, "color-rush");
                            }
                        }
                        
                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        updateUI();
                        await sleep(1000);
                        
                        st_remaining = st_max; // 重置 ST
                    }

                    // ST 跑完 0 轉
                    if (st_remaining <= 0) {
                        document.getElementById("ui-spins").innerText = `ST残り: 0/${st_max}`;
                        addLog(`\n💀 ST抜け... RUSH終了`, "color-fall");
                        addLog(`📈 總連莊數: ${this.session_rush_count}連`);
                        addLog(`💰 最終出玉: ${this.session_payout} 玉`);

                        this.state = "NORMAL";
                        this.record_history();
                        updateUI();
                        break;
                    }
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new SeedMachine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== 出擊！ ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0) {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ 繼續打玉";
        }
    </script>
    
    <script src="plugin.js"></script>
<!-- 🌟 置底懸浮廣告區塊 🌟 -->
    <div style="position: fixed; bottom: 0; left: 0; width: 100%; background-color: rgba(0,0,0,0.8); z-index: 9999; text-align: center; padding: 5px 0; border-top: 1px solid #333;">

            atOptions = {
                'key' : 'ead8f1e5fdd30faaed33da77b3333cf4',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="//www.highperformanceformat.com/ead8f1e5fdd30faaed33da77b3333cf4/invoke.js"></script>
    </div>
</body>
</html>
