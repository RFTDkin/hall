<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eひきこまり吸血姫の悶々FHV | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12000a;
            color: #e0e0e0;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff1744;
            text-shadow: 0 0 15px rgba(255, 23, 68, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #2b0011;
            border: 2px solid #b71c1c;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(183, 28, 28, 0.5);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ff5252;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #8e0000;
            color: white;
            border: 1px solid #ff1744;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        button:hover { background-color: #b71c1c; box-shadow: 0 0 10px #ff1744; }
        button:disabled { background-color: #330000; border-color: #444; color: #777; cursor: not-allowed; box-shadow: none; }

        .log-container {
            background-color: #000000;
            border: 1px solid #4a0000;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #ff5252; font-weight: bold; text-shadow: 0 0 5px #ff5252; }
        .color-hit { color: #ffeb3b; font-weight: bold; }
        .color-normal { color: #9e9e9e; }
        .color-cz { color: #b388ff; font-weight: bold; }
        .color-ultimate { color: #d50000; font-weight: bold; text-shadow: 0 0 10px #d50000; font-size: 1.1em; }
        .color-fall { color: #757575; font-weight: bold; }

        .data-lamp-container {
            background-color: #1a000d;
            border: 3px solid #4a0000;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(183, 28, 28, 0.4);
        }

        .data-lamp-title {
            color: #ff1744;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ff1744;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th, table.data-lamp td {
            border: 1px solid #330000;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th { background-color: #2b0011; color: #ff5252; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #12000a; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff5252; }
        .empty-row { color: #555 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">eひきこまり吸血姫の悶々FHV (1/129)</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class Hikikomari {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 確率計算: CZ合算 1/129
                // コマリチャージ (大当り) = 1/348。うち20%でCZへ、80%は失敗(300玉のみ)
                const p_komari_fail = (1 / 348) * 0.80; // 約 1/435
                const p_komari_succ = (1 / 348) * 0.20; // 約 1/1740
                const p_c_zitan = (1 / 129) - p_komari_succ; // 残りのCZ確率 (演出成功)

                let roll = Math.random();

                if (roll < p_komari_fail) {
                    this.session_payout += 300;
                    addLog(`\n[${this.session_spins} 回轉] 🩸 コマリチャージ (300個獲得) -> 昇格失敗`, "color-normal");
                    updateUI();
                    this.record_history();
                    return true;
                } else if (roll < p_komari_fail + p_komari_succ) {
                    this.session_payout += 300;
                    addLog(`\n[${this.session_spins} 回轉] 🩸 コマリチャージ (300個獲得) -> 昇格成功！！`, "color-cz");
                    addLog(`🦇 烈核解放CZ 突入！ (10回転)`, "color-cz");
                    let cz_success = await this.play_cz();
                    if (cz_success) await this.cz_result();
                    else { addLog(`💀 CZ失敗... 通常へ戻る`, "color-normal"); this.record_history(); }
                    return true;
                } else if (roll < p_komari_fail + p_komari_succ + p_c_zitan) {
                    addLog(`\n[${this.session_spins} 回轉] ✨ 演出成功！ 烈核解放CZ 突入！ (10回転)`, "color-cz");
                    let cz_success = await this.play_cz();
                    if (cz_success) await this.cz_result();
                    else { addLog(`💀 CZ失敗... 通常へ戻る`, "color-normal"); }
                    return true; // 當成一個 Session 結束
                }
                
                return false;
            }

            async play_cz() {
                this.state = "CZ";
                updateUI();

                for (let i = 1; i <= 10; i++) {
                    await sleep(150);
                    this.session_spins++; // CZ中も回転数に含む
                    document.getElementById("ui-spins").innerText = `CZ中: ${i}/10`;

                    if (Math.random() < (1 / 25.5)) {
                        addLog(`🎉 [CZ ${i}回転目] 成功！！`, "color-hit");
                        this.state = "NORMAL";
                        return true;
                    }
                }
                this.state = "NORMAL";
                updateUI();
                return false;
            }

            async cz_result() {
                let roll = Math.random();
                let rush = false;

                if (roll < 0.073) {
                    let payout = 1800;
                    addLog("🌈 七紅天大将軍BONUS！ 1800玉獲得！", "color-ultimate");
                    addLog("🦇 超孤紅の恤RUSH (LT) 突入！", "color-ultimate");
                    this.session_payout += payout;
                    rush = true;
                } else if (roll < 0.073 + 0.437) {
                    let payout = 1500;
                    addLog("🩸 下剋上チャレンジ 成功！ 1500玉獲得！", "color-rush");
                    addLog("🦇 超孤紅の恤RUSH (LT) 突入！", "color-ultimate");
                    this.session_payout += payout;
                    rush = true;
                } else {
                    let payout = 1500;
                    addLog("😭 下剋上チャレンジ 失敗... 1500玉獲得 (通常終了)", "color-normal");
                    this.session_payout += payout;
                    this.record_history();
                }
                
                updateUI();
                if (rush) {
                    await sleep(1000);
                    await this.play_rush();
                }
            }

            async play_rush() {
                addLog("\n===== 🦇 超孤紅の恤RUSH (ST144回) 開始 =====", "color-ultimate");
                this.state = "RUSH";
                updateUI();

                let st_remaining = 144;
                while (this.state === "RUSH" && st_remaining > 0) {
                    await sleep(40);
                    document.getElementById("ui-spins").innerText = `ST剩餘: ${st_remaining}/144`;

                    if (Math.random() < (1 / 99)) {
                        this.session_rush_count += 1;
                        let used_spin = 144 - st_remaining + 1;
                        addLog(`\n🎉 RUSH 當選！ (ST ${used_spin} 回転)`, "color-hit");

                        if (Math.random() < 0.50) {
                            addLog(`🔥 孤紅の恤BONUS！`, "color-ultimate");
                            let loop = true;
                            let loop_count = 0;

                            while (loop) {
                                if (loop_count > 0) {
                                    await sleep(600);
                                    addLog(`🔄 1G連 孤紅の恤BONUS！ (#${loop_count + 1})`, "color-ultimate");
                                }

                                let br = Math.random();
                                if (br < 0.125) {
                                    this.session_payout += 6000;
                                    addLog(`👑 狂気！ 6000玉獲得 + 1G連発生 !!! (合計: ${this.session_payout}玉)`, "color-ultimate");
                                    loop_count++;
                                } else if (br < 0.125 + 0.375) {
                                    this.session_payout += 4500;
                                    addLog(`💥 激熱！ 4500玉獲得 !! (合計: ${this.session_payout}玉)`, "color-rush");
                                    loop = false;
                                } else if (br < 0.50 + 0.375) {
                                    this.session_payout += 3000;
                                    addLog(`🩸 3000玉獲得 ! (合計: ${this.session_payout}玉)`, "color-rush");
                                    loop = false;
                                } else {
                                    this.session_payout += 1500;
                                    addLog(`✨ 1500玉獲得 (合計: ${this.session_payout}玉)`, "color-hit");
                                    loop = false;
                                }
                                updateUI();
                            }
                        } else {
                            addLog(`🦇 吸血姫BONUS1500！ 1500玉獲得`, "color-hit");
                            this.session_payout += 1500;
                        }

                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        st_remaining = 144;
                        updateUI();
                        await sleep(800);
                    } else {
                        st_remaining--;
                    }
                }

                if (st_remaining === 0) {
                    document.getElementById("ui-spins").innerText = `ST剩餘: 0/144`;
                    addLog("\n💀 ST抜け... RUSH終了", "color-fall");
                    this.end_rush();
                }
            }

            end_rush() {
                addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0;
            }
        }

        let game = new Hikikomari();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== ゲーム開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (hit) { isPlaying = false; break; }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>

</html>
