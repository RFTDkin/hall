<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】P新世紀エヴァンゲリオン15 未来への咆哮 | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #00e676;
            text-shadow: 0 0 15px rgba(0, 230, 118, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel {
            flex: 1;
            min-width: 320px;
            max-width: 500px;
        }

        .right-panel {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
        }

        .stats-board {
            background-color: #110011;
            border: 2px solid #9c27b0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(156, 39, 176, 0.3);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #00e676;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #7b1fa2;
            color: white;
            border: 1px solid #9c27b0;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            background-color: #9c27b0;
            transform: scale(1.05);
            box-shadow: 0 0 10px #9c27b0;
        }

        button:disabled {
            background-color: #3e2723;
            border-color: #444;
            color: #777;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #9c27b0;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry {
            margin: 5px 0;
        }

        .color-rush {
            color: #e040fb;
            font-weight: bold;
            text-shadow: 0 0 5px #e040fb;
        }

        .color-hit {
            color: #00e676;
            font-weight: bold;
            text-shadow: 0 0 5px #00e676;
        }

        .color-normal {
            color: #9e9e9e;
        }

        .color-ultimate {
            color: #ffea00;
            font-weight: bold;
            text-shadow: 0 0 10px #ffea00;
            font-size: 1.1em;
        }

        .color-fall {
            color: #4fc3f7;
            font-weight: bold;
        }

        .data-lamp-container {
            background-color: #110011;
            border: 3px solid #9c27b0;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(156, 39, 176, 0.4);
        }

        .data-lamp-title {
            color: #00e676;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #00e676;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th,
        table.data-lamp td {
            border: 1px solid #9c27b0;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th {
            background-color: #4a148c;
            color: #00e676;
            font-size: 0.9em;
        }

        table.data-lamp tr:nth-child(even) {
            background-color: #210021;
        }

        table.data-lamp td.hit-spins {
            color: #00e676;
            font-weight: bold;
        }

        table.data-lamp td.hit-rush {
            color: #e040fb;
            font-weight: bold;
        }

        table.data-lamp td.hit-payout {
            color: #ffea00;
        }

        .empty-row {
            color: #444 !important;
        }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>

    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.5em; color: #ffffff;">P新世紀エヴァンゲリオン15 未来への咆哮</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊戲開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="4" class="empty-row">- 無紀錄 -</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class Eva15 {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                let roll = Math.random();

                if (roll < (1 / 319.7)) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い大当り！`, "color-hit");

                    let r = Math.random();
                    if (r < 0.03) {
                        this.session_payout += 1500;
                        addLog("🌈 金7図柄揃い！ 10R 1500玉獲得 ＋ IMPACT MODE突入！", "color-ultimate");
                        updateUI(); await sleep(1000); await this.play_rush();
                    } else if (r < 0.59) {
                        this.session_payout += 450;
                        addLog("🔥 奇数図柄揃い / 暴走BONUS！ 3R 450玉獲得 ＋ IMPACT MODE突入！", "color-rush");
                        updateUI(); await sleep(1000); await this.play_rush();
                    } else {
                        this.session_payout += 450;
                        addLog("💧 偶数図柄揃い... 3R 450玉獲得 (チャンスタイム 100回へ)", "color-normal");
                        updateUI(); await sleep(1000); await this.play_jitan();
                    }
                    return true;
                }
                return false;
            }

            async play_jitan() {
                let jitan_remain = 100;
                addLog(`\n[チャンスタイム突入] (残り ${jitan_remain}回転)`, "color-fall");
                this.state = "JITAN";

                while (this.state === "JITAN" && jitan_remain > 0) {
                    document.getElementById("ui-spins").innerText = `時短中: ${100 - jitan_remain + 1}/100`;
                    await sleep(40);

                    if (Math.random() < (1 / 319.7)) {
                        addLog(`\n🎉 [時短 ${100 - jitan_remain + 1}回転目] 引き戻し成功！`, "color-hit");
                        this.session_payout += 1500;
                        addLog("🌈 右打ち中大当り！ 10R 1500玉獲得 ＋ IMPACT MODE突入！", "color-ultimate");
                        updateUI(); await sleep(1000);
                        await this.play_rush();
                        return;
                    }
                    jitan_remain--;
                }

                for (let i = 0; i < 4; i++) {
                    document.getElementById("ui-spins").innerText = `残保留: ${i + 1}/4`;
                    await sleep(200);
                    if (Math.random() < (1 / 319.7)) {
                        addLog(`\n🎉 [残保留 ${i + 1}回転目] 奇跡の引き戻し！`, "color-hit");
                        this.session_payout += 1500;
                        addLog("🌈 右打ち中大当り！ 10R 1500玉獲得 ＋ IMPACT MODE突入！", "color-ultimate");
                        updateUI(); await sleep(1000);
                        await this.play_rush();
                        return;
                    }
                }

                addLog("💧 チャンスタイム終了... (通常へ戻る)", "color-fall");
                this.end_rush();
            }

            async play_rush() {
                let st_max = 163;
                let current_st = st_max;
                addLog(`\n=== 🟩 IMPACT MODE (ST ${st_max}回) ===`, "color-ultimate");
                this.state = "RUSH";

                while (this.state === "RUSH" && current_st > 0) {
                    document.getElementById("ui-spins").innerText = `ST中: ${st_max - current_st + 1}/${st_max}`;
                    await sleep(40);

                    if (Math.random() < (1 / 99.4)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [ST ${st_max - current_st + 1}回転目] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                        this.session_payout += 1500;
                        addLog("🌈 10R確変！ 1500玉獲得 ＋ IMPACT MODE継続！", "color-ultimate");
                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);

                        current_st = st_max;
                        updateUI(); await sleep(800);
                    } else {
                        current_st--;
                    }
                }

                if (current_st === 0) {
                    for (let i = 0; i < 4; i++) {
                        document.getElementById("ui-spins").innerText = `残保留: ${i + 1}/4`;
                        await sleep(200);
                        if (Math.random() < (1 / 99.4)) {
                            this.session_rush_count += 1;
                            addLog(`\n🎉 [残保留 ${i + 1}回転目] 執念の引き戻し！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                            this.session_payout += 1500;
                            addLog("🌈 10R確変！ 1500玉獲得 ＋ IMPACT MODE継続！", "color-ultimate");
                            addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            updateUI(); await sleep(800);
                            await this.play_rush();
                            return;
                        }
                    }
                    addLog(`\n⬛ IMPACT MODE終了... (通常へ戻る)`, "color-fall");
                    this.end_rush();
                }
            }

            end_rush() {
                addLog(`📈 總連莊數: ${this.session_rush_count > 0 ? this.session_rush_count + 1 : 1}連 (含初當)`);
                addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new Eva15();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== ゲーム開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0) {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ 繼續抽機";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>

    </div>
</body>

</html>
