<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eアクセル・ワールド | パチンコシミュレーター</title>
    <meta name="machine-title" content="eアクセル・ワールド">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
            color: #e0f7fa;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #00e676;
            text-shadow: 0 0 15px rgba(0, 230, 118, 0.7);
            font-weight: 900;
            letter-spacing: 1px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel, .right-panel {
            flex: 1;
            min-width: 320px;
            max-width: 500px;
        }

        .stats-board {
            background-color: #111;
            border: 2px solid #00e676;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(0, 230, 118, 0.4);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffffff;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #00838f;
            color: white;
            border: 1px solid #00e676;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: 0.2s;
        }

        button:hover {
            background-color: #00e676;
            color: #050505;
            box-shadow: 0 0 15px #00e676;
        }

        button:disabled {
            background-color: #212121;
            border-color: #424242;
            color: #757575;
            cursor: not-allowed;
            box-shadow: none;
        }

        .log-container {
            background-color: #000;
            border: 1px solid #00e676;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #aa00ff; font-weight: bold; text-shadow: 0 0 5px #aa00ff; }
        .color-hit { color: #00e676; font-weight: bold; }
        .color-normal { color: #90caf9; }
        .color-ultimate { color: #ff1744; font-weight: bold; text-shadow: 0 0 10px #ff1744; font-size: 1.1em; }
        .color-challenge { color: #ff9800; font-weight: bold; }
        .color-fall { color: #757575; font-style: italic; }
        .color-hold { color: #ffeb3b; font-weight: bold; text-shadow: 0 0 8px #ffeb3b; }

        .data-lamp-container {
            background-color: #0a0a0a;
            border: 3px solid #00e676;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
        }

        .data-lamp-title {
            color: #00e676; margin-top: 0; margin-bottom: 15px;
            text-align: center; text-shadow: 0 0 5px #00e676; letter-spacing: 2px;
        }

        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #00e676; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #003311; color: #00e676; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #111; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff5252; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>
    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.5em; color: #ffffff;">eアクセル・ワールド</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class AccelWorldMachine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 1/184.6 通常時
                if (Math.random() < (1 / 184.6)) {
                    let r = Math.random();
                    addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い當選！ (1/184.6)`, "color-hit");
                    await sleep(1000);

                    // 0.5% LT直行
                    if (r < 0.005) {
                        this.session_payout += 1500;
                        addLog(`🌈 奇跡の7図柄揃い！ (10R 1500玉)`, "color-ultimate");
                        addLog(`🚀 LT直行！！！`, "color-ultimate");
                        updateUI();
                        await sleep(1000);
                        await this.play_lt_sequence();
                    } 
                    // 69.5% LTチャレンジ
                    else if (r < 0.70) {
                        this.session_payout += 300;
                        addLog(`⚔️ 赤図柄揃い (2R 300玉)`, "color-challenge");
                        addLog(`🔥 LTチャレンジ (BURST BATTLE) 突入！`, "color-challenge");
                        updateUI();
                        await sleep(1000);
                        await this.play_lt_challenge();
                    } 
                    // 30% 通常終了
                    else {
                        this.session_payout += 300;
                        addLog(`💧 赤・7以外の図柄揃い (2R 300玉)`, "color-normal");
                        addLog(`💀 通常へ戻る`, "color-fall");
                        updateUI();
                        this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async run_last_attack(isChallenge) {
                addLog(`🔍 LAST ATTACK (残り2回転) 判定中...`, "color-normal");
                for (let i = 1; i <= 2; i++) {
                    await sleep(600);
                    if (Math.random() < (1 / 36.7)) {
                        this.session_rush_count += 1;
                        addLog(`\n🌟 [LAST ATTACK ${i}回転目] 奇跡の引き戻し成功！！ (總 ${this.session_rush_count + 1}連)`, "color-hold");
                        
                        if (isChallenge) {
                            this.session_payout += 1500;
                            addLog(`✨ 突破成功！ (10R 1500玉)`, "color-hit");
                        } else {
                            let payout_r = Math.random();
                            if (payout_r < 0.0051) {
                                this.session_payout += 6000;
                                addLog(`🌈 驚異の6000 BONUS 獲得！！！`, "color-ultimate");
                            } else {
                                this.session_payout += 1500;
                                addLog(`✨ 10R 1500玉`, "color-hit");
                            }
                        }
                        return true;
                    }
                }
                return false;
            }

            async play_lt_challenge() {
                this.state = "CHALLENGE";
                let inChallenge = true;
                let current_spin = 0;
                
                while(inChallenge) {
                    await sleep(80);
                    current_spin++;
                    document.getElementById("ui-spins").innerText = `チャレンジ中: ${current_spin}轉`;

                    if (Math.random() < (1 / 36.7)) {
                        this.session_rush_count += 1;
                        this.session_payout += 1500;
                        addLog(`\n🎉 [BURST BATTLE ${current_spin}回転] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                        addLog(`✨ 突破成功！ (10R 1500玉)`, "color-hit");
                        updateUI();
                        await sleep(1000);
                        await this.play_lt_sequence();
                        return; // 成功進入 LT 後結束 challenge function
                    } else if (Math.random() < (1 / 9.4)) {
                        // 👇 修改呢行，加入 BURST BATTLE ${current_spin}回転 👇
                        addLog(`\n⚠️ [BURST BATTLE ${current_spin}回転] 敵の攻撃... 転落発生 (1/9.4)`, "color-fall");
                        inChallenge = false;
                        await sleep(800);
                    }
                }

                // 転落後の LAST ATTACK
                let recovered = await this.run_last_attack(true);
                if (recovered) {
                    updateUI();
                    await sleep(1000);
                    await this.play_lt_sequence();
                } else {
                    document.getElementById("ui-spins").innerText = `終了`;
                    addLog(`💀 突破ならず... 終了`, "color-fall");
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                    this.state = "NORMAL";
                    this.record_history();
                    updateUI();
                }
            }

            async play_lt_sequence() {
                this.state = "LT";
                let inLT = true;

                while (inLT) {
                    // ================= LT前半 (OVER HEAVEN) =================
                    addLog(`\n===== 🌌 LT前半 OVER HEAVEN (平均11回転) =====`, "color-rush");
                    let hitInFirstHalf = false;
                    
                    for(let i = 1; i <= 11; i++) {
                        await sleep(400);
                        document.getElementById("ui-spins").innerText = `LT前半: ${i}/11`;
                        
                        if (Math.random() < (1 / 36.7)) {
                            this.session_rush_count += 1;
                            this.session_payout += 6000;
                            hitInFirstHalf = true;
                            addLog(`\n🎉 [LT前半 ${i}回転] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                            addLog(`🌈 6000 BONUS 獲得！！！`, "color-ultimate");
                            addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            updateUI();
                            await sleep(1200);
                            break; // 再次回到 LT 前半
                        }
                    }

                    if (hitInFirstHalf) continue; // 重新執行 LT 前半

                    // ================= LT後半 (Brain Burst 2039) =================
                    addLog(`\n===== 🧠 LT後半 Brain Burst 2039 突入 =====`, "color-rush");
                    let inSecondHalf = true;
                    let secondHalfHit = false;
                    let current_spin = 0;

                    while(inSecondHalf) {
                        await sleep(80);
                        current_spin++;
                        document.getElementById("ui-spins").innerText = `LT後半: ${current_spin}轉`;

                        let rWin = Math.random();
                        let rFall = Math.random();

                        if (rWin < (1 / 36.7)) {
                            this.session_rush_count += 1;
                            secondHalfHit = true;
                            inSecondHalf = false;
                            
                            addLog(`\n🎉 [LT後半 ${current_spin}回転] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                            
                            if (Math.random() < 0.0051) {
                                this.session_payout += 6000;
                                addLog(`🌈 驚異の6000 BONUS 獲得！！！`, "color-ultimate");
                            } else {
                                this.session_payout += 1500;
                                addLog(`✨ 10R 1500玉`, "color-hit");
                            }
                            addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            updateUI();
                            await sleep(1200);
                        } 
                        else if (rFall < (1 / 65.8)) {
                            // 👇 修改呢行，加入 LT後半 ${current_spin}回転 👇
                            addLog(`\n⚠️ [LT後半 ${current_spin}回転] 敵艦遭遇... 転落発生 (1/65.8)`, "color-fall");
                            inSecondHalf = false;
                            await sleep(800);
                        }
                    }

                    if (secondHalfHit) continue; // 命中後返回 LT 前半

                    // 転落後の LAST ATTACK
                    let recovered = await this.run_last_attack(false);
                    if (recovered) {
                        updateUI();
                        await sleep(1000);
                        continue; // 引き戻し成功でLT前半へ
                    } else {
                        inLT = false; // 徹底結束
                    }
                }

                document.getElementById("ui-spins").innerText = `終了`;
                addLog(`💀 LT 終了...`, "color-fall");
                addLog(`📈 總連莊數: ${this.session_rush_count + 1}連`);
                addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new AccelWorldMachine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            addLog("\n=== eアクセル・ワールド 開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (hit) { isPlaying = false; break; }
            }
            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ 繼續遊技";
        }
    </script>
    
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
