<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】e真・一騎当千〜軍神覚醒〜 | パチンコシミュレーター</title>
    <meta name="machine-title" content="e真・一騎当千">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0a11;
            color: #ffffff;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #e91e63;
            text-shadow: 0 0 10px #e91e63;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #1a1025;
            border: 2px solid #9c27b0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(156, 39, 176, 0.5);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffeb3b;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background: linear-gradient(180deg, #9c27b0 0%, #6a1b9a 100%);
            color: white;
            border: 1px solid #e1bee7;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #9c27b0;
        }

        button:disabled {
            background: #333; border-color: #555; color: #888;
            cursor: not-allowed; transform: scale(1); box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #9c27b0;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-st { color: #ce93d8; font-weight: bold; }
        .color-lt { color: #ff4081; font-weight: 900; text-shadow: 0 0 10px #ff4081; font-size: 1.1em; }
        .color-hit { color: #ffeb3b; font-weight: bold; }
        .color-normal { color: #b0bec5; }
        .color-fall { color: #757575; font-weight: bold; }

        .data-lamp-container {
            background-color: #111;
            border: 3px solid #9c27b0;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(156, 39, 176, 0.4);
        }

        .data-lamp-title {
            color: #e91e63; margin-top: 0; margin-bottom: 15px; text-align: center;
            font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #e91e63; letter-spacing: 2px;
        }

        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #555; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #222; color: #ce93d8; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #1a1a1a; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff4081; font-weight: bold;}
        .empty-row { color: #555 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.6em; color: #e91e63;">e真・一騎当千〜軍神覚醒〜</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">現在回転数 <span id="ui-spins">0</span></div>
                <div class="stat-item">獲得出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">連チャン <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (直近10回)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>履歴</th>
                            <th>当選回転数</th>
                            <th>連チャン</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="4" class="empty-row">- 履歴なし -</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class IkkitousenMachine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在の回転数: ${this.session_spins}`, "color-normal");
                }

                // 通常時 大当り確率 1/319.7
                if (Math.random() < (1 / 319.7)) {
                    addLog(`\n[${this.session_spins} 回転] 💥 大当り当選！`, "color-hit");

                    let r = Math.random();
                    // 51% ST突入, 49% 通常終了 (出玉はどちらも300個)
                    if (r < 0.51) {
                        this.session_payout += 300;
                        addLog(`✨ 真・一騎当千BONUS (2R)！ 300玉獲得！`, "color-hit");
                        addLog(`🔥 真・闘士連撃 (ST100回) 突入！`, "color-st");
                        
                        updateUI();
                        await sleep(1500);
                        await this.play_st();
                    } else {
                        this.session_payout += 300;
                        addLog(`💧 一騎当千BONUS (2R)... 300玉獲得 (通常終了)`, "color-normal");
                        this.record_history();
                        updateUI();
                    }
                    return true;
                }
                return false;
            }

            async play_st() {
                this.state = "ST";
                let current_rush_spins = 0;
                
                while (this.state === "ST" && current_rush_spins < 100) {
                    await sleep(40);
                    current_rush_spins += 1;

                    document.getElementById("ui-spins").innerText = `ST中: ${current_rush_spins}/100`;

                    // ST中 大当り確率 1/109.6
                    if (Math.random() < (1 / 109.6)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [ST ${current_rush_spins}回転目] 大当り！`);
                        await sleep(1000);

                        let r = Math.random();
                        this.session_payout += 1500;
                        
                        // 50%でLT発動
                        if (r < 0.50) {
                            addLog(`🌈 軍神覚醒BONUS！ 1500玉獲得！`, "color-lt");
                            addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            addLog(`⚔️ ラッキートリガー発動！ 真・軍神BATTLEモードへ！`, "color-lt");
                            
                            updateUI();
                            await sleep(2000);
                            await this.play_lt();
                            return; // LTへ移行するためSTループ終了
                        } else {
                            addLog(`✨ 連撃BONUS！ 1500玉獲得！`, "color-hit");
                            addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            addLog(`🔥 真・闘士連撃 継続！`, "color-st");
                            
                            current_rush_spins = 0; // STリセット
                            updateUI();
                            await sleep(1500);
                        }
                    }
                }

                // ST駆け抜け
                if (this.state === "ST") {
                    await sleep(500);
                    addLog(`\n💀 決着... ST終了`, "color-fall");
                    addLog(`📈 総連チャン数: ${this.session_rush_count + 1}連 (初当り含む)`);
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                    this.state = "NORMAL";
                    this.record_history();
                    updateUI();
                }
            }

            async play_lt() {
                this.state = "LT";
                let current_lt_spins = 0;
                
                while (this.state === "LT" && current_lt_spins < 134) {
                    await sleep(40);
                    current_lt_spins += 1;

                    document.getElementById("ui-spins").innerText = `LT中: ${current_lt_spins}/134`;

                    // LT中 大当り確率 1/84.7
                    if (Math.random() < (1 / 84.7)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [LT ${current_lt_spins}回転目] 大当り！`);
                        await sleep(1000);

                        let r = Math.random();
                        
                        // LT中: 50% 3000玉(10R×2), 50% 1500玉(10R)
                        if (r < 0.50) {
                            this.session_payout += 3000;
                            addLog(`🌈 関帝降臨3000BONUS！ 一撃3000玉獲得！`, "color-lt");
                        } else {
                            this.session_payout += 1500;
                            addLog(`✨ 軍神無双BONUS！ 1500玉獲得！`, "color-hit");
                        }

                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        addLog(`⚔️ 真・軍神BATTLEモード 継続！`, "color-lt");
                        
                        current_lt_spins = 0; // LTリセット
                        updateUI();
                        await sleep(2000);
                    }
                }

                // LT駆け抜け
                if (this.state === "LT") {
                    await sleep(500);
                    addLog(`\n💀 決着... LT終了`, "color-fall");
                    addLog(`📈 総連チャン数: ${this.session_rush_count + 1}連 (初当り含む)`);
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                    this.state = "NORMAL";
                    this.record_history();
                    updateUI();
                    await sleep(1500);
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new IkkitousenMachine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 履歴なし -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== 遊技開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0 && game.state === "NORMAL") {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ 遊技続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>

</html>
