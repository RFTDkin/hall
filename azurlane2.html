<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eアズールレーンTHE ANIMATION2 | パチンコシミュレーター</title>
    <meta name="machine-title" content="eアズールレーンTHE ANIMATION2">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #001220;
            color: #e0f7fa;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #00e5ff;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.7);
            font-weight: 900;
            letter-spacing: 1px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel, .right-panel {
            flex: 1;
            min-width: 320px;
            max-width: 500px;
        }

        .stats-board {
            background-color: #002244;
            border: 2px solid #00b0ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(0, 176, 255, 0.4);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffffff;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #006db3;
            color: white;
            border: 1px solid #00e5ff;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: 0.2s;
        }

        button:hover {
            background-color: #00e5ff;
            color: #001220;
            box-shadow: 0 0 15px #00e5ff;
        }

        button:disabled {
            background-color: #2c3e50;
            border-color: #34495e;
            color: #7f8c8d;
            cursor: not-allowed;
            box-shadow: none;
        }

        .log-container {
            background-color: #000510;
            border: 1px solid #00b0ff;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #00e5ff; font-weight: bold; text-shadow: 0 0 5px #00e5ff; }
        .color-hit { color: #ffeb3b; font-weight: bold; }
        .color-normal { color: #90caf9; }
        .color-ultimate { color: #ff1744; font-weight: bold; text-shadow: 0 0 10px #ff1744; font-size: 1.1em; }
        .color-attack { color: #ff9800; font-weight: bold; }
        .color-fall { color: #9e9e9e; font-style: italic; }
        .color-hold { color: #69f0ae; font-weight: bold; text-shadow: 0 0 8px #69f0ae; }

        .data-lamp-container {
            background-color: #001a33;
            border: 3px solid #00b0ff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 176, 255, 0.4);
        }

        .data-lamp-title {
            color: #00e5ff; margin-top: 0; margin-bottom: 15px;
            text-align: center; text-shadow: 0 0 5px #00e5ff; letter-spacing: 2px;
        }

        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #00b0ff; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #003366; color: #00e5ff; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #002244; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e5ff; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff5252; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>
    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.5em; color: #ffffff;">eアズールレーンTHE ANIMATION2</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class AzurLane2Machine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 1/169.9 通常時 ATTACK
                if (Math.random() < (1 / 169.9)) {
                    // ATTACK出玉約320〜790個 (ここでは平均値として約550玉を計算)
                    let attack_payout = Math.floor(Math.random() * (790 - 320 + 1)) + 320;
                    this.session_payout += attack_payout;
                    
                    addLog(`\n[${this.session_spins} 回轉] ⚓ ATTACK 發生！ (1/169.9)`, "color-attack");
                    addLog(`💧 出玉獲得: ${attack_payout} 玉`, "color-normal");
                    await sleep(1000);

                    // ATTACK成功率 トータル約30%
                    if (Math.random() < 0.30) {
                        this.session_payout += 1500;
                        addLog(`⚔️ ATTACK成功！！！`, "color-hit");
                        addLog(`🔥 決戦BIG BONUS獲得！ (1500玉)`, "color-ultimate");
                        await sleep(1000);

                        // 決戦BIG BONUS 突破率約50%
                        if (Math.random() < 0.50) {
                            addLog("🌊 決戦突破！ 共同戦線RUSH突入！！", "color-rush");
                            updateUI();
                            await sleep(1000);
                            await this.play_rush();
                        } else {
                            addLog("💀 RUSH突入ならず... 通常へ", "color-fall");
                            updateUI();
                            this.record_history();
                        }
                    } else {
                        addLog("💨 ATTACK失敗... 通常へ", "color-fall");
                        updateUI();
                        this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_rush() {
                this.state = "RUSH";
                let current_spin_in_rush = 0;
                updateUI();
                addLog(`\n===== 🌊 共同戦線RUSH 開始 =====`, "color-rush");

                while (this.state === "RUSH") {
                    await sleep(80);
                    current_spin_in_rush++;
                    document.getElementById("ui-spins").innerText = `RUSH中: ${current_spin_in_rush}轉`;

                    // 大当り (1/21.9) vs 転落 (1/71.7)
                    let hit_win = Math.random() < (1 / 21.9);
                    let hit_fall = Math.random() < (1 / 71.7);

                    if (hit_win) {
                        this.session_rush_count += 1;
                        this.session_payout += 3000;
                        addLog(`\n🎉 [RUSH ${current_spin_in_rush}回転] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                        addLog(`🚀 OVERSHOT BIG BONUS (約3000玉)`, "color-ultimate");
                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        updateUI();
                        await sleep(800);
                    } 
                    else if (hit_fall) {
                        addLog(`\n⚠️ 敵艦隊遭遇... 転落発生 (1/71.7)`, "color-fall");
                        await sleep(1000);
                        
                        // 残り保留4個の引き戻し抽選
                        addLog(`🔍 残り保留4個 判定中...`, "color-normal");
                        let recovered = false;
                        for (let i = 1; i <= 4; i++) {
                            await sleep(500);
                            if (Math.random() < (1 / 21.9)) {
                                this.session_rush_count += 1;
                                this.session_payout += 3000;
                                addLog(`\n🌟 [保留 ${i}個目] 奇跡の引き戻し！！！ (總 ${this.session_rush_count + 1}連)`, "color-hold");
                                addLog(`🚀 OVERSHOT BIG BONUS (約3000玉)`, "color-ultimate");
                                addLog(`🌊 共同戦線RUSH 復帰！`, "color-rush");
                                recovered = true;
                                updateUI();
                                await sleep(1000);
                                break; // 引き戻し成功でループを抜けてRUSH継続
                            }
                        }

                        if (!recovered) {
                            document.getElementById("ui-spins").innerText = `終了`;
                            addLog(`💀 保留引き戻し失敗... RUSH 終了`, "color-fall");
                            addLog(`📈 總連莊數: ${this.session_rush_count + 1}連`);
                            addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                            this.state = "NORMAL";
                            this.record_history();
                            updateUI();
                            break;
                        }
                    }
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new AzurLane2Machine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            addLog("\n=== スマパチ アズールレーン2 開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (hit) { isPlaying = false; break; }
            }
            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ 繼續遊技";
        }
    </script>
    
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
