<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eワールドダイスター | パチンコシミュレーター</title>
    <meta name="machine-title" content="eワールドダイスター">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b1021; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.7); font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #12182b; border: 2px solid #00e5ff; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.5); }
        .stat-item span { display: block; font-weight: bold; color: #40c4ff; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #00b0ff 0%, #005cb2 100%); color: white; border: 1px solid #80d8ff; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #00e5ff; }
        button:disabled { background: #1a233a; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #00e5ff; border-radius: 5px; height: 400px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-rush { color: #ff4081; font-weight: bold; text-shadow: 0 0 5px #ff4081; }
        .color-lt { color: #ffea00; font-weight: 900; text-shadow: 0 0 15px #ffea00; font-size: 1.1em; } 
        .color-hit { color: #00e5ff; font-weight: bold; text-shadow: 0 0 5px #00e5ff; }
        .color-normal { color: #bdbdbd; }
        .color-fall { color: #757575; font-weight: bold; }
        .data-lamp-container { background-color: #12182b; border: 3px solid #00e5ff; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
        .data-lamp-title { color: #40c4ff; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #40c4ff; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #005cb2; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #003c8f; color: #ffea00; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #0a1128; }
        table.data-lamp td.hit-spins { color: #ffea00; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff4081; font-weight: bold; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>
<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">e/ワールドダイスター</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 公演開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        class WorldDaiStar {
            constructor() { this.state = "NORMAL"; this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.history = []; this.rush_spins = 0; }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉数: ${this.session_spins}`, "color-normal");

                // 1/159.9 初当り抽選
                if (Math.random() < 1 / 159.9) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 BONUS當選！ (710玉)`, "color-hit");
                    this.session_rush_count = 1;
                    this.session_payout += 710;
                    
                    let roll = Math.random();
                    // 25% RUSH突入 (ST7回転)
                    if (roll < 0.25) {
                        addLog("🌈 チャレンジ成功！ ワールドダイスターRUSH突入！", "color-rush");
                        updateUI(); await sleep(1500);
                        await this.play_rush(); 
                    } else {
                        addLog("💀 チャレンジ失敗... 通常へ戻る", "color-fall");
                        updateUI(); this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_rush() {
                this.state = "RUSH";
                let max_spins = 7;
                
                addLog(`\n===== 🌟 ワールドダイスターRUSH (ST7回転) =====`, "color-rush");
                updateUI();
                
                while (this.state !== "NORMAL") {
                    let hit = false;
                    for (this.rush_spins = 1; this.rush_spins <= max_spins; this.rush_spins++) {
                        await sleep(300); // 7轉ST需要多點緊張感
                        let remaining = max_spins - this.rush_spins;
                        document.getElementById("ui-spins").innerText = `ST残り: ${remaining}/${max_spins}`;
                        addLog(`⏳ ST ${this.rush_spins}回転目...`, "color-normal");

                        // 1/3.5 大当り抽選
                        if (Math.random() < 1 / 3.5) {
                            hit = true;
                            this.session_rush_count += 1;
                            addLog(`\n🎉 [ST ${this.rush_spins}回転目] 歓喜の瞬間！ (總 ${this.session_rush_count}連)`, "color-hit");
                            
                            // 右打ち振り分け: 10% -> 5050玉, 90% -> 300玉
                            let r = Math.random();
                            if (r < 0.10) {
                                this.session_payout += 5050;
                                addLog(`⭐ 超演激ワールドダイスターBONUS5050 獲得！！`, "color-lt");
                                addLog(`▶ 圧倒的パフォーマンス！ 一撃 5050玉 獲得！`, "color-lt");
                            } else {
                                this.session_payout += 300;
                                addLog(`▶ BONUS！ 300玉 獲得`, "color-rush");
                            }
                            
                            // 🌟 喺度加返每次中獎後嘅累積出玉顯示
                            addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            
                            updateUI(); await sleep(1000);
                            addLog(`⚡ RUSH継続！！`, "color-rush");
                            break; // ST再セット
                        }
                    }

                    if (!hit) {
                        document.getElementById("ui-spins").innerText = `終了`;
                        addLog(`\n💀 公演終了...`, "color-fall");
                        addLog(`📈 總連莊数: ${this.session_rush_count}連`);
                        addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                        this.state = "NORMAL"; 
                        this.record_history(); 
                        updateUI();
                        break;
                    }
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.state = "NORMAL";
            }
        }

        let game = new WorldDaiStar();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            addLog("\n=== e/ワールドダイスター 公演開始！ ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
