        /* 🌟 ブラックアウト演出 (究極進化版) 🌟 */
        .blackout-overlay {
            position: fixed; inset: 0; z-index: 20000; display: flex; align-items: center; justify-content: center; pointer-events: none; 
            background: #000;
            opacity: 0; visibility: hidden;
        }
        
        .blackout-overlay::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background: 
                radial-gradient(ellipse 150% 6% at center, #000000 5%, #0011ff 12%, #ffd700 22%, #00aaff 40%, transparent 60%),
                radial-gradient(ellipse 8% 55% at center, #000000 5%, #0011ff 15%, #ffd700 25%, #00aaff 45%, transparent 65%),
                #ffffff;
            opacity: 0;
            filter: contrast(1.5);
        }

        .blackout-overlay.is-active { visibility: visible; animation: blackout-bg 6s forwards; }
        .blackout-overlay.is-active::before { animation: blackout-flash 6s forwards; }
        .blackout-overlay.is-active .blackout-message { animation: blackout-text 6s forwards; }

        .blackout-message { display: flex; flex-direction: column; align-items: center; gap: 0.2em; font-family: "Arial Black", Impact, sans-serif; font-size: clamp(1.5rem, 5vw, 4rem); line-height: 1.2; letter-spacing: 0.04em; text-align: center; transform: scale(0.8); opacity: 0; }
        
        .blackout-rainbow {
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00e5ff, #c500ff, #ff0000);
            background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: blackout-rainbow 2s linear infinite; filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.75)); font-weight: 900;
        }

        @keyframes blackout-rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        
        @keyframes blackout-bg { 0% { opacity: 0; } 2%, 85% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        
        @keyframes blackout-flash {
            0% { opacity: 0; transform: scale(0.2) scaleY(0.05); filter: brightness(2); }
            2% { opacity: 1; transform: scale(1) scaleY(1); filter: brightness(2); }
            10% { opacity: 0; transform: scale(1.5) scaleY(2); filter: brightness(1); }
            100% { opacity: 0; }
        }

        @keyframes blackout-text { 
            0%, 33% { opacity: 0; transform: scale(1.35); } 
            40%, 80% { opacity: 1; transform: scale(1); } 
            100% { opacity: 0; transform: scale(0.96); } 
        }

        /* 🌟 彼岸花覺醒演出 CSS 🌟 */
        .flower-overlay-container {
            position: fixed; inset: 0; z-index: 25000; background: #050505;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; pointer-events: none;
        }
        .flower-overlay-container.is-active { animation: overlay-bg-anim 16s forwards; }
        .flower-layer { position: absolute; inset: -50px; font-size: 45px; line-height: 1.1; word-break: break-all; overflow: hidden; text-align: center; }
        .flower-white { color: #e0e0e0; text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff; opacity: 0; }
        .flower-red { color: #ff0000; text-shadow: 0 0 10px #ff0000, 0 0 30px #cc0000; opacity: 0; }
        .flower-overlay-container.is-active .flower-white { animation: flower-white-anim 16s forwards; }
        .flower-message {
            position: absolute; top: 50%; left: 50%; z-index: 6; display: flex; align-items: center; justify-content: center;
            transform: translate(-50%, -50%);
            min-width: min(90vw, 760px); min-height: 2.2em; padding: 0.35em 0.6em;
            background: #050505; color: #d50000; font-family: "Yu Mincho", "MS Mincho", serif;
            font-size: clamp(1.4rem, 4.5vw, 3.2rem); font-weight: bold; letter-spacing: 0.08em;
            text-align: center; text-shadow: 0 0 10px #ff0000; white-space: nowrap;
        }
        .flower-message span { position: absolute; opacity: 0; }
        .flower-overlay-container.is-active .flower-message { animation: flower-message-bg-anim 16s forwards; }
        .flower-overlay-container.is-active .flower-message span:first-child { animation: flower-message-first-anim 16s forwards; }
        .flower-overlay-container.is-active .flower-message span:last-child { animation: flower-message-second-anim 16s forwards; }
        .flower-overlay-container.is-active .flower-red { animation: flower-red-anim 16s forwards; }
        
        .blackout-curtain { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 5; }
        .flower-overlay-container.is-active .blackout-curtain { animation: curtain-anim 16s forwards; }

        /* 🌟 Rize Eye Flash Sequence 🌟 */
        .rize-eye-container {
            position: absolute; inset: 0; z-index: 10;
            display: flex; align-items: center; justify-content: center; opacity: 0;
        }
        .flower-overlay-container.is-active .rize-eye-container { animation: eye-seq-anim 16s forwards; }
        .flash-bg { position: absolute; inset: 0; background: #fff; opacity: 0; }
        .flower-overlay-container.is-active .flash-bg { animation: flash-bg-anim 16s forwards; }

        .neon-eye {
            position: relative; width: 50vw; height: 50vw; max-width: 350px; max-height: 350px;
            /* 神奇 CSS：100% 0 配合 45度旋轉會變成完美嘅眼睛形狀！ */
            border-radius: 100% 0; transform: rotate(45deg);
            box-shadow: inset 0 0 60px #0ff, 0 0 40px #0ff; opacity: 0;
        }
        .flower-overlay-container.is-active .neon-eye { animation: neon-eye-anim 16s forwards; }

        .neon-pupil {
            position: absolute; top: 50%; left: 50%; 
            width: 18vw; height: 18vw; max-width: 120px; max-height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 10%, #ff0000 30%, #400 70%, #000 90%);
            box-shadow: 0 0 30px #ff0000;
        }
        .flower-overlay-container.is-active .neon-pupil { animation: pupil-anim 16s forwards; }

        .ghoul-text {
            position: relative; z-index: 15; color: #d50000; font-size: clamp(3rem, 10vw, 6rem);
            font-family: "Yu Mincho", "MS Mincho", serif; font-weight: bold;
            text-shadow: 0 0 20px #ff0000, 2px 2px 10px #000; opacity: 0; letter-spacing: 0.1em;
        }
        .flower-overlay-container.is-active .ghoul-text { animation: ghoul-text-anim 16s forwards; }

        /* 🌟 精確到小數點嘅 16秒時間軸 🌟 */
        @keyframes overlay-bg-anim { 0%, 99% { opacity: 1; visibility: visible; } 100% { opacity: 0; visibility: hidden; } }
        
        /* 0 - 8秒: 彼岸花由白變紅 */
        @keyframes flower-white-anim { 0% { opacity: 0; } 10% { opacity: 0.7; filter: blur(0px); } 40% { opacity: 0.7; filter: blur(2px); } 50%, 100% { opacity: 0; } }
        @keyframes flower-red-anim { 0%, 20% { opacity: 0; } 40% { opacity: 1; filter: blur(0px); } 49% { opacity: 1; filter: blur(0px); transform: scale(1.05); } 50%, 100% { opacity: 0; } }
            @keyframes flower-message-bg-anim { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
            @keyframes flower-message-first-anim { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
            @keyframes flower-message-second-anim { 0%, 24% { opacity: 0; } 25%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        
        /* 第8秒: 彼岸花熄滅，進入全黑 */
        @keyframes curtain-anim { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }

        /* 第8秒 - 10秒 (50% - 62.5%): 2秒超狂眼球閃爍 */
        @keyframes eye-seq-anim { 0%, 49.9% { opacity: 0; } 50%, 62.5% { opacity: 1; } 63%, 100% { opacity: 0; } }
        @keyframes flash-bg-anim { 0%, 49.9% { opacity: 0; } 50% { opacity: 1; } 51% { opacity: 0; } 54% { opacity: 0.8; background: #ff0000; } 55%, 100% { opacity: 0; } }
        
        @keyframes neon-eye-anim {
            0%, 50% { opacity: 0; box-shadow: inset 0 0 60px #0ff, 0 0 40px #0ff; transform: rotate(45deg) scale(0.8); }
            51% { opacity: 1; box-shadow: inset 0 0 60px #0ff, 0 0 40px #0ff; transform: rotate(45deg) scale(1); }
            54% { box-shadow: inset 0 0 60px #8a2be2, 0 0 40px #8a2be2; transform: rotate(45deg) scale(1.1); } /* 紫色 */
            58% { box-shadow: inset 0 0 80px #ff0000, 0 0 50px #ff0000; transform: rotate(45deg) scale(1.2); } /* 血紅 */
            62.5% { opacity: 1; transform: rotate(45deg) scale(1); }
            63%, 100% { opacity: 0; }
        }
        
        @keyframes pupil-anim {
            0%, 50% { opacity: 0; transform: translate(-50%, -50%) rotate(-45deg) scale(0.5); }
            52% { opacity: 1; transform: translate(-50%, -50%) rotate(-45deg) scale(1.5); }
            55% { transform: translate(-50%, -50%) rotate(-45deg) scale(0.8); background: radial-gradient(circle, #fff 10%, #0ff 30%, #000 90%); box-shadow: 0 0 30px #0ff; }
            58% { transform: translate(-50%, -50%) rotate(-45deg) scale(1.2); background: radial-gradient(circle, #fff 10%, #ff0000 30%, #400 70%, #000 90%); box-shadow: 0 0 50px #ff0000; }
            62.5% { opacity: 1; transform: translate(-50%, -50%) rotate(-45deg) scale(1); }
            63%, 100% { opacity: 0; }
        }

        /* 11.2秒 (70%): 眼球消失後留白 1.2 秒先彈出文字！ */
        @keyframes ghoul-text-anim {
            0%, 68% { opacity: 0; transform: scale(0.8); } 
            71% { opacity: 1; transform: scale(1); filter: brightness(2.5); }
            75% { opacity: 1; transform: scale(1); filter: brightness(1); }
            95% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0; transform: scale(1.1); }
        }
    </style>

    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.5em; color: #ffffff;">P 東京喰種 999ver</span></h1>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const rushMedia = document.getElementById("rush-media");
        let audioUnlocked = false;

        // 🌟 注入 YouTube API 🌟
        const ytScript = document.createElement('script');
        ytScript.src = "https://www.youtube.com/iframe_api";
        const firstScript = document.getElementsByTagName('script')[0];
        firstScript.parentNode.insertBefore(ytScript, firstScript);

        let ytPlayer;
        let ytReady = false;
        let ytUnlockRequested = false;
        let ytAudioUnlocked = false;

        function unlockYouTubeAudio() {
            if (!ytReady || !ytPlayer || typeof ytPlayer.playVideo !== 'function' || ytAudioUnlocked) return;

            ytPlayer.mute();
            ytPlayer.playVideo();
            ytAudioUnlocked = true;
            setTimeout(() => {
                ytPlayer.pauseVideo();
                ytPlayer.seekTo(0);
                ytPlayer.unMute();
                ytPlayer.setVolume(100);
            }, 500);
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-audio-player', {
                height: '1', width: '1', videoId: 'p0Z8DgA0N34',
                playerVars: { 'autoplay': 0, 'controls': 0, 'start': 0, 'playsinline': 1, 'enablejsapi': 1 },
                events: { 'onReady': () => {
                    ytReady = true;
                    if (ytUnlockRequested) unlockYouTubeAudio();
                } }
            });
        }

        function playBlackout演出(hitNumber = 1) {
            try {
                if (window.audioCtx) {
                    if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
                    const ctx = window.audioCtx;
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const filter = ctx.createBiquadFilter();
                    const gainNode = ctx.createGain();

                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(200, ctx.currentTime);
                    osc1.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);

                    osc2.type = 'square';
                    osc2.frequency.setValueAtTime(150, ctx.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.2);

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4);

                    gainNode.gain.setValueAtTime(0.001, ctx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(1.0, ctx.currentTime + 0.05);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);

                    osc1.connect(gainNode);
                    osc2.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(ctx.destination);

                    osc1.start(ctx.currentTime);
                    osc2.start(ctx.currentTime);
                    osc1.stop(ctx.currentTime + 1.2);
                    osc2.stop(ctx.currentTime + 1.2);
                }
            } catch (e) { console.log(e); }

            const overlay = document.getElementById("blackout-overlay");
            if (!overlay) return sleep(6000);
            overlay.classList.remove("is-active");
            void overlay.offsetWidth;
            overlay.classList.add("is-active");
            return sleep(6000).then(() => {
                overlay.classList.remove("is-active");
            });
        }

        function playFlowerAnimation() {
            let fStr = "✿ ".repeat(400);
            let fw = document.getElementById("flower-w");
            let fr = document.getElementById("flower-r");
            if (fw && fw.innerText === "") { fw.innerText = fStr; fr.innerText = fStr; }

            try {
                if (window.audioCtx) {
                    if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
                    const ctx = window.audioCtx;
                    const drone = ctx.createOscillator();
                    const droneGain = ctx.createGain();
                    drone.type = 'sine'; 
                    drone.frequency.setValueAtTime(60, ctx.currentTime);
                    drone.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 7.8);
                    
                    droneGain.gain.setValueAtTime(0, ctx.currentTime);
                    droneGain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 3);
                    droneGain.gain.linearRampToValueAtTime(1.0, ctx.currentTime + 7.8);
                    droneGain.gain.setValueAtTime(0, ctx.currentTime + 7.9); 
                    
                    drone.connect(droneGain); droneGain.connect(ctx.destination);
                    drone.start(ctx.currentTime); drone.stop(ctx.currentTime + 7.9);
                }
            } catch (e) {}

            // 🌟 喺 8.0 秒 (眼球出現瞬間) 觸發 YouTube 2秒音效 🌟
            setTimeout(() => {
                if (ytReady && ytPlayer && typeof ytPlayer.playVideo === 'function') {
                    ytPlayer.seekTo(0);
                    ytPlayer.unMute();
                    ytPlayer.setVolume(100);
                    ytPlayer.playVideo();
                    setTimeout(() => {
                        ytPlayer.pauseVideo(); // 播完 2 秒即刻停，陷入死寂
                    }, 2000); 
                }
            }, 8000);

            const overlay = document.getElementById("flower-overlay");
            if (!overlay) return sleep(16000);
            overlay.classList.remove("is-active");
            void overlay.offsetWidth;
            overlay.classList.add("is-active");
            
            return sleep(16000).then(() => {
                overlay.classList.remove("is-active");
            });
        }

        // RUSH中獎時彈出 Rize 影片
        function playVideoPopupAndWait(mediaElement) {
            return new Promise((resolve) => {
                if (!mediaElement) return resolve();

                let isResolved = false;
                const finish = () => {
                    if (isResolved) return;
                    isResolved = true;
                    mediaElement.removeEventListener('ended', finish);
                    mediaElement.removeEventListener('error', finish);
                    mediaElement.style.display = "none";
                    resolve();
                };

                mediaElement.style.display = "block";
                mediaElement.style.position = "fixed";
                mediaElement.style.top = "50%";
                mediaElement.style.left = "50%";
                mediaElement.style.transform = "translate(-50%, -50%)";
                mediaElement.style.zIndex = "10000";
                mediaElement.style.width = "90vw";
                mediaElement.style.maxWidth = "900px";
                mediaElement.style.height = "auto";
                mediaElement.style.aspectRatio = "16 / 22";
                mediaElement.style.objectFit = "cover";
                mediaElement.style.objectPosition = "top center"; // 👈 將畫面頂住最上，黑邊就會被推出去下面裁走！
                mediaElement.style.backgroundColor = "transparent";
                mediaElement.style.border = "4px solid #d50000"; // 喰種紅色框
                mediaElement.style.boxShadow = "0 0 40px rgba(213, 0, 0, 0.8)";
                mediaElement.style.backgroundColor = "#000";
                mediaElement.style.borderRadius = "10px";

                mediaElement.currentTime = 0;
                mediaElement.addEventListener('ended', finish);
                mediaElement.addEventListener('error', finish);

                mediaElement.play().catch(e => {
                    console.log("自動播放被阻擋或出錯", e);
                    finish();
                });

                // 防卡死：50秒超時強制收埋影片繼續
                setTimeout(finish, 50000);
            });
        }

        class Ghoul999 {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 🌟 完美單次抽獎：確保每轉只消耗一次幸運值 🌟
                let roll = Math.random();

                // 🎯 路線 1: 図柄揃い (1/999) 
                if (roll < (1 / 999)) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い當選！`, "color-hit");
                    
                    // 図柄揃い 內部 50% 判定
                    if (Math.random() < 0.50) {
                        this.session_payout += 7500;
                        addLog("🌈 超プレミアム！ 7500玉獲得 ＋ HYPER喰種RUSH突入！", "color-ultimate");
                        
                        rushMedia.src = "https://files.catbox.moe/5q4j7h.mp4"; // 突入片
                        rushMedia.load();
                        addLog(`🎵 播放專屬動畫 中... 請稍候`, "color-music");
                        await playVideoPopupAndWait(rushMedia);

                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        updateUI();
                        await sleep(1000);
                        await this.play_rush();
                    } else {
                        // 演出失敗 (3000個)
                        this.session_payout += 3000;
                        addLog("😭 演出失敗... 3000玉獲得 (通常終了)", "color-normal");
                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        updateUI();
                        this.record_history();
                    }
                    return true;
                }
                
                // ⚡ 路線 2: 喰種チャージ (1/538.8) - 疊加機率
                else if (roll < (1 / 999) + (1 / 538.8)) {
                    addLog(`\n[${this.session_spins} 回轉] ⚡ 喰種CHARGE 發生！`, "color-charge");
                    if (Math.random() < 0.005) {
                        this.session_payout += 7500;
                        addLog(`ドン！！！`, "color-normal");
                        await sleep(2000);
                        await playBlackout演出();
                        addLog(`🌈 昇格発生！奇跡の 0.5%！ 7500玉獲得 ＋ HYPER喰種RUSH突入！`, "color-ultimate");
                        
                        rushMedia.src = "https://files.catbox.moe/5q4j7h.mp4";
                        rushMedia.load();
                        addLog(`🎵 播放專屬動畫 中... 請稍候`, "color-music");
                        await playVideoPopupAndWait(rushMedia);
                        
                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        updateUI();
                        await sleep(1000);
                        await this.play_rush();
                    } else {
                        // ... (照舊) ...
                        // 昇格なし (300個) - 99.5% 機率
                        this.session_payout += 300;
                        addLog(`💥 昇格なし... 2R 300玉獲得 (通常終了)`, "color-fall");
                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        updateUI();
                        this.record_history();
                    }
                    return true;
                }

                return false;
            }

            async normal_result() {
                let r = Math.random();

                if (r < 0.50) {
                    this.session_payout += 7500;
                    addLog("🌈 超プレミアム！ 7500玉獲得 ＋ RUSH突入！", "color-ultimate");
                    addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                    updateUI();

                    await sleep(1000);
                    await this.play_rush();
                } else {
                    this.session_payout += 3000;
                    addLog("😭 3000玉獲得 (通常終了)", "color-normal");
                    addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                    updateUI();
                    this.record_history();
                }
            }

            async play_rush() {
                addLog(`\n===== 🩸 喰MAXループ (ST5回) 開始 =====`, "color-ultimate");
                this.state = "RUSH";
                let st_max = 5;
                let current_st = st_max;
                updateUI();

                while (this.state === "RUSH" && current_st > 0) {
                    await sleep(600);
                    let current_spin = st_max - current_st + 1;

                    document.getElementById("ui-spins").innerText = `RUSH中: ${current_spin}/${st_max}`;

                    // RUSH中 大当り確率: 1/7.7
                    if (Math.random() < (1 / 7.7)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [ST ${current_spin}回転] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");

                        // 🌟 確保轉返原本嘅 Rize 影片 🌟
                        rushMedia.src = "https://files.catbox.moe/t3rubq.mp4";
                        rushMedia.load(); // 👈 🌟 關鍵防卡死：強制載入新影片

                        addLog(`🎵 播放專屬動畫 (rize.mp4) 中... 請稍候`, "color-music");
                        await playVideoPopupAndWait(rushMedia);

                        let payout = 3000;
                        addLog(`💥 3000玉獲得！`, "color-ultimate");

                        let uwanoseCount = 0;

                        // 50% Loop 追加 3000玉
                        while (Math.random() < 0.50) {
                            await sleep(600);
                            payout += 3000;
                            uwanoseCount++;
                            addLog(`🌈 さらに上乗せ！ +3000玉 (計 ${payout}玉)`, "color-ultimate");

                            // 🌟 第3次上乗せ (即係達到 12000玉) 嘅時候播片！
                            if (uwanoseCount === 3) {
                                rushMedia.src = "https://files.catbox.moe/4nkuj0.mp4";
                                rushMedia.load(); // 👈 🌟 關鍵防卡死：強制載入 12000玉影片

                                addLog(`🎵 播放專屬動畫 (12000玉到達) 中... 請稍候`, "color-music");
                                await playVideoPopupAndWait(rushMedia);
                            }
                        }

                        // 👇 將 while loop 之後嘅結算代碼替換成以下內容 👇
                        this.session_payout += payout;
                        
                        // 🌟 修正：淨係計「今次呢一波」嘅 payout (單擊+連續上乘) 係咪超過 3萬玉 🌟
                        if (payout >= 30000) {
                            addLog(`🩸 僕は、喰種だ`, "color-ultimate");
                            await playFlowerAnimation();
                        }

                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        addLog("🩸 喰MAXループ 継続!!", "color-rush");
                        // 👆 替換完畢 👆

                        current_st = st_max; // ST 回復
                        updateUI();
                        await sleep(800);
                    } else {
                        current_st--;
                    }
                }

                if (current_st === 0) {
                    document.getElementById("ui-spins").innerText = `RUSH中: ${st_max}/${st_max}`;
                    addLog("\n💀 ST抜け... RUSH終了", "color-fall");
                    this.end_rush();
                }
            }

            end_rush() {
                addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new Ghoul999();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const btnReset = document.getElementById("btn-reset");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            if(btnReset) btnReset.disabled = true;

            if (!audioUnlocked) {
                if (rushMedia) rushMedia.load();
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    window.audioCtx = new AudioContextClass();
                    if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
                }
                
                // 🌟 預先解鎖 YouTube 音軌 (API 延遲 ready 時會由 onReady 補做) 🌟
                ytUnlockRequested = true;
                unlockYouTubeAudio();
                audioUnlocked = true;
            }

            addLog("\n=== ゲーム開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0) {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            if(btnReset) btnReset.disabled = false;
            btnPlay.innerText = "▶️ 繼續抽機";
        }

        function resetGame() {
            game = new Ghoul999();
            logBox.innerHTML = "";
            renderHistoryTable([]);
            updateUI();

            rushMedia.pause();
            rushMedia.currentTime = 0;
            rushMedia.style.display = "none";

            addLog("遊戲紀錄已重置。", "color-normal");
            btnPlay.innerText = "▶️ 遊戲開始";
        }
