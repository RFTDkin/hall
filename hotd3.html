<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】e 学園黙示録ハイスクール・オブ・ザ・デッド3 | パチンコシミュレーター</title>
    <meta name="machine-title" content="e 学園黙示録3">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a0005; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #ff1744; text-shadow: 0 0 15px rgba(255, 23, 68, 0.7); font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #2b0005; border: 2px solid #ff1744; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(255, 23, 68, 0.5); }
        .stat-item span { display: block; font-weight: bold; color: #ff5252; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #d50000 0%, #880000 100%); color: white; border: 1px solid #ff5252; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #ff1744; }
        button:disabled { background: #3e001b; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #ff1744; border-radius: 5px; height: 400px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-rush { color: #00e676; font-weight: bold; text-shadow: 0 0 5px #00e676; } /* 奴RUSH 綠色 */
        .color-lt { color: #ffea00; font-weight: 900; text-shadow: 0 0 15px #ffea00; font-size: 1.1em; } /* LT 金色 */
        .color-hit { color: #ff1744; font-weight: bold; text-shadow: 0 0 5px #ff1744; }
        .color-normal { color: #bdbdbd; }
        .color-fall { color: #757575; font-weight: bold; }
        .data-lamp-container { background-color: #2b0005; border: 3px solid #ff1744; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(255, 23, 68, 0.5); }
        .data-lamp-title { color: #ff5252; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #ff5252; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #880000; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #4a000a; color: #ffea00; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #330005; }
        table.data-lamp td.hit-spins { color: #ffea00; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff1744; font-weight: bold; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>
<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">e 学園黙示録H.O.T.D.3</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ サバイバル開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        class Hotd3 {
            constructor() { this.state = "NORMAL"; this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.history = []; this.rush_spins = 0; }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉数: ${this.session_spins}`, "color-normal");

                // 1/299.2 初当り抽選
                if (Math.random() < 1 / 299.2) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 BONUS當選！ (660玉)`, "color-hit");
                    this.session_rush_count = 1;
                    this.session_payout += 660;
                    
                    let roll = Math.random();
                    // 0.5% LT直行, 49.5% 奴RUSH, 50% 通常
                    if (roll < 0.005) {
                        addLog("🌈 奇跡のブラックアウト！ LT直行！！", "color-lt");
                        updateUI(); await sleep(1500);
                        await this.play_rush("LT"); 
                    } else if (roll < 0.50) {
                        addLog("🟢 チャレンジ成功！ 奴RUSH突入！", "color-rush");
                        updateUI(); await sleep(1500);
                        await this.play_rush("RUSH");
                    } else {
                        addLog("💀 チャレンジ失敗... 通常へ戻る", "color-fall");
                        updateUI(); this.record_history();
                    }
                    return true;
                }
                return false;
            }

            getRightPayout() {
                let r = Math.random() * 100;
                if (r < 40) return { balls: 1200, name: "10R" };
                if (r < 41) return { balls: 960, name: "8R" };
                if (r < 44) return { balls: 840, name: "7R" };
                if (r < 50) return { balls: 720, name: "6R" };
                return { balls: 360, name: "3R" };
            }

            async play_rush(rushType) {
                this.state = rushType;
                
                while (this.state !== "NORMAL") {
                    // RUSH(ST47+4) または LT(ST80+4)
                    let max_spins = this.state === "LT" ? 84 : 51;
                    let main_st = this.state === "LT" ? 80 : 47;
                    
                    if (this.state === "RUSH") {
                        addLog(`\n===== 🧟 奴RUSH (ST47+4回転) =====`, "color-rush");
                    } else {
                        addLog(`\n===== 👑 奴RUSH SUPER (ST80+4回転) =====`, "color-lt");
                    }
                    updateUI();
                    
                    let hit = false;
                    for (this.rush_spins = 1; this.rush_spins <= max_spins; this.rush_spins++) {
                        await sleep(40);
                        
                        // 🌟 新增：區分 ST 同 殘保留 嘅邏輯
                        let isReserve = this.rush_spins > main_st;
                        let phaseName = isReserve ? '残保留' : 'ST';
                        let current_spin_in_phase = isReserve ? (this.rush_spins - main_st) : this.rush_spins;
                        
                        if (!isReserve) {
                            // ST中顯示
                            document.getElementById("ui-spins").innerText = `ST中: ${current_spin_in_phase}/${main_st}`;
                        } else {
                            // 殘保留顯示 + 寫入 Log 增加緊張感
                            document.getElementById("ui-spins").innerText = `残保留: ${current_spin_in_phase}/4`;
                            addLog(`⏳ 残保留 ${current_spin_in_phase}回転目...`, "color-normal");
                            await sleep(250); // 殘保加少少 delay 更有 Feel
                        }

                        // 1/32.4 大当り抽選
                        if (Math.random() < 1 / 32.4) {
                            hit = true;
                            this.session_rush_count += 1;
                            
                            // 🌟 喺 Log 清楚顯示係 ST 定 殘保留 當選[cite: 18]
                            addLog(`\n🎉 [${phaseName} ${current_spin_in_phase}回転目] 奴RUSH中BONUS！ (總 ${this.session_rush_count}連)`, "color-hit");
                            
                            let payoutData = this.getRightPayout();
                            this.session_payout += payoutData.balls;
                            
                            let pColor = payoutData.balls >= 1200 ? "color-lt" : "color-hit";
                            addLog(`▶ ${payoutData.name}大当り！ ${payoutData.balls}玉 獲得！`, pColor);
                            
                            // 只要喺 RUSH (ST47+4) 中當選，必升格 LT
                            if (this.state === "RUSH") {
                                await sleep(500);
                                addLog(`🚀 ラッキートリガー発動！！ 奴RUSH SUPER昇格！！`, "color-lt");
                                this.state = "LT"; 
                            }
                            
                            updateUI(); await sleep(1000);
                            break; // ST再セットのためforループを抜ける
                        }
                    }

                    if (!hit) {
                        document.getElementById("ui-spins").innerText = `終了`;
                        addLog(`\n💀 RUSH終了...`, "color-fall");
                        addLog(`📈 總連莊数: ${this.session_rush_count}連`);
                        addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                        this.state = "NORMAL"; 
                        this.record_history(); 
                        updateUI();
                        break;
                    }
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.state = "NORMAL";
            }
        }

        let game = new Hotd3();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            addLog("\n=== e 学園黙示録H.O.T.D.3 稼働開始！ ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
