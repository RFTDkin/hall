<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】Pこの素晴らしい世界に祝福を！199LT | パチンコシミュレーター</title>
    <meta name="machine-title" content="Pこのすば 199LT">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #001e36; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.7); font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #001220; border: 2px solid #00e5ff; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.5); }
        .stat-item span { display: block; font-weight: bold; color: #64ffda; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #0091ea 0%, #004d40 100%); color: white; border: 1px solid #00e5ff; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #00e5ff; }
        button:disabled { background: #1a2a3a; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #00e5ff; border-radius: 5px; height: 400px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-rush { color: #00e676; font-weight: bold; text-shadow: 0 0 5px #00e676; } /* このすばRUSH */
        .color-lt { color: #ffea00; font-weight: 900; text-shadow: 0 0 15px #ffea00; font-size: 1.1em; } /* 祝福RUSH */
        .color-hit { color: #ff4081; font-weight: bold; text-shadow: 0 0 5px #ff4081; }
        .color-normal { color: #bdbdbd; }
        .color-fall { color: #757575; font-weight: bold; }
        .data-lamp-container { background-color: #001220; border: 3px solid #00e5ff; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
        .data-lamp-title { color: #64ffda; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #64ffda; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #00796b; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #004d40; color: #ffea00; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #00251a; }
        table.data-lamp td.hit-spins { color: #ffea00; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff4081; font-weight: bold; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>
<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">Pこの素晴らしい世界に祝福を！199LTVer.</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 冒険に出発</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        class Konosuba {
            constructor() { this.state = "NORMAL"; this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.history = []; this.rush_spins = 0; }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉数: ${this.session_spins}`, "color-normal");

                // 1/199.8 初当り抽選
                if (Math.random() < 1 / 199.8) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 この素晴らしい大当りに祝福を！ (420玉)`, "color-hit");
                    this.session_rush_count = 1;
                    this.session_payout += 420;
                    
                    addLog("🟢 100%突入！ このすばRUSH！", "color-rush");
                    updateUI(); await sleep(1500);
                    await this.play_rush("RUSH"); 
                    return true;
                }
                return false;
            }

            async play_rush(initial_state) {
                this.state = initial_state;
                
                while (this.state !== "NORMAL") {
                    if (this.state === "RUSH") {
                        // このすばRUSH (ST77+4)
                        let max_spins = 81;
                        let main_st = 77;
                        
                        addLog(`\n===== 🟢 このすばRUSH (ST77+4回転) =====`, "color-rush");
                        updateUI();
                        
                        let hit = false;
                        for (this.rush_spins = 1; this.rush_spins <= max_spins; this.rush_spins++) {
                            await sleep(40);
                            
                            let isReserve = this.rush_spins > main_st;
                            let phaseName = isReserve ? '残保留' : 'ST';
                            let current_spin = isReserve ? (this.rush_spins - main_st) : this.rush_spins;
                            
                            if (!isReserve) {
                                document.getElementById("ui-spins").innerText = `ST中: ${current_spin}/${main_st}`;
                            } else {
                                document.getElementById("ui-spins").innerText = `残保留: ${current_spin}/4`;
                                addLog(`⏳ 残保留 ${current_spin}回転目...`, "color-normal");
                                await sleep(250); 
                            }

                            // 1/67.3 大当り抽選
                            if (Math.random() < 1 / 67.3) {
                                hit = true;
                                this.session_rush_count += 1;
                                addLog(`\n🎉 [${phaseName} ${current_spin}回転目] 当選！ (總 ${this.session_rush_count}連)`, "color-hit");
                                
                                let r = Math.random();
                                if (!isReserve) {
                                    // 電サポ中 (0.5% LT, 49.5% 1500, 50% 330)
                                    if (r < 0.005) {
                                        this.session_payout += 1500;
                                        addLog(`🌈 超このすばBONUS！ 1500玉 獲得！`, "color-lt");
                                        addLog(`🚀 ラッキートリガー発動！ 祝福RUSH昇格！！`, "color-lt");
                                        this.state = "LT";
                                    } else if (r < 0.500) {
                                        this.session_payout += 1500;
                                        addLog(`▶ 10R大当り！ 1500玉 獲得！`, "color-hit");
                                    } else {
                                        this.session_payout += 330;
                                        addLog(`▶ 4R大当り！ 330玉 獲得`, "color-rush");
                                    }
                                } else {
                                    // 残り保留 (50% 1500+LT, 38.6% 330+LT, 11.4% 330+ST)
                                    if (r < 0.500) {
                                        this.session_payout += 1500;
                                        addLog(`🌈 残保留から奇跡！ 10R大当り (1500玉)`, "color-lt");
                                        addLog(`🚀 ラッキートリガー発動！ 祝福RUSH昇格！！`, "color-lt");
                                        this.state = "LT";
                                    } else if (r < 0.886) {
                                        this.session_payout += 330;
                                        addLog(`🌈 残保留から奇跡！ 4R大当り (330玉)`, "color-lt");
                                        addLog(`🚀 ラッキートリガー発動！ 祝福RUSH昇格！！`, "color-lt");
                                        this.state = "LT";
                                    } else {
                                        this.session_payout += 330;
                                        addLog(`▶ 4R大当り！ 330玉 獲得`, "color-rush");
                                    }
                                }
                                
                                addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                                updateUI(); await sleep(1000);
                                break; 
                            }
                        }

                        if (!hit) {
                            document.getElementById("ui-spins").innerText = `終了`;
                            addLog(`\n💀 クエスト失敗... (RUSH終了)`, "color-fall");
                            addLog(`📈 總連莊数: ${this.session_rush_count}連`);
                            addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                            this.state = "NORMAL"; 
                            this.record_history(); 
                            updateUI();
                        }
                    } else if (this.state === "LT") {
                        // 祝福RUSH (実質次回まで / ループタイプ)
                        addLog(`\n===== 👑 祝福RUSH (継続率 約89%) =====`, "color-lt");
                        let hit_spin = 0;
                        
                        while(true) {
                            await sleep(40);
                            hit_spin++;
                            document.getElementById("ui-spins").innerText = `祝福RUSH: ${hit_spin}回転`;
                            
                            if (Math.random() < 1 / 67.3) {
                                this.session_rush_count += 1;
                                addLog(`\n🎉 [祝福RUSH ${hit_spin}回転目] 当選！ (總 ${this.session_rush_count}連)`, "color-lt");
                                
                                let r = Math.random();
                                // LT中 (50% 1500+LT, 38.6% 330+LT, 11.4% 330+ST降格)
                                if (r < 0.500) {
                                    this.session_payout += 1500;
                                    addLog(`👑 祝福BONUS！ 1500玉 獲得！ (LT継続)`, "color-lt");
                                } else if (r < 0.886) {
                                    this.session_payout += 330;
                                    addLog(`👑 祝福BONUS！ 330玉 獲得！ (LT継続)`, "color-lt");
                                } else {
                                    this.session_payout += 330;
                                    addLog(`⚠️ 終了のピンチ... 330玉 獲得`, "color-fall");
                                    addLog(`📉 祝福RUSH終了... 「このすばRUSH」へ降格`, "color-fall");
                                    this.state = "RUSH"; // 降格
                                }
                                
                                addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                                updateUI(); await sleep(1000);
                                break; // Break inner loop to restart state
                            }
                        }
                    }
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.state = "NORMAL";
            }
        }

        let game = new Konosuba();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            addLog("\n=== Pこの素晴らしい世界に祝福を！199LT 開始！ ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
