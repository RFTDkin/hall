<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柏青哥模擬器 (P EDENS ZERO)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050a1f;
            color: #e0e0e0;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #4fc3f7;
            text-shadow: 0 0 15px rgba(79, 195, 247, 0.7);
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #0d1b2a;
            border: 2px solid #4fc3f7;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(79, 195, 247, 0.5);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffca28;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #0277bd;
            color: white;
            border: 1px solid #4fc3f7;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        button:hover { background-color: #0288d1; box-shadow: 0 0 10px #4fc3f7; }
        button:disabled { background-color: #1a2a3a; border-color: #444; color: #777; cursor: not-allowed; box-shadow: none; }
        
        #btn-reset { background-color: #424242; border-color: #616161; }
        #btn-reset:hover { background-color: #212121; box-shadow: 0 0 10px #616161; }

        .log-container {
            background-color: #000000;
            border: 1px solid #4fc3f7;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #00e676; font-weight: bold; text-shadow: 0 0 5px #00e676; }
        .color-ultra { color: #d500f9; font-weight: bold; text-shadow: 0 0 10px #d500f9; font-size: 1.1em; }
        .color-hit { color: #4fc3f7; font-weight: bold; }
        .color-normal { color: #9e9e9e; }
        .color-charge { color: #ff9800; font-weight: bold; }
        .color-ultimate { color: #ff5252; font-weight: bold; text-shadow: 0 0 10px #ff5252; font-size: 1.1em; }
        .color-fall { color: #757575; font-style: italic; }

        .data-lamp-container {
            background-color: #050a1f;
            border: 3px solid #4fc3f7;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(79, 195, 247, 0.4);
        }

        .data-lamp-title {
            color: #4fc3f7;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #4fc3f7;
            letter-spacing: 2px;
        }

        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #0277bd; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #0d1b2a; color: #ffca28; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #081020; }
        table.data-lamp td.hit-spins { color: #4fc3f7; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ffca28; font-weight: bold; }
        .empty-row { color: #555 !important; }
    </style>
</head>

<body>

    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.6em; color: #ffca28;">P EDENS ZERO (究極LT)</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 開始冒險</button>
                <button id="btn-reset" onclick="resetGame()">🔄 紀錄重置</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉数</th>
                            <th>連莊数</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class EdensMachine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = []; 
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                let r = Math.random();
                let prob_399 = 1 / 399.9;
                let prob_charge = 1 / 2799.9;

                // 図柄揃い (1/399.9)
                if (r < prob_399) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い！ (1500玉)`, "color-hit");
                    this.session_payout += 1500;
                    updateUI();
                    await sleep(1000);

                    // 50% 絆バトルRUSH突入
                    if (Math.random() < 0.50) {
                        addLog("✨ EDENS BONUS！ 絆バトルRUSH 突入！", "color-rush");
                        await sleep(1000);
                        await this.play_rush();
                    } else {
                        addLog("😭 演出失敗... (通常へ戻る)", "color-normal");
                        addLog(`💰 本次總出玉: ${this.session_payout} 玉`);
                        this.record_history();
                    }
                    return true;
                } 
                // チャージ当たり (1/2799.9)
                else if (r < prob_399 + prob_charge) {
                    addLog(`\n[${this.session_spins} 回轉] ⚡ チャージ当り (300玉)`, "color-charge");
                    this.session_payout += 300;
                    updateUI();
                    return false; // チャージ唔算正式初當，繼續行
                }
                return false;
            }

            // 處理転落式抽籤 (回傳消耗轉數及是否中獎)
            getFalldownResult(hitProb, fallProb) {
                let p_event = hitProb + fallProb;
                let spins = 1;
                // 如果機率總和小於 1，可以用對數計算空轉次數
                if (p_event < 1) {
                    spins = Math.floor(Math.log(Math.random()) / Math.log(1 - p_event)) + 1;
                }
                // 根據各自權重決定係 Hit 定係 Fall
                let isHit = Math.random() < (hitProb / p_event);
                return { spins, isHit };
            }

            async play_rush() {
                this.state = "LT";
                addLog(`\n===== 🛡️ 絆バトルRUSH (LT) 開始 =====`, "color-rush");
                updateUI();

                let st_active = true;

                while (st_active) {
                    let hitProb = this.state === "LT" ? (1 / 1.7) : (1 / 1.3);
                    let fallProb = this.state === "LT" ? (1 / 5.7) : (1 / 4.2);
                    
                    let result = this.getFalldownResult(hitProb, fallProb);
                    
                    await sleep(200); 
                    document.getElementById("ui-spins").innerText = `BATTLE中...`;

                    if (result.isHit) {
                        this.session_rush_count++;
                        
                        if (this.state === "LT") {
                            let pr = Math.random();
                            // 絆バトルRUSH 振分 (根據計算 33% 觸發 Judgement)
                            if (pr < 0.007) {
                                this.session_payout += 7500;
                                addLog(`🌈 究極臨界JUDGEMENT！ 7500個獲得！！！`, "color-ultimate");
                                this.state = "ULTRA";
                            } else if (pr < 0.007 + 0.046) {
                                this.session_payout += 6000;
                                addLog(`💥 究極臨界JUDGEMENT！ 6000個獲得！！`, "color-ultra");
                                this.state = "ULTRA";
                            } else if (pr < 0.007 + 0.046 + 0.110) {
                                this.session_payout += 4500;
                                addLog(`✨ 究極臨界JUDGEMENT！ 4500個獲得！`, "color-ultra");
                                this.state = "ULTRA";
                            } else if (pr < 0.007 + 0.046 + 0.110 + 0.117) {
                                this.session_payout += 3000;
                                addLog(`✨ 究極臨界JUDGEMENT！ 3000個獲得！`, "color-ultra");
                                this.state = "ULTRA";
                            } else {
                                this.session_payout += 1500;
                                addLog(`⚔️ 絆BONUS (1500玉) 獲得！`, "color-hit");
                            }

                            if (this.state === "ULTRA") {
                                await sleep(1000);
                                addLog(`\n🌌 覚醒！ ULTRA OVER DRIVE (究極LT) へ突入！！ 🌌`, "color-ultra");
                            }
                        } 
                        else { // ULTRA OVER DRIVE 振分
                            let pr = Math.random();
                            if (pr < 0.022) {
                                this.session_payout += 7500;
                                addLog(`🌈 OVER DRIVE BONUS！ 7500個獲得！！！`, "color-ultimate");
                            } else if (pr < 0.022 + 0.141) {
                                this.session_payout += 6000;
                                addLog(`💥 OVER DRIVE BONUS！ 6000個獲得！！`, "color-ultra");
                            } else if (pr < 0.022 + 0.141 + 0.336) {
                                this.session_payout += 4500;
                                addLog(`✨ OVER DRIVE BONUS！ 4500個獲得！`, "color-ultra");
                            } else if (pr < 0.022 + 0.141 + 0.336 + 0.356) {
                                this.session_payout += 3000;
                                addLog(`✨ OVER DRIVE BONUS！ 3000個獲得！`, "color-ultra");
                            } else {
                                this.session_payout += 1500;
                                addLog(`💧 魔王BONUS (1500玉) 獲得`, "color-hit");
                            }
                        }

                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        updateUI();
                        await sleep(1000);

                    } else {
                        // 転落
                        addLog("\n💀 バトル敗北... (転落)", "color-fall");
                        addLog(`📈 總連莊數: ${this.session_rush_count}連`);
                        addLog(`💰 最終出玉: ${this.session_payout} 玉`);

                        this.state = "NORMAL";
                        this.record_history();
                        updateUI();
                        st_active = false;
                    }
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new EdensMachine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const btnReset = document.getElementById("btn-reset");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            btnReset.disabled = true;

            addLog("\n=== 冒險開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0) {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnReset.disabled = false;
            btnPlay.innerText = "▶️ 繼續打玉";
        }

        function resetGame() {
            game = new EdensMachine();
            logBox.innerHTML = "";
            renderHistoryTable([]);
            updateUI();
            addLog("遊戲紀錄已重置。", "color-normal");
            btnPlay.innerText = "▶️ 開始冒險";
        }
    </script>
    
    <script src="plugin.js"></script>
</body>
</html>
