<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バグ報告と追加して欲しい機種 - 掲示板</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at center, #1a001a 0%, #000000 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .home-btn {
            background-color: #21262d;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid #30363d;
            transition: all 0.2s;
        }

        .home-btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        h1 {
            color: #2ea043;
            text-align: center;
            text-shadow: 0 0 15px rgba(46, 160, 67, 0.5);
        }

        p.desc {
            text-align: center;
            color: #8b949e;
            margin-bottom: 30px;
        }

        .input-section {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px;
            font-size: 1em;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .submit-btn {
            background-color: #238636;
            color: white;
            border: 1px solid rgba(240, 246, 252, 0.1);
            padding: 10px 25px;
            font-size: 1em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            float: right;
        }

        .submit-btn:hover {
            background-color: #2ea043;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        .message-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .message-author {
            font-weight: bold;
            color: #ffca28;
        }

        .message-date {
            color: #8b949e;
        }

        .message-body {
            color: #e6edf3;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .rainbow-text {
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00e5ff, #c500ff, #ff0000);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-bg 2s linear infinite;
            font-weight: 900;
        }

        /* 🌟 巢狀回覆 (子留言) 專用樣式 🌟 */
        .reply-list { margin-top: 15px; border-top: 1px dashed #30363d; padding-top: 10px; }
        .reply-card { background: #0d1117; border-radius: 6px; padding: 10px; margin-bottom: 8px; border-left: 3px solid #388bfd; }
        .reply-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.85em; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .reply-input-area { margin-top: 10px; display: none; background: #161b22; padding: 10px; border-radius: 6px; border: 1px solid #30363d; }
        .reply-input-area textarea { width: 100%; height: 50px; margin-bottom: 5px; font-size: 0.9em; }
        .btn-small { padding: 5px 10px; font-size: 0.8em; }

        @keyframes rainbow-bg {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 200% 50%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="home-btn">🏠 ホールに戻る</a>
        </div>

        <h1>機種要望 掲示板</h1>
        <p class="desc">追加して欲しい機種があればここに書き込んでください！</p>

        <div class="input-section clearfix">
            <div id="login-warning" style="color: #ff5252; margin-bottom: 10px; font-weight: bold; display: none;">
                ※書き込むにはログインが必要です。</div>
            <textarea id="msg-input" placeholder="メッセージを入力..."></textarea>
            <button id="btn-submit" class="submit-btn" onclick="submitMessage()">送信する</button>
        </div>

        <div class="message-list" id="message-container">
            <div style="text-align: center; color: #888;">読み込み中...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBfaLasiMg8AWvKvFONPePt-dIZ46x3yus",
            authDomain: "p-hall.firebaseapp.com",
            databaseURL: "https://p-hall-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "p-hall",
            storageBucket: "p-hall.firebasestorage.app",
            messagingSenderId: "656958771527",
            appId: "1:656958771527:web:baee4ad9c5350ee31e3c62",
            measurementId: "G-46M19VQVY2"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUserName = null;
        let hasCompleted = false;

        auth.onAuthStateChanged((user) => {
            const btnSubmit = document.getElementById("btn-submit");
            const inputField = document.getElementById("msg-input");
            const warning = document.getElementById("login-warning");

            if (user) {
                db.ref('users/' + user.uid).once('value').then((snap) => {
                    if (snap.exists()) {
                        let userData = snap.val();
                        currentUserName = userData.username;
                        hasCompleted = userData.has_completed || false;

                        btnSubmit.disabled = false;
                        inputField.disabled = false;
                        warning.style.display = "none";
                    }
                });
            } else {
                currentUserName = null;
                btnSubmit.disabled = true;
                btnSubmit.style.backgroundColor = "#333";
                inputField.disabled = true;
                inputField.placeholder = "※書き込むにはログインが必要です。";
                warning.style.display = "block";
            }
        });

        function submitMessage() {
            const inputEl = document.getElementById("msg-input");
            const text = inputEl.value.trim();

            if (!currentUserName) {
                alert("ログインしてください。");
                return;
            }
            if (text === "") {
                alert("メッセージを入力してください。");
                return;
            }

            const btnSubmit = document.getElementById("btn-submit");
            btnSubmit.disabled = true;
            btnSubmit.innerText = "送信中...";

            db.ref('community_requests').push({
                uid: auth.currentUser.uid,
                user: currentUserName,
                has_completed: hasCompleted,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                inputEl.value = "";
                btnSubmit.disabled = false;
                btnSubmit.innerText = "送信する";
            }).catch(err => {
                alert("エラーが発生しました: " + err.message);
                btnSubmit.disabled = false;
                btnSubmit.innerText = "送信する";
            });
        }

        // 監聽數據庫，實時顯示留言與回覆
        db.ref('community_requests').orderByChild('timestamp').on('value', (snapshot) => {
            const container = document.getElementById("message-container");
            container.innerHTML = "";

            if (!snapshot.exists()) {
                container.innerHTML = `<div style="text-align: center; color: #888;">まだメッセージはありません。最初の投稿をしてみましょう！</div>`;
                return;
            }

            const parents = [];
            const replies = {};

            // 🌟 1. 將所有數據分類為主留言 (parents) 同 回覆 (replies)
            snapshot.forEach(child => {
                let msg = child.val();
                msg.key = child.key;
                if (msg.parentId) {
                    if (!replies[msg.parentId]) replies[msg.parentId] = [];
                    replies[msg.parentId].push(msg);
                } else {
                    parents.push(msg);
                }
            });

            // 🌟 2. 顯示主留言，並將對應嘅回覆攝入去下面
            parents.reverse().forEach(msg => {
                const date = new Date(msg.timestamp);
                const dateString = `${date.getFullYear()}/${(date.getMonth()+1).toString().padStart(2, '0')}/${date.getDate().toString().padStart(2, '0')} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                
                // 判斷係咪開發者 (加入埋 ITパチンカス)
                let adminList = ["葉永健", "イヨンケン", "Ip WingKin", "ITパチンカス"];
                let isAdmin = adminList.includes(msg.user); 

                let authorHtml = msg.has_completed ? `<span class="rainbow-text">${escapeHtml(msg.user)}</span>` : escapeHtml(msg.user);
                if (isAdmin) authorHtml += ` <span style="background: #ffca28; color: #111; font-size: 0.75em; padding: 2px 8px; border-radius: 4px; font-weight: 900; margin-left: 8px; box-shadow: 0 0 8px rgba(255, 202, 40, 0.6); border: 1px solid #ffb300;">🛠️ 開発者</span>`;

                let deleteBtnHtml = "";
                if (auth.currentUser && msg.uid === auth.currentUser.uid) {
                    deleteBtnHtml = `<button onclick="deleteMsg('${msg.key}')" style="background: #d32f2f; color: white; border: 1px solid #b71c1c; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8em; margin-left: 10px;">🗑️ 削除</button>`;
                }

                // 展開內部輸入框嘅按鈕
                let replyBtnHtml = `<button onclick="toggleReplyBox('${msg.key}')" style="background: #1f6feb; color: white; border: 1px solid #388bfd; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8em; margin-left: 15px;">↩️ 返信</button>`;

                // 組合子留言 HTML
                let repliesHtml = "";
                if (replies[msg.key]) {
                    repliesHtml += `<div class="reply-list">`;
                    replies[msg.key].forEach(rep => {
                        const rDate = new Date(rep.timestamp);
                        const rDateStr = `${rDate.getFullYear()}/${(rDate.getMonth()+1).toString().padStart(2, '0')}/${rDate.getDate().toString().padStart(2, '0')} ${rDate.getHours().toString().padStart(2, '0')}:${rDate.getMinutes().toString().padStart(2, '0')}`;
                        
                        let rIsAdmin = adminList.includes(rep.user);
                        let rAuthorHtml = rep.has_completed ? `<span class="rainbow-text">${escapeHtml(rep.user)}</span>` : escapeHtml(rep.user);
                        if (rIsAdmin) rAuthorHtml += ` <span style="background: #ffca28; color: #111; font-size: 0.7em; padding: 1px 6px; border-radius: 4px; font-weight: 900; margin-left: 5px;">🛠️ 開発者</span>`;

                        let rDeleteHtml = "";
                        if (auth.currentUser && rep.uid === auth.currentUser.uid) {
                            rDeleteHtml = `<button onclick="deleteMsg('${rep.key}')" style="background: transparent; border:none; color: #d32f2f; cursor: pointer; font-size: 0.8em; margin-left: 10px;">🗑️</button>`;
                        }

                        repliesHtml += `
                            <div class="reply-card">
                                <div class="reply-header">
                                    <div class="message-author">👤 ${rAuthorHtml}</div>
                                    <div class="message-date" style="font-size: 0.9em;">${rDateStr} ${rDeleteHtml}</div>
                                </div>
                                <div class="message-body" style="font-size: 0.95em;">${escapeHtml(rep.text)}</div>
                            </div>
                        `;
                    });
                    repliesHtml += `</div>`;
                }

                const card = document.createElement("div");
                card.className = "message-card";
                card.innerHTML = `
                    <div class="message-header">
                        <div class="message-author">👤 ${authorHtml}</div>
                        <div class="message-date">${dateString} ${replyBtnHtml} ${deleteBtnHtml}</div>
                    </div>
                    <div class="message-body">${escapeHtml(msg.text)}</div>
                    ${repliesHtml}
                    
                    <!-- 隱藏嘅內聯回覆輸入框 -->
                    <div class="reply-input-area" id="reply-box-${msg.key}">
                        <textarea id="reply-input-${msg.key}" placeholder="返信を入力..."></textarea>
                        <button class="submit-btn btn-small" onclick="submitReply('${msg.key}')">返信を送信</button>
                        <button class="submit-btn btn-small" style="background: #444; margin-right: 10px;" onclick="toggleReplyBox('${msg.key}')">キャンセル</button>
                        <div style="clear:both;"></div>
                    </div>
                `;
                container.appendChild(card);
            });
        });

        function escapeHtml(unsafe) {
            if (!unsafe) return "";
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 🌟 執行刪除留言嘅函數
        function deleteMsg(key) {
            if (confirm("本当にこのメッセージを削除しますか？")) {
                db.ref('community_requests/' + key).remove()
                .catch(err => {
                    alert("削除エラーが発生しました: " + err.message);
                });
            }
        }

        // 🌟 開關子留言輸入框
        function toggleReplyBox(key) {
            if (!currentUserName) {
                alert("返信する前にログインしてください。");
                return;
            }
            const box = document.getElementById('reply-box-' + key);
            if (box.style.display === "block") {
                box.style.display = "none";
            } else {
                box.style.display = "block";
                document.getElementById('reply-input-' + key).focus();
            }
        }

        // 🌟 發送子留言 (附帶 parentId)
        function submitReply(parentKey) {
            const inputEl = document.getElementById('reply-input-' + parentKey);
            const text = inputEl.value.trim();
            
            if (text === "") {
                alert("メッセージを入力してください。");
                return;
            }

            db.ref('community_requests').push({
                uid: auth.currentUser.uid,
                user: currentUserName,
                has_completed: hasCompleted,
                text: text,
                parentId: parentKey, // 🌟 關鍵：標記呢條係回覆緊邊個
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                inputEl.value = "";
                toggleReplyBox(parentKey); // 成功後自動收埋個輸入框
            }).catch(err => {
                alert("エラーが発生しました: " + err.message);
            });
        }
    </script>
</body>

</html>
