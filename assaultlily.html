<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eアサルトリリィ | パチンコシミュレーター</title>
    <meta name="machine-title" content="eアサルトリリィ">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #160612; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #ff4081; text-shadow: 0 0 15px rgba(255, 64, 129, 0.8), 0 0 25px #e040fb; font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #290b22; border: 2px solid #ff4081; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(255, 64, 129, 0.45); }
        .stat-item span { display: block; font-weight: bold; color: #ffea00; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #ff4081 0%, #880e4f 100%); color: white; border: 1px solid #ffea00; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #ff4081; }
        button:disabled { background: #3b1331; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #ff4081; border-radius: 5px; height: 420px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-hit { color: #ff80ab; font-weight: bold; text-shadow: 0 0 5px #ff4081; }
        .color-normal { color: #bdbdbd; }
        .color-fall { color: #757575; font-weight: bold; }
        .color-rush { color: #ff4081; font-weight: bold; text-shadow: 0 0 5px #ff4081; }
        .color-judge { color: #00e5ff; font-weight: bold; text-shadow: 0 0 5px #00e5ff; }
        .color-reset { color: #00e676; font-weight: bold; }
        .color-skill-charisma { color: #d500f9; font-weight: 900; text-shadow: 0 0 8px #d500f9; }
        .color-skill-kamishuku { color: #00e5ff; font-weight: 900; text-shadow: 0 0 10px #00e5ff; }
        .color-skill-angel { color: #ffea00; font-weight: 900; text-shadow: 0 0 12px #ff4081, 0 0 20px #ffea00; font-size: 1.05em; }
        .data-lamp-container { background-color: #290b22; border: 3px solid #ff4081; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(255, 64, 129, 0.35); }
        .data-lamp-title { color: #ffea00; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #ff4081; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #ad1457; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #6a0036; color: #ffea00; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #160612; }
        table.data-lamp td.hit-spins { color: #ffea00; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff80ab; font-weight: bold; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>
<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffea00;">eアサルトリリィ (1/164.4)</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class AssaultLily {
            constructor() {
                this.state = "NORMAL"; // NORMAL, RUSH
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
                this.activeSkill = null; // null, "CHARISMA", "KAMISHUKU", "ANGEL"
            }

            // BONUS消化中のスキル獲得抽選 (合計36.7%で継続率約80%に調整)
            rollSkill() {
                const r = Math.random();
                if (r < 0.184) {
                    this.activeSkill = "CHARISMA";
                    addLog(`💜 【スキル獲得：カリスマ】次回閃撃ジャッジ成功濃厚！！`, "color-skill-charisma");
                } else if (r < 0.312) {
                    this.activeSkill = "KAMISHUKU";
                    addLog(`🩵 【スキル獲得：神宿】BONUS後にいきなり神宿ジャッジ発生！！`, "color-skill-kamishuku");
                } else if (r < 0.367) {
                    this.activeSkill = "ANGEL";
                    addLog(`💛⚡ 【スキル獲得：守護天使】カリスマ＋神宿発動＝連チャン濃厚！！`, "color-skill-angel");
                } else {
                    this.activeSkill = null;
                }
            }

            // RUSH中大当り振り分け (大当り90.1%を100%に正規化: 1500=49.94%, 3000=39.62%, 4500=10.43%)
            awardRushBonus() {
                this.session_rush_count += 1;
                const r = Math.random();
                if (r < 0.1043) {
                    this.session_payout += 4500;
                    addLog(`🌈 亜羅椰暴飲暴食BONUS 4500！！ (10R×3回・4500玉)`, "color-hit");
                } else if (r < 0.5005) {
                    this.session_payout += 3000;
                    addLog(`🔥 百合の閃撃BONUS 3000！！ (10R×2回・3000玉)`, "color-hit");
                } else {
                    this.session_payout += 1500;
                    addLog(`▶ 百合の閃撃BONUS！ (10R・1500玉)`, "color-hit");
                }
                this.rollSkill();
                addLog(`💰 累積出玉: ${this.session_payout.toLocaleString()} 玉`);
                updateUI();
            }

            // 閃撃ジャッジ / 神宿ジャッジ判定
            async resolveJudge(isGuaranteed, judgeName) {
                addLog(`⚡ 【${judgeName}】発生！！ (電チュー・当該+保留2個)`, "color-judge");
                await sleep(1000);

                if (isGuaranteed || Math.random() < 0.83) {
                    addLog(`🎉 ジャッジ成功！！ 大当り獲得！！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                    this.awardRushBonus();
                    await sleep(1000);
                    return "HIT";
                } else {
                    // 失敗時17%のうち、約53.65%がSTリセット (全体で9.12% -> 継続時割合9.9%に一致)
                    if (Math.random() < 0.5365) {
                        addLog(`🟢 ジャッジ失敗... からの【ST回転数リセット】！！ (出玉なし・ST100回転再セット)`, "color-reset");
                        await sleep(1000);
                        return "RESET";
                    } else {
                        addLog(`💨 ジャッジ失敗... ハズレ`, "color-fall");
                        return "MISS";
                    }
                }
            }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉数: ${this.session_spins}`, "color-normal");

                // 通常時図柄揃い 1/164.4 (2R 約300個)
                if (Math.random() < 1 / 164.4) {
                    this.session_rush_count = 1;
                    this.session_payout += 300;
                    this.activeSkill = null;

                    if (Math.random() < 0.253) {
                        addLog(`\n[${this.session_spins} 回轉] 🌈 3or7図柄揃い / 演出成功！ ASSAULT BONUS！！ (300玉)`, "color-hit");
                        this.state = "RUSH";
                        addLog("🌸 ASSAULT RUSH (ST100回転・LT発動) 突入！！", "color-rush");
                        updateUI(); await sleep(1000);
                        await this.play_rush();
                    } else {
                        addLog(`\n[${this.session_spins} 回轉] 🎯 百合ヶ丘女学院BONUS... (2R・300玉)`, "color-hit");
                        addLog("💀 演出失敗... 通常へ戻る", "color-fall");
                        updateUI(); this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_rush() {
                while (this.state === "RUSH") {
                    const skillLabel = this.activeSkill === "CHARISMA" ? " [💜カリスマ発動中]"
                                     : this.activeSkill === "KAMISHUKU" ? " [🩵神宿発動]"
                                     : this.activeSkill === "ANGEL" ? " [💛守護天使発動]"
                                     : "";
                    addLog(`\n===== 🌸 ASSAULT RUSH (ST100回転)${skillLabel} =====`, "color-rush");
                    updateUI();

                    // 1. 神宿 or 守護天使スキル所持時：大当り後にいきなり神宿ジャッジ発生！
                    if (this.activeSkill === "KAMISHUKU" || this.activeSkill === "ANGEL") {
                        const guaranteed = (this.activeSkill === "ANGEL");
                        this.activeSkill = null; // 消費スキル
                        document.getElementById("ui-spins").innerText = `神宿ジャッジ`;
                        const res = await this.resolveJudge(guaranteed, "神宿ジャッジ");
                        if (res === "HIT" || res === "RESET") {
                            continue; // 次セットへ
                        }
                        addLog(`🔄 神宿ジャッジハズレ → 通常のST100回転へ移行！`, "color-normal");
                    }

                    // 2. 通常のST100回転 (リーチ確率 1/65.5)
                    let roundEnded = false;
                    for (let i = 1; i <= 100; i++) {
                        if (this.state === "NORMAL") return;
                        await sleep(45);
                        document.getElementById("ui-spins").innerText = `ST残り: ${100 - i}/100`;


                        if (Math.random() < 1 / 65.5) {
                            const hasCharisma = (this.activeSkill === "CHARISMA");
                            if (hasCharisma) this.activeSkill = null;
                            addLog(`\n🌸 [ST ${i}回転目] リーチ成立！`, "color-judge");
                            const res = await this.resolveJudge(hasCharisma, hasCharisma ? "閃撃ジャッジ(カリスマ濃厚)" : "閃撃ジャッジ");
                            if (res === "HIT" || res === "RESET") {
                                roundEnded = true;
                                break;
                            }
                        }
                    }

                    if (!roundEnded && this.state === "RUSH") {
                        document.getElementById("ui-spins").innerText = `終了`;
                        addLog(`\n💀 ST100回転スルー... ASSAULT RUSH終了`, "color-fall");
                        addLog(`📈 總連莊数: ${this.session_rush_count}連`);
                        addLog(`💰 最終出玉: ${this.session_payout.toLocaleString()} 玉`);
                        this.state = "NORMAL";
                        this.activeSkill = null;
                        this.record_history();
                        updateUI();
                    }
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.state = "NORMAL";
            }
        }

        let game = new AssaultLily();
        window.game = game;
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            addLog("\n=== eアサルトリリィ 稼働開始！ ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
