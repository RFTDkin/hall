<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】Pフィーバー機動戦士ガンダムユニコーン2 129Ver | パチンコシミュレーター</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #110000; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #ff1744; text-shadow: 0 0 15px rgba(255, 23, 68, 0.7); font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #220000; border: 2px solid #ff1744; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(255, 23, 68, 0.5); }
        .stat-item span { display: block; font-weight: bold; color: #ff5252; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #d50000 0%, #880000 100%); color: white; border: 1px solid #ff8a80; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #ff1744; }
        button:disabled { background: #3e0000; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #d50000; border-radius: 5px; height: 400px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-rush { color: #ff5252; font-weight: bold; text-shadow: 0 0 5px #ff5252; }
        .color-hit { color: #ff1744; font-weight: bold; text-shadow: 0 0 5px #ff1744; }
        .color-normal { color: #bdbdbd; }
        .color-lt { color: #e040fb; font-weight: 900; text-shadow: 0 0 15px #e040fb; font-size: 1.1em; }
        .color-ultimate { color: #ffea00; font-weight: 900; text-shadow: 0 0 15px #ffea00; font-size: 1.1em; }
        .color-fall { color: #757575; font-weight: bold; }
        .data-lamp-container { background-color: #220000; border: 3px solid #ff1744; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(255, 23, 68, 0.5); }
        .data-lamp-title { color: #ff5252; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #ff5252; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #880000; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #4a0000; color: #ffea00; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #330000; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff5252; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">Pフィーバー機動戦士ガンダムユニコーン2 129Ver</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉數</th><th>連莊數</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        class Unicorn2_129ver {
            constructor() { this.state = "NORMAL"; this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.history = []; this.rush_spins = 0; }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉數: ${this.session_spins}`, "color-normal");

                // 通常時大当り確率 1/129.8
                if (Math.random() < 1 / 129.8) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い當選！`, "color-hit");
                    let r = Math.random();

                    // ヘソ割合: 3R(約300個) + ST60回転 (約51%)
                    if (r < 0.51) {
                        this.session_payout += 300;
                        addLog("🔥 3R BONUS (300玉)", "color-rush");
                        addLog("⚡ 覚醒HYPER (ST60回) 突入！", "color-rush");
                        this.session_rush_count = 1;
                        updateUI(); await sleep(1000);
                        await this.play_rush("RUSH");
                    } 
                    // ヘソ割合: 3R(約300個) + 時短なし (約49%)
                    else {
                        this.session_payout += 300;
                        addLog("💥 3R BONUS (300玉)", "color-normal");
                        addLog("💀 演出失敗... 通常へ戻る", "color-normal");
                        updateUI(); this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_rush(mode) {
                this.state = mode;
                // LT時は超覚醒HYPER、通常STは覚醒HYPER
                addLog(`\n===== ${mode === "LT" ? "🌈 超覚醒HYPER" : "⚡ 覚醒HYPER"} =====`, mode === "LT" ? "color-lt" : "color-rush");
                
                let initial_rush_count = this.session_rush_count;
                updateUI();

                // 右打ち中実質確率 1/40.6
                let hitRate = 1 / 40.6;
                
                while (this.state === "RUSH" || this.state === "LT") {
                    let max_spins = this.state === "LT" ? 100 : 60;
                    let hit = false;
                    let modeName = this.state === "LT" ? "LT" : "ST";

                    // ST回転数 + 残保留4回を消化
                    for (this.rush_spins = 1; this.rush_spins <= max_spins + 4; this.rush_spins++) {
                        await sleep(45);
                        
                        let isReserve = this.rush_spins > max_spins;
                        let displaySpin = isReserve ? (this.rush_spins - max_spins) : this.rush_spins;
                        
                        // 🌟 修正：改成 ST 倒數顯示方式 (好似 SEED 咁)
                        if (!isReserve) {
                            let remaining = max_spins - this.rush_spins;
                            document.getElementById("ui-spins").innerText = `${modeName}残り: ${remaining}/${max_spins}`;
                        } else {
                            let res_remaining = 4 - displaySpin;
                            document.getElementById("ui-spins").innerText = `残保留: ${res_remaining}/4`;
                        }

                        // 🎯 ST中大当り抽選
                        if (Math.random() < hitRate) {
                            hit = true;
                            this.session_rush_count += 1;
                            let prefix = isReserve ? "残保留" : modeName;
                            addLog(`\n🎉 [${prefix} ${displaySpin}回転目] 當選！ (總 ${this.session_rush_count}連)`, "color-hit");

                            // 覚醒HYPER (ST60) 中の大当り振り分け
                            if (this.state === "RUSH") {
                                let right_r = Math.random();
                                // 4%で7R×2回 (1400個) + 超覚醒HYPER (LT) 突入
                                if (right_r < 0.04) {
                                    this.session_payout += 1400;
                                    addLog(`👑 7R×2回 BONUS！ 1400玉獲得！`, "color-ultimate");
                                    addLog(`🌈 バンシィ登場！ 超覚醒HYPER(ラッキートリガー) 発動！！`, "color-lt");
                                    this.state = "LT";
                                } 
                                // 96%で7R (700個) + 覚醒HYPER 継続
                                else {
                                    this.session_payout += 700;
                                    addLog(`💥 7R BONUS！ 700玉獲得！`, "color-hit");
                                }
                            } 
                            // 超覚醒HYPER (LT/ST100) 中の大当り振り分け
                            else if (this.state === "LT") {
                                // 100%で7R (700個) + 超覚醒HYPER 継続
                                this.session_payout += 700;
                                addLog(`💥 7R BONUS！ 700玉獲得！`, "color-lt");
                            }
                            
                            addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            updateUI(); await sleep(800);
                            break; // 擊中後跳出 for loop，進入下一次 while 循環 (ST重置)
                        }
                    }

                    // 💀 ST + 殘保留 消化完畢無中獎 (駆け抜け)
                    if (!hit) {
                        document.getElementById("ui-spins").innerText = `終了`;
                        let endMsg = (this.session_rush_count === initial_rush_count) ? `\n💀 ${modeName}終了 (駆け抜け)` : `\n💀 ${modeName}終了`;
                        addLog(endMsg, "color-fall");
                        addLog(`📈 總連莊數: ${this.session_rush_count}連 (含初當)`);
                        addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                        this.state = "NORMAL"; 
                        this.record_history(); 
                        updateUI();
                        break;
                    }
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0;
            }
        }

        let game = new Unicorn2_129ver();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            addLog("\n=== ユニコォォォォン！！ (129Ver) ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
    <div style="position: fixed; bottom: 0; left: 0; width: 100%; background-color: rgba(0,0,0,0.8); z-index: 9999; text-align: center; padding: 5px 0; border-top: 1px solid #333;">
        <script type="text/javascript">atOptions = { 'key' : 'ead8f1e5fdd30faaed33da77b3333cf4', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/ead8f1e5fdd30faaed33da77b3333cf4/invoke.js"></script>
    </div>
</body>
</html>
