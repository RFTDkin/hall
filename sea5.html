<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】PA大海物語5アグネス | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #001f3f;
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #00bcd4;
            text-shadow: 0 0 15px rgba(0, 188, 212, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #001122;
            border: 2px solid #00bcd4;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(0, 188, 212, 0.3);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffeb3b;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #00838f;
            color: white;
            border: 1px solid #00bcd4;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            background-color: #0097a7;
            transform: scale(1.05);
            box-shadow: 0 0 10px #00bcd4;
        }

        button:disabled {
            background-color: #263238;
            border-color: #444;
            color: #777;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #006064;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #00bcd4; font-weight: bold; text-shadow: 0 0 5px #00bcd4; }
        .color-hit { color: #ff4081; font-weight: bold; text-shadow: 0 0 5px #ff4081; }
        .color-st { color: #ffeb3b; font-weight: bold; text-shadow: 0 0 5px #ffeb3b; }
        .color-normal { color: #9e9e9e; }
        .color-ultimate { color: #e040fb; font-weight: bold; text-shadow: 0 0 10px #e040fb; font-size: 1.1em; }
        .color-fall { color: #757575; font-weight: bold; }

        .data-lamp-container {
            background-color: #000a12;
            border: 3px solid #00838f;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 131, 143, 0.4);
        }

        .data-lamp-title {
            color: #00bcd4;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #00bcd4;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th, table.data-lamp td {
            border: 1px solid #00838f;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th { background-color: #004d40; color: #ffeb3b; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #001829; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff4081; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">PA大海物語5 Withアグネス・ラム</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class Sea5 {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
                this.low_prob_spins = 0; 
                this.yutime_available = true;
            }

            async play_normal() {
                this.session_spins += 1;
                this.low_prob_spins += 1;

                if (this.session_spins % 100 === 0) {
                    let yutime_left = Math.max(0, 299 - this.low_prob_spins);
                    addLog(`現在回轉数: ${this.session_spins} (遊タイムまで残り ${yutime_left}回)`, "color-normal");
                }

                if (Math.random() < (1 / 99.9)) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 大当り當選！`, "color-hit");
                    this.session_rush_count = 0;
                    await this.process_hit(false);
                    return true;
                }

                if (this.low_prob_spins === 299 && this.yutime_available) {
                    addLog(`\n🌀 低確率 299回転 到達！ アグネス遊タイム突入！`, "color-ultimate");
                    updateUI();
                    await sleep(1500);
                    await this.play_yutime();
                    return true; 
                }

                return false;
            }

            async process_hit(was_happiness) {
                this.session_rush_count += 1;
                let r = Math.random();
                let payout = 0, next_jitan = 0, is_happiness = false;
                
                if (was_happiness) {
                    if (r < 0.04) { payout = 1080; next_jitan = 110; is_happiness = true; addLog("👑 10R 確変 (1080玉) ハピネス継続!", "color-ultimate"); }
                    else if (r < 0.64) { payout = 648; next_jitan = 110; is_happiness = true; addLog("🐬 6R 確変 (648玉) ハピネス継続!", "color-ultimate"); }
                    else { payout = 432; next_jitan = 110; is_happiness = true; addLog("🐠 4R 確変 (432玉) ハピネス継続!", "color-ultimate"); }
                } else {
                    if (r < 0.04) { payout = 1080; next_jitan = 110; is_happiness = true; addLog("🌈 10R 確変 (1080玉) ハピネスチャンス突入!!", "color-ultimate"); }
                    else if (r < 0.64) { payout = 648; next_jitan = 40; addLog("🐬 6R 確変 (648玉) チャンスタイム (ST10+40回)", "color-rush"); }
                    else if (r < 0.70) { payout = 432; next_jitan = 40; addLog("🐠 4R 確変 (432玉) チャンスタイム (ST10+40回)", "color-rush"); }
                    else { payout = 432; next_jitan = 15; addLog("🐠 4R 確変 (432玉) チャンスタイム (ST10+15回)", "color-normal"); }
                }
                
                this.session_payout += payout;
                this.low_prob_spins = 0;
                this.yutime_available = true;
                updateUI();
                await sleep(1000);
                
                await this.play_st(next_jitan, is_happiness);
            }

            async play_st(next_jitan, is_happiness) {
                addLog(`\n===== 🌊 ST (10回転) =====`, "color-st");
                this.state = "ST";
                
                for (let i = 1; i <= 10; i++) {
                    await sleep(200); 
                    document.getElementById("ui-spins").innerText = `ST中: ${i}/10`;
                    
                    if (Math.random() < (1 / 19.5)) {
                        addLog(`\n🎉 [ST ${i}回転目] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                        await this.process_hit(is_happiness);
                        return;
                    }
                }
                
                if (next_jitan > 0) {
                    await this.play_jitan(next_jitan, is_happiness);
                } else {
                    this.end_rush();
                }
            }

            async play_jitan(jitan_max, is_happiness) {
                let zoneName = is_happiness ? "ハピネスチャンス" : "チャンスタイム";
                let colorClass = is_happiness ? "color-ultimate" : "color-rush";
                
                addLog(`\n===== 🐬 ${zoneName} (${jitan_max}回転) =====`, colorClass);
                this.state = "JITAN";
                
                for (let i = 1; i <= jitan_max; i++) {
                    await sleep(80);
                    this.low_prob_spins++;
                    document.getElementById("ui-spins").innerText = `${zoneName}: ${i}/${jitan_max}`;
                    
                    if (Math.random() < (1 / 99.9)) {
                        addLog(`\n🎉 [時短 ${i}回転目] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                        await this.process_hit(is_happiness);
                        return;
                    }
                }
                
                this.end_rush();
            }

            async play_yutime() {
                addLog(`\n===== 🌀 アグネス遊タイム (379回転) =====`, "color-ultimate");
                this.state = "YUTIME";
                this.yutime_available = false;
                
                for (let i = 1; i <= 379; i++) {
                    if (i % 10 === 0) await sleep(10); 
                    this.low_prob_spins++;
                    document.getElementById("ui-spins").innerText = `遊タイム: ${i}/379`;
                    
                    if (Math.random() < (1 / 99.9)) {
                        addLog(`\n🎉 [遊タイム ${i}回転目] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");
                        await this.process_hit(false);
                        return;
                    }
                }
                
                addLog(`\n💀 遊タイム スルー...`, "color-fall");
                this.state = "NORMAL";
                updateUI();
            }

            end_rush() {
                addLog(`📈 總連莊数: ${this.session_rush_count}連`);
                addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0;
            }
        }

        let game = new Sea5();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== いつもの海へ ===", "color-hit");

            while (isPlaying) {
                let hitOrYutime = await game.play_normal();
                updateUI();
                if (game.session_spins % 100 === 0) await sleep(10);
                if (hitOrYutime) { isPlaying = false; break; }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>

    </div>
</body>

</html>
