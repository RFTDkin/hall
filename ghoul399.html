<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】P 東京喰種 399ver | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0000;
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff1744;
            text-shadow: 0 0 15px rgba(255, 23, 68, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel {
            flex: 1;
            min-width: 320px;
            max-width: 500px;
        }

        .right-panel {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
        }

        .stats-board {
            background-color: #1a0000;
            border: 2px solid #ff1744;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(255, 23, 68, 0.3);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffca28;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #b71c1c;
            color: white;
            border: 1px solid #ff1744;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            background-color: #d50000;
            transform: scale(1.05);
            box-shadow: 0 0 10px #ff1744;
        }

        button:disabled {
            background-color: #3e2723;
            border-color: #444;
            color: #777;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        #btn-reset {
            background-color: #424242;
            border-color: #616161;
        }

        #btn-reset:hover {
            background-color: #212121;
            box-shadow: 0 0 10px #616161;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #b71c1c;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry {
            margin: 5px 0;
        }

        .color-rush {
            color: #ffeb3b;
            font-weight: bold;
            text-shadow: 0 0 5px #ffeb3b;
        }

        .color-hit {
            color: #ff5252;
            font-weight: bold;
            text-shadow: 0 0 5px #ff5252;
        }

        .color-normal {
            color: #9e9e9e;
        }

        .color-ultimate {
            color: #d50000;
            font-weight: bold;
            text-shadow: 0 0 10px #d50000;
            font-size: 1.1em;
        }

        .color-charge {
            color: #9c27b0;
            font-weight: bold;
        }

        .color-fall {
            color: #757575;
            font-weight: bold;
        }

        .color-music {
            color: #00e676;
            font-style: italic;
        }

        .data-lamp-container {
            background-color: #110000;
            border: 3px solid #b71c1c;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(213, 0, 0, 0.4);
        }

        .data-lamp-title {
            color: #ff1744;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ff1744;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th,
        table.data-lamp td {
            border: 1px solid #b71c1c;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th {
            background-color: #3e2723;
            color: #ff8a80;
            font-size: 0.9em;
        }

        table.data-lamp tr:nth-child(even) {
            background-color: #210000;
        }

        table.data-lamp td.hit-spins {
            color: #ffeb3b;
            font-weight: bold;
        }

        table.data-lamp td.hit-rush {
            color: #00e676;
            font-weight: bold;
        }

        table.data-lamp td.hit-payout {
            color: #ff5252;
        }

        .empty-row {
            color: #444 !important;
        }

        /* 🌟 ブラックアウト演出 (喰種チャージ昇格用 - 究極進化版) 🌟 */
        .blackout-overlay {
            position: fixed; inset: 0; z-index: 20000; display: flex; align-items: center; justify-content: center; pointer-events: none; 
            background: #000; /* 底色純黑 */
            opacity: 0; visibility: hidden;
        }
        
        /* 🌟 開頭嘅白底 + 藍金十字撕裂光 🌟 */
        .blackout-overlay::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            /* 利用多重 radial-gradient 疊加出十字撕裂形狀 */
            background: 
                /* 橫向長條裂縫 (左右極長，上下極幼) */
                radial-gradient(ellipse 150% 6% at center, #000000 5%, #0011ff 12%, #ffd700 22%, #00aaff 40%, transparent 60%),
                /* 縱向短條裂縫 (上下稍長，左右極幼) */
                radial-gradient(ellipse 8% 55% at center, #000000 5%, #0011ff 15%, #ffd700 25%, #00aaff 45%, transparent 65%),
                /* 底色純白閃光 */
                #ffffff;
            opacity: 0;
            /* 加強對比度，令邊緣顏色變得銳利，產生「撕裂」嘅錯覺 */
            filter: contrast(1.5);
        }

        .blackout-overlay.is-active { visibility: visible; animation: blackout-bg 6s forwards; }
        .blackout-overlay.is-active::before { animation: blackout-flash 6s forwards; }
        .blackout-overlay.is-active .blackout-message { animation: blackout-text 6s forwards; }

        .blackout-message { display: flex; flex-direction: column; align-items: center; gap: 0.2em; font-family: "Arial Black", Impact, sans-serif; font-size: clamp(1.5rem, 5vw, 4rem); line-height: 1.2; letter-spacing: 0.04em; text-align: center; transform: scale(0.8); opacity: 0; }
        .blackout-rainbow {
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00e5ff, #c500ff, #ff0000);
            background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: blackout-rainbow 2s linear infinite; filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.75)); font-weight: 900;
        }

        @keyframes blackout-rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        
        /* 整體黑幕維持時間 (總長 6秒) */
        @keyframes blackout-bg { 
            0% { opacity: 0; } 
            2%, 85% { opacity: 1; } 
            100% { opacity: 0; visibility: hidden; } 
        }
        
        /* 白藍閃光動畫 (瞬間爆發然後 0.6秒內消失變黑) */
        @keyframes blackout-flash {
            0% { opacity: 0; transform: scale(0.2) scaleY(0.05); filter: brightness(2); }
            2% { opacity: 1; transform: scale(1) scaleY(1); filter: brightness(2); }
            10% { opacity: 0; transform: scale(1.5) scaleY(2); filter: brightness(1); }
            100% { opacity: 0; }
        }

        /* 延遲彩色文字 (頭 2秒完全隱藏，製造死寂黑幕) */
        @keyframes blackout-text { 
            0%, 33% { opacity: 0; transform: scale(1.35); } /* 33% 大約係 2秒 */
            40%, 80% { opacity: 1; transform: scale(1); } 
            100% { opacity: 0; transform: scale(0.96); } 
        }
    </style>

<body>

    <!-- 🌟 ブラックアウト演出用 HTML 🌟 -->
    <div id="blackout-overlay" class="blackout-overlay" aria-hidden="true">
        <div class="blackout-message">
            <div class="blackout-rainbow" style="font-size: 0.6em;">ハハハハ！</div>
            <div class="blackout-rainbow" style="font-size: 0.8em;">素敵よその表情！</div>
            <div class="blackout-rainbow" style="font-size: 0.7em;">喰種チャージ昇格で<br>RUSH突入！</div>
        </div>
    </div>

    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.5em; color: #ffffff;">P 東京喰種 399ver</span></h1>

    <video id="rush-media" src="https://files.catbox.moe/t3rubq.mp4" style="display:none;" preload="auto" playsinline
        webkit-playsinline></video>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊戲開始</button>
                
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="4" class="empty-row">- 無紀錄 -</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const rushMedia = document.getElementById("rush-media");
        function playBlackout演出() {
            // 🌟 播放增強版「ドン！」重低音音效
            try {
                if (window.audioCtx) {
                    // 確保被休眠嘅音頻系統被喚醒
                    if (window.audioCtx.state === 'suspended') window.audioCtx.resume();

                    const ctx = window.audioCtx;
                    const osc1 = ctx.createOscillator(); // 負責極低頻下潛
                    const osc2 = ctx.createOscillator(); // 負責「敲擊」嘅顆粒感
                    const filter = ctx.createBiquadFilter();
                    const gainNode = ctx.createGain();

                    // 第一層：深沉嘅 Sub-bass
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(200, ctx.currentTime);
                    osc1.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);

                    // 第二層：帶有機械感嘅打擊聲
                    osc2.type = 'square';
                    osc2.frequency.setValueAtTime(150, ctx.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.2);

                    // 低通濾波器：令方波唔會太刺耳，只保留悶響
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4);

                    // 音量爆發與衰減
                    gainNode.gain.setValueAtTime(0.001, ctx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(1.0, ctx.currentTime + 0.05);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);

                    // 連接線路
                    osc1.connect(gainNode);
                    osc2.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(ctx.destination);

                    // 同步發聲
                    osc1.start(ctx.currentTime);
                    osc2.start(ctx.currentTime);
                    osc1.stop(ctx.currentTime + 1.2);
                    osc2.stop(ctx.currentTime + 1.2);
                }
            } catch (e) {
                console.log("Audio play blocked", e);
            }

            // 畫面黑幕與彩色字動畫
            const overlay = document.getElementById("blackout-overlay");
            if (!overlay) return sleep(6000);
            overlay.classList.remove("is-active");
            void overlay.offsetWidth;
            overlay.classList.add("is-active");
            return sleep(6000).then(() => {
                overlay.classList.remove("is-active");
            });
        }
        let audioUnlocked = false;

        // RUSH中獎時彈出影片
        function playVideoPopupAndWait(mediaElement) {
            return new Promise((resolve) => {
                if (!mediaElement) return resolve();

                let isResolved = false;
                const finish = () => {
                    if (isResolved) return;
                    isResolved = true;
                    mediaElement.removeEventListener('ended', finish);
                    mediaElement.removeEventListener('error', finish);
                    mediaElement.style.display = "none";
                    resolve();
                };

                mediaElement.style.display = "block";
                mediaElement.style.position = "fixed";
                mediaElement.style.top = "50%";
                mediaElement.style.left = "50%";
                mediaElement.style.transform = "translate(-50%, -50%)";
                mediaElement.style.zIndex = "10000";
                mediaElement.style.width = "90vw";
                mediaElement.style.maxWidth = "900px";
                mediaElement.style.height = "auto";
                // 🌟 神奇裁切魔法：對齊最頂，淨係切走下面條黑邊！ 🌟
                // 數字越細 (例如 8.4)，下面裁走越多；數字越大 (例如 8.8)，裁走越少。
                mediaElement.style.aspectRatio = "16 / 22";
                mediaElement.style.objectFit = "cover";
                mediaElement.style.objectPosition = "top center"; // 👈 將畫面頂住最上，黑邊就會被推出去下面裁走！
                mediaElement.style.backgroundColor = "transparent";
                mediaElement.style.border = "4px solid #d50000"; // 喰種紅色框
                mediaElement.style.boxShadow = "0 0 40px rgba(213, 0, 0, 0.8)";
                mediaElement.style.backgroundColor = "#000";
                mediaElement.style.borderRadius = "10px";

                mediaElement.currentTime = 0;
                mediaElement.addEventListener('ended', finish);
                mediaElement.addEventListener('error', finish);

                mediaElement.play().catch(e => {
                    console.log("自動播放被阻擋或出錯", e);
                    finish();
                });

                // 防卡死：10秒超時強制收埋影片繼續
                setTimeout(finish, 60000);
            });
        }

        class Ghoul399 {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 🌟 完美單次抽獎：確保每轉只抽一次亂數 🌟
                let roll = Math.random();

                // 🎯 路線 1: 図柄揃い (1/399.9)
                if (roll < (1 / 399.9)) {
                    addLog(`\n[${this.session_spins} 回轉] 🩸 図柄揃い大当り！`, "color-hit");
                    await this.normal_result(true); // 傳入 true 代表係図柄揃い
                    return true;
                }
                // ⚡ 路線 2: 喰種チャージ (另外一個 1/399.9，機率疊加上去變成 2/399.9)
                else if (roll < (2 / 399.9)) {
                    addLog(`\n[${this.session_spins} 回轉] 喰種チャージ當選！`, "color-charge");
                    await this.normal_result(false); // 傳入 false 代表係チャージ
                    return true;
                }

                return false;
            }

            async normal_result(isZuegara) {
                let r = Math.random();
                let enterRush = false;

                if (isZuegara) {
                    // 🩸 路線 1 (図柄揃い): 50% 突入 1500玉 / 50% 通常 1500玉
                    this.session_payout += 1500;
                    if (r < 0.50) {
                        enterRush = true;
                        addLog("🌈 10R 1500玉獲得！ RUSH突入！", "color-ultimate");
                    } else {
                        addLog("😭 10R 1500玉獲得 (通常終了)", "color-normal");
                    }
                } else {
                    // ⚡ 路線 2 (喰種チャージ): 1% 昇格 300玉 / 99% 通常 300玉
                    this.session_payout += 300;
                    if (r < 0.01) {
                        enterRush = true;
                        addLog(`ドン！！！`, "color-normal"); // 👈 加入 log
                        await sleep(2000); // 👈 等 2 秒先播黑畫面
                        await playBlackout演出(); // 👈 觸發黑畫面
                        addLog("🎯 ハハハハ！！！素敵よその表情！ 喰種チャージ昇格でRUSH突入！", "color-rush");
                    } else {
                        addLog("💥 2R 300玉獲得 (通常終了)", "color-normal");
                    }
                }

                addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                updateUI();

                if (enterRush) {
                    await sleep(1000);
                    await this.play_rush();
                } else {
                    this.record_history();
                }
            }

            async play_rush() {
                addLog(`\n===== 🩸 RUSH (ST130回) 開始 =====`, "color-ultimate");
                this.state = "RUSH";
                let st_max = 130;
                let current_st = st_max;
                updateUI();

                while (this.state === "RUSH" && current_st > 0) {
                    await sleep(40);
                    let current_spin = st_max - current_st + 1;

                    document.getElementById("ui-spins").innerText = `RUSH中: ${current_spin}/${st_max}`;

                    // RUSH中 大当り確率: 1/95.3
                    if (Math.random() < (1 / 95.3)) {
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [ST ${current_spin}回転] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");

                        // 🌟 先判定出玉數量，決定播邊條影片 🌟
                        let payout = (Math.random() < 0.03) ? 6000 : 3000;
                        let videoSrc = (payout === 6000) ? "https://files.catbox.moe/4tpc40.mp4" : "https://files.catbox.moe/t3rubq.mp4";

                        rushMedia.src = videoSrc; // 動態切換影片
                        rushMedia.load();
                        addLog(`🎵 播放專屬動畫 (${videoSrc}) 中... 請稍候`, "color-music");
                        await playVideoPopupAndWait(rushMedia);

                        this.session_payout += payout;

                        if (payout === 6000) {
                            addLog(`🔥 超絶爆発！ 6000玉獲得！`, "color-ultimate");
                        } else {
                            addLog(`💥 3000玉獲得！`, "color-hit");
                        }

                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        addLog("🩸 RUSH 継続!!", "color-rush");

                        current_st = st_max; // ST 回復
                        updateUI();
                        await sleep(800);
                    } else {
                        current_st--;
                    }
                }

                if (current_st === 0) {
                    document.getElementById("ui-spins").innerText = `RUSH中: ${st_max}/${st_max}`;
                    addLog("\n💀 ST抜け... RUSH終了", "color-fall");
                    this.end_rush();
                }
            }

            end_rush() {
                addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new Ghoul399();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const btnReset = document.getElementById("btn-reset");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            if(btnReset) btnReset.disabled = true;

            // 👇 替換呢段 audioUnlocked 嘅邏輯 👇
            if (!audioUnlocked) {
                rushMedia.load();
                
                // 🌟 玩家撳掣嗰一刻，即刻解鎖 AudioContext
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    window.audioCtx = new AudioContextClass();
                    if (window.audioCtx.state === 'suspended') {
                        window.audioCtx.resume();
                    }
                }
                audioUnlocked = true;
            }
            // 👆 替換完畢 👆

            addLog("\n=== ゲーム開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0) {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            if(btnReset) btnReset.disabled = false;
            btnPlay.innerText = "▶️ 繼續抽機";
        }

        function resetGame() {
            game = new Ghoul399();
            logBox.innerHTML = "";
            renderHistoryTable([]);
            updateUI();

            rushMedia.pause();
            rushMedia.currentTime = 0;
            rushMedia.style.display = "none";

            addLog("遊戲紀錄已重置。", "color-normal");
            btnPlay.innerText = "▶️ 遊戲開始";
        }
    </script>
