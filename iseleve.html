<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eいせれべFSZ | パチンコシミュレーター</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #050011; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #b388ff; text-shadow: 0 0 15px rgba(179, 136, 255, 0.7); font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        
        .stats-board { background-color: #110022; border: 2px solid #7c4dff; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(124, 77, 255, 0.4); }
        .stat-item span { display: block; font-weight: bold; color: #00e5ff; font-size: 1.3em; margin-top: 5px; }
        
        button { background: linear-gradient(180deg, #6200ea 0%, #311b92 100%); color: white; border: 1px solid #b388ff; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #b388ff; }
        button:disabled { background: #1a0033; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        
        .log-container { background-color: #000000; border: 1px solid #4a148c; border-radius: 5px; height: 400px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        
        .color-rush { color: #b388ff; font-weight: bold; text-shadow: 0 0 5px #b388ff; }
        .color-hit { color: #ff4081; font-weight: bold; text-shadow: 0 0 5px #ff4081; }
        .color-normal { color: #bdbdbd; }
        .color-ultimate { color: #00e5ff; font-weight: 900; text-shadow: 0 0 15px #00e5ff; font-size: 1.1em; }
        .color-fall { color: #757575; font-weight: bold; }
        
        .data-lamp-container { background-color: #0a0014; border: 3px solid #6200ea; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(98, 0, 234, 0.4); }
        .data-lamp-title { color: #00e5ff; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #00e5ff; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #4a148c; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #311b92; color: #00e5ff; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #1a0033; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff4081; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">e異世界でチート能力を手にした俺は、現実世界をも無双する</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 無双開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class Iseleve {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉数: ${this.session_spins}`, "color-normal");

                // 通常時確率: 1/179
                if (Math.random() < (1 / 179.0)) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 大当り當選！`, "color-hit");
                    let r = Math.random();

                    if (r < 0.002) {
                        // 0.2%: 1500玉 + RUSH + 1G連濃厚
                        this.session_payout += 1500;
                        this.session_rush_count = 1;
                        addLog("🌈 全回転BONUS (1500玉)！！", "color-ultimate");
                        addLog("✨ ST直行 ＆ 1G連濃厚！", "color-ultimate");
                        updateUI(); await sleep(1000);
                        
                        // 先執行必定發生嘅 1G連
                        await this.play_1g_loop(true);
                        // 再進入 RUSH (因為 Hezo 中已經 1G 過，入到 ST 嘅第一轉算唔算初回濃厚？設定為係，因為 ST 內大當先算「RUSH中の大当り」)
                        await this.play_rush(true);
                    } else if (r < 0.200) {
                        // 19.8%: 300玉 + RUSH
                        this.session_payout += 300;
                        this.session_rush_count = 1;
                        addLog("🔥 SUPER いせれべ BONUS (300玉)", "color-rush");
                        addLog("⚡ RUSH (ST70回) 突入！", "color-rush");
                        updateUI(); await sleep(1000);
                        
                        await this.play_rush(true); // 帶住「初回濃厚」Flag 入 RUSH
                    } else {
                        // 80%: 300玉 + 通常
                        this.session_payout += 300;
                        addLog("😭 いせれべ BONUS (300玉)", "color-normal");
                        addLog("💀 RUSH非突入... 通常へ戻る", "color-fall");
                        updateUI(); this.record_history();
                    }
                    return true;
                }
                return false;
            }

            get_right_payout() {
                let r = Math.random();
                if (r < 0.01) return { p: 4500, name: "🌈 4050~4500玉" };
                if (r < 0.06) return { p: 3300, name: "👑 3000~3750玉" };
                if (r < 0.39) return { p: 2550, name: "🔥 2250~2850玉" };
                if (r < 0.67) return { p: 1800, name: "💥 1650~1800玉" };
                if (r < 0.87) return { p: 1050, name: "✨ 1050玉" };
                return { p: 450, name: "🐠 450玉" };
            }

            async play_1g_loop(is_guaranteed) {
                let loop = is_guaranteed || (Math.random() < 0.59);
                let first_loop = true;

                while (loop) {
                    await sleep(800);
                    this.session_rush_count++;
                    let reward = this.get_right_payout();
                    this.session_payout += reward.p;

                    if (is_guaranteed && first_loop) {
                        addLog(`🌟 1G連 発動！ (濃厚分) ${reward.name} 獲得！ (總 ${this.session_rush_count}連)`, "color-ultimate");
                    } else {
                        addLog(`⚡ 1G連 ループ継続！(59%) ${reward.name} 獲得！ (總 ${this.session_rush_count}連)`, "color-ultimate");
                    }
                    
                    updateUI();
                    first_loop = false;
                    loop = Math.random() < 0.59;
                }
                
                // 如果入咗呢個 Function 但冇中 59% (非濃厚情況)
                if (!is_guaranteed && first_loop) {
                    addLog(`💨 1G連 なし... STに戻ります`, "color-normal");
                } else {
                    addLog(`💨 1G連 ループ終了... STに戻ります`, "color-normal");
                }
                await sleep(500);
            }

            async play_rush(is_first_hit) {
                addLog(`\n===== ⚔️ RUSH (ST70回転) 開始 =====`, "color-rush");
                this.state = "RUSH";
                let st = 70;
                updateUI();

                while (this.state === "RUSH" && st > 0) {
                    await sleep(50);
                    document.getElementById("ui-spins").innerText = `RUSH中: ${71 - st}/70`;

                    // RUSH中確率: 1/77
                    if (Math.random() < (1 / 77.0)) {
                        this.session_rush_count += 1;
                        let reward = this.get_right_payout();
                        this.session_payout += reward.p;
                        
                        addLog(`\n🎉 [ST ${71 - st}回転目] BONUS當選！ ${reward.name} 獲得！`, "color-hit");
                        updateUI(); await sleep(500);

                        if (is_first_hit) {
                            addLog(`👑 RUSH初回大当り特典：1G連濃厚発動！！`, "color-ultimate");
                            await this.play_1g_loop(true);
                            is_first_hit = false;
                        } else {
                            addLog(`🎲 1G連 ループ(約59%) 抽選中...`, "color-normal");
                            await this.play_1g_loop(false);
                        }

                        // BONUS終了後、ST70回にリセット
                        st = 70; 
                        addLog(`\n🔄 RUSH 再セット (ST70回転)`, "color-rush");
                        updateUI(); await sleep(500);
                    } else {
                        st--;
                    }
                }

                if (st === 0) {
                    document.getElementById("ui-spins").innerText = `終了`;
                    addLog("\n💀 ST抜け... RUSH終了", "color-fall");
                    this.end_rush();
                }
            }

            end_rush() {
                addLog(`📈 總連莊数: ${this.session_rush_count}連`);
                addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                this.state = "NORMAL";
                this.record_history();
                updateUI();
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0;
            }
        }

        let game = new Iseleve();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;

            addLog("\n=== 現実世界をも無双する ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();
                if (game.session_spins % 100 === 0) await sleep(10);
                if (hit) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
    <div style="position: fixed; bottom: 0; left: 0; width: 100%; background-color: rgba(0,0,0,0.8); z-index: 9999; text-align: center; padding: 5px 0; border-top: 1px solid #333;">

        <script type="text/javascript" src="//www.highperformanceformat.com/ead8f1e5fdd30faaed33da77b3333cf4/invoke.js"></script>
    </div>
</body>

</html>
