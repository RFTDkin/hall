<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="machine-title" content="eフィーバーうたわれるもの">
    <title>【無料】eフィーバーうたわれるもの | パチンコシミュレーター</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #e0e0e0; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #ff9100; text-shadow: 0 0 15px rgba(255, 145, 0, 0.7); letter-spacing: 2px; font-weight: 900; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }
        .stats-board { background-color: #161b22; border: 2px solid #ff9100; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(255, 145, 0, 0.5); }
        .stat-item span { display: block; font-weight: bold; color: #4fc3f7; font-size: 1.3em; margin-top: 5px; }
        button { background-color: #e65100; color: white; border: 1px solid #ff9100; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: 0.2s; }
        button:hover { background-color: #ff9800; box-shadow: 0 0 10px #ff9100; }
        button:disabled { background-color: #1a2a3a; border-color: #444; color: #777; cursor: not-allowed; box-shadow: none; }
        
        .log-container { background-color: #000; border: 1px solid #ff9100; border-radius: 5px; height: 400px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-wou { color: #ff5252; font-weight: bold; text-shadow: 0 0 10px #ff5252; font-size: 1.1em; }
        .color-sword { color: #ff9100; font-weight: bold; text-shadow: 0 0 5px #ff9100; }
        .color-hit { color: #ffca28; font-weight: bold; }
        .color-normal { color: #9e9e9e; }
        .color-fall { color: #757575; font-weight: bold; }
        
        .data-lamp-container { background-color: #0d1117; border: 3px solid #ff9100; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(255, 145, 0, 0.4); }
        .data-lamp-title { color: #ff9100; margin-top: 0; margin-bottom: 15px; text-align: center; text-shadow: 0 0 5px #ff9100; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #e65100; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #161b22; color: #ff9100; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #10141a; }
        table.data-lamp td.hit-spins { color: #ffca28; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #ff5252; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #4fc3f7; font-weight: bold; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>
<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">eフィーバーうたわれるもの</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;"><button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button></div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" style="color: #555;">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        
        class UtawareMachine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins++;
                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉数: ${this.session_spins}`, "color-normal");
                }

                let roll = Math.random();
                let p_main = 1 / 399.7;       // 図柄揃い
                let p_charge = 1 / 264.696;   // うたわれチャージ

                // 🎯 1. 図柄揃い判定 (1/399.7)
                if (roll < p_main) {
                    let r = Math.random();
                    let enterRush = false;
                    
                    if (r < 0.01) {
                        addLog(`\n[${this.session_spins} 回轉] 🌈 全回転！超うたわれるものFEVER (10R×2)`, "color-wou");
                        this.session_payout += 3000;
                        enterRush = true;
                    } else if (r < 0.54) { // 1% + 53%
                        addLog(`\n[${this.session_spins} 回轉] 🎯 FEVER / 仮面の者BONUS (10R)`, "color-hit");
                        this.session_payout += 1500;
                        enterRush = true;
                    } else {
                        addLog(`\n[${this.session_spins} 回轉] 💧 FEVER (10R)... 通常へ`, "color-normal");
                        this.session_payout += 1500;
                    }

                    updateUI();
                    await sleep(1000);

                    if (enterRush) {
                        await this.play_rush();
                    } else {
                        addLog(`💰 本次總出玉: ${this.session_payout} 玉`);
                        this.record_history();
                    }
                    return true;
                }
                // ⚡ 2. チャージ判定 (1/264.696)
                else if (roll < p_main + p_charge) {
                    addLog(`\n[${this.session_spins} 回轉] ✨ うたわれチャージ (2R)`, "color-normal");
                    this.session_payout += 192;
                    let enterRush = false;
                    
                    if (Math.random() < 0.01) {
                        addLog(`🌈 チャージ昇格！ 仮面RUSH直行！`, "color-wou");
                        enterRush = true;
                    }

                    updateUI();
                    await sleep(1000);

                    if (enterRush) {
                        await this.play_rush();
                    } else {
                        addLog(`💰 本次總出玉: ${this.session_payout} 玉`);
                        this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_rush() {
                addLog(`\n===== 🔥 仮面RUSH (ST15回+残保4回) 開始 =====`, "color-sword");
                this.state = "RUSH";
                let st_remain = 19; 
                updateUI();

                while (this.state === "RUSH" && st_remain > 0) {
                    await sleep(400); // 1回転の緊張感を出すディレイ
                    
                    let isReserve = st_remain <= 4;
                    let current_spin = isReserve ? (4 - st_remain + 1) : (15 - (st_remain - 4) + 1);
                    
                    if (!isReserve) {
                        document.getElementById("ui-spins").innerText = `ST中: ${current_spin}/15`;
                    } else {
                        document.getElementById("ui-spins").innerText = `残保留: ${current_spin}/4`;
                        addLog(`⏳ 残保留 ${current_spin}回転目...`, "color-fall");
                    }

                    // 右打ち実質確率 1/13.4
                    if (Math.random() < (1 / 13.4)) {
                        this.session_rush_count++;
                        let phaseName = isReserve ? '残保留' : 'ST';
                        
                        addLog(`\n🎉 [${phaseName} ${current_spin}回転目] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");

                        let pr = Math.random();
                        if (pr < 0.80) { // 80% 3000玉
                            this.session_payout += 3000;
                            addLog("🎯 仮面の者3000BONUS (10R×2回)！ 3000玉獲得！", "color-wou");
                        } else { // 20% 出玉なしリセット
                            addLog("🔄 STリセット！ (出玉なし)", "color-normal");
                        }
                        
                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        addLog("⚡ 仮面RUSH 継続!!", "color-sword");
                        
                        st_remain = 19; // ST 15 + 残保留 4 回復
                        updateUI();
                        await sleep(800);
                    } else {
                        st_remain--;
                    }
                }

                if (st_remain === 0) {
                    document.getElementById("ui-spins").innerText = `終了`;
                    addLog("\n💀 決着... RUSH終了", "color-fall");
                    addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                    this.state = "NORMAL";
                    this.record_history();
                    updateUI();
                }
            }

            record_history() {
                this.history.unshift({ 
                    spins: this.session_spins, 
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1, 
                    payout: this.session_payout 
                });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; 
                this.session_payout = 0; 
                this.session_rush_count = 0;
            }
        }

        let game = new UtawareMachine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            const tbody = document.getElementById("history-tbody");
            tbody.innerHTML = "";
            if (historyData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color:#555;">- 無紀錄 -</td></tr>`;
                return;
            }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                tbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            addLog("\n=== 遊技開始 ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") {
                    await sleep(10);
                }
                if (hit) { isPlaying = false; break; }
            }
            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
