<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eグランベルム319 | パチンコシミュレーター</title>
    <meta name="machine-title" content="eグランベルム319">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0a1a; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #b388ff; text-shadow: 0 0 15px rgba(179, 136, 255, 0.8), 0 0 25px #ff9100; font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #1a1433; border: 2px solid #b388ff; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(179, 136, 255, 0.4); }
        .stat-item span { display: block; font-weight: bold; color: #ffea00; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #7c4dff 0%, #311b92 100%); color: white; border: 1px solid #ffea00; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #b388ff; }
        button:disabled { background: #261e47; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #b388ff; border-radius: 5px; height: 420px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-hit { color: #ff9100; font-weight: bold; text-shadow: 0 0 5px #ff9100; }
        .color-normal { color: #bdbdbd; }
        .color-fall { color: #757575; font-weight: bold; }
        .color-judge { color: #00e5ff; font-weight: bold; text-shadow: 0 0 5px #00e5ff; }
        .color-reset { color: #00e676; font-weight: bold; }
        .color-ura { color: #ff1744; font-weight: 900; text-shadow: 0 0 10px #ff1744, 0 0 20px #b388ff; }
        .color-boost { color: #ffea00; font-weight: 900; text-shadow: 0 0 12px #ff9100, 0 0 20px #ffea00; font-size: 1.06em; }
        .data-lamp-container { background-color: #1a1433; border: 3px solid #b388ff; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(179, 136, 255, 0.35); }
        .data-lamp-title { color: #ffea00; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #7c4dff; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #651fff; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #311b92; color: #ffea00; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #0d0a1a; }
        table.data-lamp td.hit-spins { color: #ffea00; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #b388ff; font-weight: bold; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>
<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffea00;">eグランベルム319 (1/319.6)</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class Granbelm319 {
            constructor() {
                this.state = "NORMAL"; // NORMAL, RUSH, URA_RUSH
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            // 🔥 超アドレナリンBOOST (3000BONUS以上で25%突入、以降25%で無限ループ)
            async runAdrenalineBoost(basePayout) {
                let totalBonus = basePayout;
                let loopCount = 0;
                let hasAlpha = true;

                addLog(`⚡⚡ 【超アドレナリンBOOST】発動！！ 出玉上乗せチャンス！！`, "color-boost");
                await sleep(600);

                while (hasAlpha && this.state !== "NORMAL") {
                    loopCount++;
                    const r = Math.random();
                    let addAmount = 1500;
                    // 上乗せ時割合: 1500(37.5%), 1500+α(12.5%), 3000(18.75%), 3000+α(6.25%), 4500(18.75%), 4500+α(6.25%)
                    if (r < 0.375) {
                        addAmount = 1500; hasAlpha = false;
                    } else if (r < 0.50) {
                        addAmount = 1500; hasAlpha = true;
                    } else if (r < 0.6875) {
                        addAmount = 3000; hasAlpha = false;
                    } else if (r < 0.75) {
                        addAmount = 3000; hasAlpha = true;
                    } else if (r < 0.9375) {
                        addAmount = 4500; hasAlpha = false;
                    } else {
                        addAmount = 4500; hasAlpha = true;
                    }

                    this.session_payout += addAmount;
                    totalBonus += addAmount;
                    const alphaTag = hasAlpha ? "＋α (継続濃厚!!)" : "";
                    addLog(`   💥 上乗せ ${loopCount}回目：+${addAmount}玉${alphaTag} (一撃計 ${totalBonus.toLocaleString()}玉)`, "color-boost");
                    updateUI();
                    await sleep(550);
                }

                addLog(`👑 BOOST決着！ 今回獲得合計：${totalBonus.toLocaleString()} 玉！！`, "color-boost");
            }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉数: ${this.session_spins}`, "color-normal");

                // 通常時大当り確率 1/319.6 (7R 約1050個)
                if (Math.random() < 1 / 319.6) {
                    this.session_rush_count = 1;
                    this.session_payout += 1050;

                    if (Math.random() < 0.505) {
                        addLog(`\n[${this.session_spins} 回轉] 🌈 BONUS！ (7R・1050玉) → 演出成功！！`, "color-hit");
                        this.state = "RUSH";
                        addLog("🚀 グランベルム RUSH (ST130回転・LT発動) 突入！！", "color-hit");
                        updateUI(); await sleep(1000);
                        await this.play_rush();
                    } else {
                        addLog(`\n[${this.session_spins} 回轉] 🎯 BONUS... (7R・1050玉)`, "color-hit");
                        addLog("💀 演出失敗... 通常へ戻る", "color-fall");
                        updateUI(); this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_rush() {
                while (this.state !== "NORMAL") {
                    const isUra = (this.state === "URA_RUSH");
                    const modeHeader = isUra
                        ? "🖤🔥 【裏RUSH (黒ロゴ)】ST130回転 (当たれば3000個以上濃厚!!)"
                        : "🌕 グランベルム RUSH (ST130回転・継続率約77%)";
                    addLog(`\n===== ${modeHeader} =====`, isUra ? "color-ura" : "color-hit");
                    updateUI();

                    let roundEnded = false;

                    for (let i = 1; i <= 130; i++) {
                        if (this.state === "NORMAL") return;
                        await sleep(40);
                        document.getElementById("ui-spins").innerText = `ST残り: ${130 - i}/130`;

                        // 右打ち中リーチ確率 1/62.0 -> ジャッジ発生
                        if (Math.random() < 1 / 62.0) {
                            addLog(`\n⚡ [ST ${i}回転目] リーチ成立！ ジャッジ発生！！`, "color-judge");
                            await sleep(450);

                            // 実質ジャッジ成功率 = 4/7 (約57.14%)
                            if (Math.random() < (4 / 7)) {
                                roundEnded = true;
                                this.session_rush_count += 1;
                                addLog(`🎉 ジャッジ成功！！ 大当り獲得！！ (總 ${this.session_rush_count}連)`, "color-hit");

                                const r = Math.random();
                                if (isUra) {
                                    // 裏RUSH中: 87.5%が3000以上, 12.5%が4500以上 (それぞれ25%で+α)
                                    this.state = "RUSH"; // 裏RUSHでの大当り後は通常RUSH移行
                                    if (r < 0.125) {
                                        this.session_payout += 4500;
                                        addLog(`🌈 【裏RUSH恩恵】Premium Episode 4500BONUS！！ (4500玉)`, "color-ura");
                                        updateUI(); await sleep(500);
                                        if (Math.random() < 0.25) await this.runAdrenalineBoost(4500);
                                    } else {
                                        this.session_payout += 3000;
                                        addLog(`🔥 【裏RUSH恩恵】プリンセプスの3000BONUS！！ (3000玉)`, "color-ura");
                                        updateUI(); await sleep(500);
                                        if (Math.random() < 0.25) await this.runAdrenalineBoost(3000);
                                    }
                                    addLog(`🔄 通常RUSHへ移行！`, "color-normal");
                                } else {
                                    // 通常RUSH大当り内訳(80%分を100%に正規化):
                                    // 4500+α(3.125%), 4500(9.375%), 3000+α(9.375%), 3000(28.125%), 1500(50%)
                                    if (r < 0.03125) {
                                        this.session_payout += 4500;
                                        addLog(`🌈 Premium Episode 4500BONUS＋α！！ (4500玉)`, "color-hit");
                                        updateUI(); await sleep(500);
                                        await this.runAdrenalineBoost(4500);
                                    } else if (r < 0.125) {
                                        this.session_payout += 4500;
                                        addLog(`🔥 Premium Episode 4500BONUS！！ (4500玉)`, "color-hit");
                                    } else if (r < 0.21875) {
                                        this.session_payout += 3000;
                                        addLog(`⚡ プリンセプスの3000BONUS＋α！！ (3000玉)`, "color-hit");
                                        updateUI(); await sleep(500);
                                        await this.runAdrenalineBoost(3000);
                                    } else if (r < 0.50) {
                                        this.session_payout += 3000;
                                        addLog(`💥 プリンセプスの3000BONUS！！ (3000玉)`, "color-hit");
                                    } else {
                                        this.session_payout += 1500;
                                        addLog(`▶ グランベルム BONUS！ (1500玉)`, "color-hit");
                                    }
                                }

                                addLog(`💰 累積出玉: ${this.session_payout.toLocaleString()} 玉`);
                                updateUI(); await sleep(700);
                                break;
                            } else {
                                // ジャッジ失敗 (3/7) -> 失敗後の約1/3でSTリセット
                                if (Math.random() < (1 / 3)) {
                                    roundEnded = true;
                                    addLog(`🟢 ジャッジ失敗... からの【RESTART】ST回数リセット！！ (出玉なし)`, "color-reset");
                                    // STリセット時の一部(約30%)で裏RUSH突入
                                    if (Math.random() < 0.30) {
                                        this.state = "URA_RUSH";
                                        addLog(`🖤⚡ ロゴが黒に変化！！ 【裏RUSH】突入！！`, "color-ura");
                                    }
                                    await sleep(700);
                                    break;
                                } else {
                                    addLog(`💨 ジャッジ失敗... ハズレ (ST続行)`, "color-fall");
                                }
                            }
                        }
                    }

                    if (!roundEnded && this.state !== "NORMAL") {
                        document.getElementById("ui-spins").innerText = `終了`;
                        addLog(`\n💀 ST130回転スルー... RUSH終了`, "color-fall");
                        addLog(`📈 總連莊数: ${this.session_rush_count}連`);
                        addLog(`💰 最終出玉: ${this.session_payout.toLocaleString()} 玉`);
                        this.state = "NORMAL";
                        this.record_history();
                        updateUI();
                    }
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.state = "NORMAL";
            }
        }

        let game = new Granbelm319();
        window.game = game;
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            addLog("\n=== eグランベルム319 稼働開始！ ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>
</body>
</html>
