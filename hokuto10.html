<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】e北斗の拳10 | パチンコシミュレーター</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0000;
            color: #eeeeee;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff3d00;
            text-shadow: 0 0 15px rgba(255, 61, 0, 0.7);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel, .right-panel {
            flex: 1;
            min-width: 320px;
        }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }

        .stats-board {
            background-color: #1a0500;
            border: 2px solid #ff3d00;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(255, 61, 0, 0.5);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ff9100;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background: linear-gradient(180deg, #dd2c00 0%, #bf360c 100%);
            color: white;
            border: 1px solid #ff3d00;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #ff3d00;
        }

        button:disabled {
            background: #3e1700;
            border-color: #444;
            color: #777;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        .log-container {
            background-color: #000000;
            border: 1px solid #dd2c00;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #ff9100; font-weight: bold; text-shadow: 0 0 5px #ff9100; }
        .color-hit { color: #ff3d00; font-weight: bold; text-shadow: 0 0 5px #ff3d00; }
        .color-normal { color: #bdbdbd; }
        .color-ultimate { color: #ffea00; font-weight: 900; text-shadow: 0 0 15px #ffea00; font-size: 1.1em; }
        .color-fall { color: #757575; font-weight: bold; }

        .data-lamp-container {
            background-color: #1a0500;
            border: 3px solid #dd2c00;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(221, 44, 0, 0.5);
        }

        .data-lamp-title {
            color: #ff9100;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ff9100;
            letter-spacing: 2px;
        }

        table.data-lamp {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        table.data-lamp th,
        table.data-lamp td {
            border: 1px solid #bf360c;
            padding: 10px 5px;
            text-align: center;
        }

        table.data-lamp th {
            background-color: #3e1700;
            color: #ff9100;
            font-size: 0.9em;
        }

        table.data-lamp tr:nth-child(even) { background-color: #2e1000; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff3d00; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>

    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">e北斗の拳10</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="4" class="empty-row">- 無紀錄 -</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class Hokuto10 {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = [];
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                if (Math.random() < (1 / 399.8)) {
                    addLog(`\n[${this.session_spins} 回轉] 💥 大当り當選！`, "color-hit");

                    let r = Math.random();
                    let enterRush = true;
                    
                    if (r < 0.05) {
                        this.session_payout += 4500;
                        addLog("🌈 TRIPLE HYPER BONUS！ 4500玉獲得 ＋ 拳王RUSH突入！", "color-ultimate");
                    } else if (r < 0.09) {
                        this.session_payout += 1800;
                        addLog("🔥 拳王覚醒チャンス成功！ 1800玉獲得 ＋ 拳王RUSH突入！", "color-rush");
                    } else if (r < 0.61) {
                        this.session_payout += 1500;
                        addLog("✨ BATTLE BONUS 勝利！ 1500玉獲得 ＋ 拳王RUSH突入！", "color-rush");
                    } else {
                        this.session_payout += 1500;
                        enterRush = false;
                        addLog("💀 BATTLE BONUS 敗北... 1500玉獲得 (通常終了)", "color-normal");
                    }

                    updateUI();
                    await sleep(1000);

                    if (enterRush) {
                        await this.play_rush();
                    } else {
                        this.record_history();
                    }
                    return true;
                }
                return false;
            }

            async play_rush() {
                addLog(`\n===== 👊 拳王RUSH (ST10回+4回) 開始 =====`, "color-ultimate");
                this.state = "RUSH";
                let st_remain = 14; 
                updateUI();

                while (this.state === "RUSH" && st_remain > 0) {
                    await sleep(400); // 1回転の緊張感を出すためのディレイ
                    let current_spin = 15 - st_remain;
                    
                    if (st_remain > 4) {
                        document.getElementById("ui-spins").innerText = `電サポ中: ${current_spin}/10`;
                    } else {
                        document.getElementById("ui-spins").innerText = `残保留: ${4 - st_remain + 1}/4`;
                        addLog(`⏳ 残保留 ${4 - st_remain + 1}回転目...`, "color-normal");
                    }

                    if (Math.random() < (1 / 10.7)) {
                        this.session_rush_count += 1;
                        let isReserve = st_remain <= 4;
                        addLog(`\n🎉 [${isReserve ? '残保留' : 'ST'}] 當選！ (總 ${this.session_rush_count + 1}連)`, "color-hit");

                        let r2 = Math.random();
                        let addP = 0;
                        let resetText = "";

                        if (!isReserve) {
                            // 電サポ中の振り分け
                            if (r2 < 0.10) { addP = 6000; resetText = "🌈 極闘 EXTREME BATTLE！ 6000玉獲得！"; }
                            else if (r2 < 0.50) { addP = 4500; resetText = "👑 TRIPLE HYPER BONUS！ 4500玉獲得！"; }
                            else if (r2 < 0.80) { addP = 1500; resetText = "💥 HYPER BONUS！ 1500玉獲得！"; }
                            else { addP = 0; resetText = "🔄 STリセット當選！ (出玉なし)"; }
                        } else {
                            // 残保留の振り分け
                            if (r2 < 0.80) { addP = 1500; resetText = "💥 FINAL BATTLE 勝利！ 1500玉獲得！"; }
                            else { addP = 0; resetText = "🔄 STリセット當選！ (出玉なし)"; }
                        }

                        this.session_payout += addP;
                        addLog(resetText, addP >= 4500 ? "color-ultimate" : "color-hit");
                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        addLog("⚡ 拳王RUSH 継続!!", "color-rush");

                        st_remain = 14; // ST 10 + 残保留 4 回復
                        updateUI();
                        await sleep(800);
                    } else {
                        st_remain--;
                    }
                }

                if (st_remain === 0) {
                    document.getElementById("ui-spins").innerText = `終了`;
                    addLog("\n💀 決着... RUSH終了", "color-fall");
                    addLog(`📈 總連莊數: ${this.session_rush_count + 1}連 (含初當)`);
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                    this.state = "NORMAL";
                    this.record_history();
                    updateUI();
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count > 0 ? this.session_rush_count + 1 : 1,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new Hokuto10();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;

            addLog("\n=== 我が生涯に一片の悔いなし！ ===", "color-hit");

            while (isPlaying) {
                let ended = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0 && game.state === "NORMAL") {
                    await sleep(10);
                }

                if (ended) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="plugin.js"></script>
    <div style="position: fixed; bottom: 0; left: 0; width: 100%; background-color: rgba(0,0,0,0.8); z-index: 9999; text-align: center; padding: 5px 0; border-top: 1px solid #333;">

        </script>

    </div>
</body>
</html>
