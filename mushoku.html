<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柏青哥模擬器 (e無職転生)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #040d1a;
            color: #e0e0e0;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #4fc3f7;
            text-shadow: 0 0 15px rgba(79, 195, 247, 0.7);
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #0b1a2e;
            border: 2px solid #0277bd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(2, 119, 189, 0.5);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffca28;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #0277bd;
            color: white;
            border: 1px solid #4fc3f7;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        button:hover { background-color: #01579b; box-shadow: 0 0 10px #4fc3f7; }
        button:disabled { background-color: #1a2a3a; border-color: #444; color: #777; cursor: not-allowed; box-shadow: none; }
        
        #btn-reset { background-color: #424242; border-color: #616161; }
        #btn-reset:hover { background-color: #212121; box-shadow: 0 0 10px #616161; }

        .log-container {
            background-color: #000000;
            border: 1px solid #01579b;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #ffca28; font-weight: bold; text-shadow: 0 0 5px #ffca28; }
        .color-hit { color: #4fc3f7; font-weight: bold; }
        .color-normal { color: #9e9e9e; }
        .color-charge { color: #ab47bc; font-weight: bold; }
        .color-ultimate { color: #ff5252; font-weight: bold; text-shadow: 0 0 10px #ff5252; font-size: 1.1em; }
        .color-fall { color: #757575; font-style: italic; }

        .data-lamp-container {
            background-color: #05101a;
            border: 3px solid #01579b;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(2, 119, 189, 0.4);
        }

        .data-lamp-title {
            color: #4fc3f7;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #4fc3f7;
            letter-spacing: 2px;
        }

        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #0277bd; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #013a63; color: #ffca28; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #051a2e; }
        table.data-lamp td.hit-spins { color: #4fc3f7; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ffca28; font-weight: bold; }
        .empty-row { color: #555 !important; }
    </style>
</head>

<body>

    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.6em; color: #ffca28;">e無職転生 〜異世界行ったら本気だす〜</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 開始抽機</button>
                <button id="btn-reset" onclick="resetGame()">🔄 紀錄重置</button>
            </div>

            <div class="log-container" id="log-box"></div>
        </div>

        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead>
                        <tr>
                            <th>前次</th>
                            <th>當選回轉數</th>
                            <th>連莊數</th>
                            <th>獲得出玉</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>
                    </tbody>
                </table>
            </div>
            </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        class MushokuMachine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = []; 
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 1/399.6 図柄揃い
                if (Math.random() < (1 / 399.6)) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 異世界BONUS 當選！`, "color-hit");
                    
                    this.session_payout += 1200; // 8R 1200個
                    updateUI();
                    await sleep(800);

                    // 54% 突入 RUSH
                    if (Math.random() < 0.54) {
                        addLog("🌈 演出成功！ 1200玉獲得 ＋ 無職転生RUSH 突入！", "color-ultimate");
                        await sleep(1000);
                        await this.play_rush();
                    } else {
                        addLog("😭 演出失敗... 1200玉獲得 (通常終了)", "color-normal");
                        addLog(`💰 本次總出玉: ${this.session_payout} 玉`);
                        this.record_history();
                    }
                    return true;
                }

                // 1/2731.4 魔力チャージ (2R 300個)
                if (Math.random() < (1 / 2731.4)) {
                    addLog(`\n[${this.session_spins} 回轉] ⚡ 魔力チャージ！`, "color-charge");
                    this.session_payout += 300;
                    updateUI();
                    
                    // 1% 奇蹟昇格
                    if (Math.random() < 0.01) {
                        addLog("✨ 奇跡の昇格発生！ 無職転生RUSH 突入！", "color-ultimate");
                        await sleep(1000);
                        await this.play_rush();
                    } else {
                        addLog("💧 300玉獲得 (通常へ戻る)", "color-normal");
                        this.record_history();
                    }
                    return true;
                }

                return false;
            }

            async play_rush() {
                addLog(`\n===== 🪄 無職転生RUSH (ST130回転) 開始 =====`, "color-rush");
                this.state = "RUSH";
                updateUI();

                let st_remaining = 130;
                
                while (this.state === "RUSH" && st_remaining > 0) {
                    await sleep(30);
                    document.getElementById("ui-spins").innerText = `RUSH残り: ${st_remaining}/130`;

                    // 右打ち確率: 1/90.4
                    if (Math.random() < (1 / 90.4)) {
                        this.session_rush_count += 1;
                        let used_spin = 130 - st_remaining + 1;
                        addLog(`\n🎉 RUSH 當選！ (ST ${used_spin}回転目)`, "color-hit");

                        // RUSH中 ラウンド振り分け
                        let br = Math.random();
                        let payout = 0;

                        if (br < 0.235) {
                            payout = 6000;
                            addLog(`👑 君に朗報だ！ 10R×4回 (6000玉獲得) !!!`, "color-ultimate");
                        } else if (br < 0.235 + 0.265) {
                            payout = 3000;
                            addLog(`💥 大魔術！ 10R×2回 (3000玉獲得) !!`, "color-rush");
                        } else {
                            payout = 1500;
                            addLog(`✨ 10R (1500玉獲得)`, "color-hit");
                        }

                        this.session_payout += payout;
                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        
                        st_remaining = 130; // 重置 ST
                        updateUI();
                        await sleep(800);
                    } else {
                        st_remaining--;
                    }
                }

                if (st_remaining === 0) {
                    document.getElementById("ui-spins").innerText = `RUSH残り: 0/130`;
                    addLog("\n💀 ST抜け... RUSH終了", "color-fall");
                    addLog(`📈 總連莊數: ${this.session_rush_count}連 (含初當)`);
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);

                    this.state = "NORMAL";
                    this.record_history();
                    updateUI();
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new MushokuMachine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const btnReset = document.getElementById("btn-reset");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            btnReset.disabled = true;

            addLog("\n=== 遊戲開始 (本気だす) ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0) {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            btnReset.disabled = false;
            btnPlay.innerText = "▶️ 繼續抽機";
        }

        function resetGame() {
            game = new MushokuMachine();
            logBox.innerHTML = "";
            renderHistoryTable([]);
            updateUI();
            addLog("遊戲紀錄已重置。", "color-normal");
            btnPlay.innerText = "▶️ 開始抽機";
        }
    </script>
    
    <script src="plugin.js"></script>
</body>
</html>
