<head>

    <meta name="machine-title" content="e無職転生">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #040d1a;
            color: #e0e0e0;
            text-align: center;
            padding-bottom: 60px;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #4fc3f7;
            text-shadow: 0 0 15px rgba(79, 195, 247, 0.7);
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left-panel { flex: 1; min-width: 320px; max-width: 500px; }
        .right-panel { flex: 1; min-width: 320px; max-width: 400px; }

        .stats-board {
            background-color: #0b1a2e;
            border: 2px solid #0277bd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            font-size: 1.1em;
            box-shadow: inset 0 0 15px rgba(2, 119, 189, 0.5);
        }

        .stat-item span {
            display: block;
            font-weight: bold;
            color: #ffca28;
            font-size: 1.3em;
            margin-top: 5px;
        }

        button {
            background-color: #0277bd;
            color: white;
            border: 1px solid #4fc3f7;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        button:hover { background-color: #01579b; box-shadow: 0 0 10px #4fc3f7; }
        button:disabled { background-color: #1a2a3a; border-color: #444; color: #777; cursor: not-allowed; box-shadow: none; }
        
        #btn-reset { background-color: #424242; border-color: #616161; }
        #btn-reset:hover { background-color: #212121; box-shadow: 0 0 10px #616161; }

        .log-container {
            background-color: #000000;
            border: 1px solid #01579b;
            border-radius: 5px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }

        .log-entry { margin: 5px 0; }
        .color-rush { color: #ffca28; font-weight: bold; text-shadow: 0 0 5px #ffca28; }
        .color-hit { color: #4fc3f7; font-weight: bold; }
        .color-normal { color: #9e9e9e; }
        .color-charge { color: #ab47bc; font-weight: bold; }
        .color-ultimate { color: #ff5252; font-weight: bold; text-shadow: 0 0 10px #ff5252; font-size: 1.1em; }
        .color-fall { color: #757575; font-style: italic; }

        .data-lamp-container {
            background-color: #05101a;
            border: 3px solid #01579b;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(2, 119, 189, 0.4);
        }

        .data-lamp-title {
            color: #4fc3f7;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #4fc3f7;
            letter-spacing: 2px;
        }

        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #0277bd; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #013a63; color: #ffca28; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #051a2e; }
        table.data-lamp td.hit-spins { color: #4fc3f7; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ffca28; font-weight: bold; }
        .empty-row { color: #555 !important; }

        /* 🌟 ブラックアウト演出 (究極進化版) 🌟 */
        .blackout-overlay {
            position: fixed; inset: 0; z-index: 20000; display: flex; align-items: center; justify-content: center; pointer-events: none; 
            background: #000;
            opacity: 0; visibility: hidden;
        }
        
        .blackout-overlay::before {
            content: ''; position: absolute; inset: 0; z-index: -1;
            background: 
                radial-gradient(ellipse 150% 6% at center, #000000 5%, #0011ff 12%, #ffd700 22%, #00aaff 40%, transparent 60%),
                radial-gradient(ellipse 8% 55% at center, #000000 5%, #0011ff 15%, #ffd700 25%, #00aaff 45%, transparent 65%),
                #ffffff;
            opacity: 0;
            filter: contrast(1.5);
        }

        .blackout-overlay.is-active { visibility: visible; animation: blackout-bg 6s forwards; }
        .blackout-overlay.is-active::before { animation: blackout-flash 6s forwards; }
        .blackout-overlay.is-active .blackout-message { animation: blackout-text 6s forwards; }

        .blackout-message { display: flex; flex-direction: column; align-items: center; gap: 0.2em; font-family: "Arial Black", Impact, sans-serif; font-size: clamp(1.5rem, 5vw, 4rem); line-height: 1.2; letter-spacing: 0.04em; text-align: center; transform: scale(0.8); opacity: 0; }
        
        .blackout-rainbow {
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00e5ff, #c500ff, #ff0000);
            background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: blackout-rainbow 2s linear infinite; filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.75)); font-weight: 900;
        }

        @keyframes blackout-rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        
        @keyframes blackout-bg { 0% { opacity: 0; } 2%, 85% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        
        @keyframes blackout-flash {
            0% { opacity: 0; transform: scale(0.2) scaleY(0.05); filter: brightness(2); }
            2% { opacity: 1; transform: scale(1) scaleY(1); filter: brightness(2); }
            10% { opacity: 0; transform: scale(1.5) scaleY(2); filter: brightness(1); }
            100% { opacity: 0; }
        }

        @keyframes blackout-text { 
            0%, 33% { opacity: 0; transform: scale(1.35); } 
            40%, 80% { opacity: 1; transform: scale(1); } 
            100% { opacity: 0; transform: scale(0.96); } 
        }

        /* 🌟 御神體演出 CSS 🌟 */
        .roxy-overlay-container {
            position: fixed; inset: 0; z-index: 25000; background: #000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; pointer-events: none; overflow: hidden;
        }
        .roxy-overlay-container.is-active { animation: roxy-bg-anim 10s forwards; }

        /* 寶箱動畫 */
        .chest-wrapper { position: relative; width: 200px; height: 150px; opacity: 0; }
        .roxy-overlay-container.is-active .chest-wrapper { animation: chest-fade 6s forwards; }
        
        .chest-box { position: relative; width: 100%; height: 100%; }
        .chest-body { position: absolute; bottom: 0; width: 100%; height: 60%; background: linear-gradient(135deg, #d4af37, #8a6b1c); border: 4px solid #5c4000; border-radius: 5px; }
        .chest-lid { 
            position: absolute; top: 10%; width: 100%; height: 50%; background: linear-gradient(135deg, #e6c855, #a38222); border: 4px solid #5c4000; border-radius: 10px 10px 0 0;
            transform-origin: bottom; transform: rotateX(0deg); 
        }
        .chest-light {
            position: absolute; top: 40%; left: 10%; width: 80%; height: 20px;
            background: #fff; box-shadow: 0 0 40px 20px #ffd700; opacity: 0; border-radius: 50%;
        }
        
        .roxy-overlay-container.is-active .chest-lid { animation: chest-open-anim 6s forwards; }
        .roxy-overlay-container.is-active .chest-light { animation: chest-light-anim 6s forwards; }

        /* 御神體與神字 */
        .pantsu-wrapper { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
        .roxy-overlay-container.is-active .pantsu-wrapper { animation: pantsu-fade 10s forwards; }
        .pantsu-img { max-width: 80%; max-height: 80%; object-fit: contain; filter: drop-shadow(0 0 30px #ffd700); transform: scale(0.8); }
        .roxy-overlay-container.is-active .pantsu-img { animation: pantsu-zoom 4s forwards; animation-delay: 6s; }

        .kami-text {
            position: absolute; color: transparent; font-size: 8rem; font-weight: 900; font-family: "Yu Mincho", "MS Mincho", serif;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00e5ff, #c500ff, #ff0000); background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
            -webkit-text-stroke: 3px #fff; filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)); opacity: 0;
        }
        .roxy-overlay-container.is-active .kami-text { animation: kami-pop 3s infinite; }

        @keyframes roxy-bg-anim { 0%, 98% { opacity: 1; visibility: visible; } 100% { opacity: 0; visibility: hidden; } }
        @keyframes chest-fade { 0% { opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes chest-open-anim { 
            0%, 20% { transform: perspective(500px) rotateX(0deg); } 
            35% { transform: perspective(500px) rotateX(30deg); } 
            55% { transform: perspective(500px) rotateX(60deg); } 
            80%, 100% { transform: perspective(500px) rotateX(120deg); } 
        }
        @keyframes chest-light-anim {
            0%, 20% { opacity: 0; } 35% { opacity: 0.3; transform: scale(1); } 55% { opacity: 0.6; transform: scale(1.5); }
            75% { opacity: 1; transform: scale(3); filter: brightness(2); } 85%, 100% { opacity: 1; transform: scale(50); filter: brightness(5); }
        }
        
        @keyframes pantsu-fade { 0%, 55% { opacity: 0; } 60%, 95% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes pantsu-zoom { 0% { transform: scale(0.8); } 100% { transform: scale(1.1); } }
        @keyframes kami-pop { 
            0% { opacity: 0; transform: scale(calc(var(--s, 1) * 0.2)) rotate(calc(var(--r, 0deg) - 10deg)); background-position: 0% center; } 
            20% { opacity: 1; transform: scale(calc(var(--s, 1) * 1.2)) rotate(calc(var(--r, 0deg) + 5deg)); } 
            50% { opacity: 1; transform: scale(var(--s, 1)) rotate(var(--r, 0deg)); } 
            80% { opacity: 0; transform: scale(calc(var(--s, 1) * 1.5)); } 
            100% { opacity: 0; background-position: 200% center; } 
        }
    </style>

    <h1>🎰 柏青哥模擬器 <br><span style="font-size: 0.6em; color: #ffca28;">e無職転生 〜異世界行ったら本気だす〜</span></h1>

    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>

    <script>

        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const rushMedia = document.getElementById("rush-media");
        let audioUnlocked = false;

        function playBlackout演出(hitNumber = 1) {
            try {
                if (window.audioCtx) {
                    if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
                    const ctx = window.audioCtx;
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const filter = ctx.createBiquadFilter();
                    const gainNode = ctx.createGain();

                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(200, ctx.currentTime);
                    osc1.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);

                    osc2.type = 'square';
                    osc2.frequency.setValueAtTime(150, ctx.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.2);

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4);

                    gainNode.gain.setValueAtTime(0.001, ctx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(1.0, ctx.currentTime + 0.05);
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);

                    osc1.connect(gainNode);
                    osc2.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(ctx.destination);

                    osc1.start(ctx.currentTime);
                    osc2.start(ctx.currentTime);
                    osc1.stop(ctx.currentTime + 1.2);
                    osc2.stop(ctx.currentTime + 1.2);
                }
            } catch (e) { console.log(e); }

            const overlay = document.getElementById("blackout-overlay");
            if (!overlay) return sleep(6000);
            overlay.classList.remove("is-active");
            void overlay.offsetWidth;
            overlay.classList.add("is-active");
            return sleep(6000).then(() => {
                overlay.classList.remove("is-active");
            });
        }

        function playRoxyAnimation() {
            try {
                if (window.audioCtx) {
                    if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
                    const ctx = window.audioCtx;
                    
                    // 🌟 修正音效 1：神聖和音 (變柔和、音量大減)
                    const osc1 = ctx.createOscillator(); const gain1 = ctx.createGain();
                    osc1.type = 'sine'; osc1.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc1.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 5); // C6
                    gain1.gain.setValueAtTime(0, ctx.currentTime);
                    gain1.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 3); // 音量由 0.5 壓低到 0.08
                    gain1.gain.linearRampToValueAtTime(0, ctx.currentTime + 6);
                    osc1.connect(gain1); gain1.connect(ctx.destination);
                    osc1.start(ctx.currentTime); osc1.stop(ctx.currentTime + 6);

                    // 🌟 修正音效 2：爆發聲 (改用 triangle 波，無咁刺耳)
                    const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
                    osc2.type = 'triangle'; 
                    osc2.frequency.setValueAtTime(800, ctx.currentTime + 6); 
                    osc2.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 6.5);
                    gain2.gain.setValueAtTime(0, ctx.currentTime + 5.9); 
                    gain2.gain.setValueAtTime(0.15, ctx.currentTime + 6); // 音量由 1 壓低到 0.15
                    gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 7.5);
                    osc2.connect(gain2); gain2.connect(ctx.destination);
                    osc2.start(ctx.currentTime + 6); osc2.stop(ctx.currentTime + 7.5);
                }
            } catch (e) {}

            const overlay = document.getElementById("roxy-overlay");
            if (!overlay) return sleep(10000);

            // 🌟 視覺修正：動態生成 60 個彩色「神」字！
            const pantsuWrapper = document.getElementById("roxy-pantsu");
            document.querySelectorAll('.dynamic-kami').forEach(el => el.remove()); // 每次播前清空舊字
            
            for (let i = 0; i < 60; i++) {
                let kami = document.createElement("div");
                kami.className = "kami-text dynamic-kami";
                kami.innerText = "神";
                
                let topPos = -10 + Math.random() * 100; // 擴展到全畫面
                let leftPos = -10 + Math.random() * 100;
                let delay = 6 + (Math.random() * 2); // 確保喺第 6 秒 (寶箱爆開時) 先開始彈出
                let scale = 0.3 + Math.random() * 1.5; // 大小不一
                let rotate = (Math.random() - 0.5) * 80; // 隨機傾斜
                
                kami.style.top = `${topPos}%`;
                kami.style.left = `${leftPos}%`;
                kami.style.animationDelay = `${delay}s`;
                kami.style.setProperty('--s', scale);
                kami.style.setProperty('--r', `${rotate}deg`);
                
                pantsuWrapper.appendChild(kami);
            }

            overlay.classList.remove("is-active");
            void overlay.offsetWidth;
            overlay.classList.add("is-active");
            
            return sleep(10000).then(() => {
                overlay.classList.remove("is-active");
            });
        }

        class MushokuMachine {
            constructor() {
                this.state = "NORMAL";
                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
                this.history = []; 
            }

            async play_normal() {
                this.session_spins += 1;

                if (this.session_spins % 100 === 0) {
                    addLog(`現在回轉數: ${this.session_spins}`, "color-normal");
                }

                // 1/399.6 図柄揃い
                if (Math.random() < (1 / 399.6)) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 異世界BONUS 當選！`, "color-hit");
                    
                    this.session_payout += 1200; // 8R 1200個
                    updateUI();
                    await sleep(800);

                    // 54% 突入 RUSH
                    if (Math.random() < 0.54) {
                        addLog("🌈 演出成功！ 1200玉獲得 ＋ 無職転生RUSH 突入！", "color-ultimate");
                        await sleep(1000);
                        await this.play_rush();
                    } else {
                        addLog("😭 演出失敗... 1200玉獲得 (通常終了)", "color-normal");
                        addLog(`💰 本次總出玉: ${this.session_payout} 玉`);
                        this.record_history();
                    }
                    return true;
                }

                // 1/2731.4 魔力チャージ (2R 300個)
                if (Math.random() < (1 / 2731.4)) {
                    addLog(`\n[${this.session_spins} 回轉] ⚡ 魔力チャージ！`, "color-charge");
                    this.session_payout += 300;
                    updateUI();
                    
                    // 1% 奇蹟昇格
                    if (Math.random() < 0.01) {
                        addLog("✨ 奇跡の昇格発生！ 無職転生RUSH 突入！", "color-ultimate");
                        await sleep(1000);
                        await this.play_rush();
                    } else {
                        addLog("💧 300玉獲得 (通常へ戻る)", "color-normal");
                        this.record_history();
                    }
                    return true;
                }

                return false;
            }

            async play_rush() {
                addLog(`\n===== 🪄 無職転生RUSH (ST130回転) 開始 =====`, "color-rush");
                this.state = "RUSH";
                this.session_6000_count = 0; // 🌟 每次 RUSH 開始重置 6000玉 次數
                updateUI();

                let st_remaining = 130;
                
                while (this.state === "RUSH" && st_remaining > 0) {
                    await sleep(40);
                    document.getElementById("ui-spins").innerText = `RUSH残り: ${st_remaining}/130`;

                    // 右打ち確率: 1/90.4
                    if (Math.random() < (1 / 90.4)) {
                        this.session_rush_count += 1;
                        let used_spin = 130 - st_remaining + 1;
                        addLog(`\n🎉 RUSH 當選！ (ST ${used_spin}回転目)`, "color-hit");

                        // RUSH中 ラウンド振り分け
                        let br = Math.random();
                        let payout = 0;

                        if (br < 0.235) {
                            payout = 6000;
                            // 🌟 記錄同一次 RUSH 內抽中 6000玉 嘅次數
                            this.session_6000_count = (this.session_6000_count || 0) + 1;
                            
                            await playBlackout演出();
                            addLog(`👑 君に朗報だ！ 10R×4回 (6000玉獲得) !!!`, "color-ultimate");

                            // 🌟 第 7 次抽中 6000玉 觸發御神體動畫 🌟
                            if (this.session_6000_count === 7) {
                                await sleep(3000); // 停頓 3秒
                                addLog(`⚡ 神々しい光が...`, "color-ultimate");
                                await playRoxyAnimation();
                            }
                        } else if (br < 0.235 + 0.265) {
                            payout = 3000;
                            addLog(`❤️❤️ドキドキBONUS！ 10R×2回 (3000玉獲得) !!`, "color-rush");
                        } else {
                            payout = 1500;
                            addLog(`✨ 10R (1500玉獲得)`, "color-hit");
                        }

                        this.session_payout += payout;
                        addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        
                        st_remaining = 130; // 重置 ST
                        updateUI();
                        await sleep(800);
                    } else {
                        st_remaining--;
                    }
                }

                if (st_remaining === 0) {
                    document.getElementById("ui-spins").innerText = `RUSH残り: 0/130`;
                    addLog("\n💀 ST抜け... RUSH終了", "color-fall");
                    addLog(`📈 總連莊數: ${this.session_rush_count}連 (含初當)`);
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);

                    this.state = "NORMAL";
                    this.record_history();
                    updateUI();
                }
            }

            record_history() {
                this.history.unshift({
                    spins: this.session_spins,
                    rush: this.session_rush_count,
                    payout: this.session_payout
                });

                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);

                this.session_spins = 0;
                this.session_payout = 0;
                this.session_rush_count = 0;
            }
        }

        let game = new MushokuMachine();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const btnReset = document.getElementById("btn-reset");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div");
            div.className = `log-entry ${className}`;
            div.innerText = text;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") {
                document.getElementById("ui-spins").innerText = game.session_spins;
            }
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`;
                return;
            }

            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `
                    <td>${label}</td>
                    <td class="hit-spins">${record.spins}</td>
                    <td class="hit-rush">${record.rush}</td>
                    <td class="hit-payout">${record.payout}</td>
                `;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.disabled = true;
            if(btnReset) btnReset.disabled = true;

            if (!audioUnlocked) {
                if (rushMedia) rushMedia.load();
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    window.audioCtx = new AudioContextClass();
                    if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
                }
                audioUnlocked = true;
            }

            addLog("\n=== 遊戲開始 (本気だす) ===", "color-hit");

            while (isPlaying) {
                let hit = await game.play_normal();
                updateUI();

                if (game.session_spins % 100 === 0) {
                    await sleep(10);
                }

                if (hit) {
                    isPlaying = false;
                    break;
                }
            }

            btnPlay.disabled = false;
            if(btnReset) btnReset.disabled = false;
            btnPlay.innerText = "▶️ 繼續抽機";
        }

        function resetGame() {
            game = new MushokuMachine();
            logBox.innerHTML = "";
            renderHistoryTable([]);
            updateUI();
            addLog("遊戲紀錄已重置。", "color-normal");
            btnPlay.innerText = "▶️ 開始抽機";
        }
    </script>
