<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】e魔女と野獣 | パチンコシミュレーター</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0014; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #d50000; text-shadow: 0 0 15px rgba(213, 0, 0, 0.7); font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #1a0005; border: 2px solid #d50000; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(213, 0, 0, 0.5); }
        .stat-item span { display: block; font-weight: bold; color: #ff1744; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #b71c1c 0%, #4a0000 100%); color: white; border: 1px solid #ff5252; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #ff5252; }
        button:disabled { background: #3e0000; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #9c27b0; border-radius: 5px; height: 400px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-rush { color: #e040fb; font-weight: bold; text-shadow: 0 0 5px #e040fb; }
        .color-hit { color: #ff5252; font-weight: bold; text-shadow: 0 0 5px #ff5252; }
        .color-normal { color: #bdbdbd; }
        .color-charge { color: #4fc3f7; }
        .color-ultimate { color: #ffea00; font-weight: 900; text-shadow: 0 0 15px #ffea00; font-size: 1.1em; }
        .color-fall { color: #757575; font-weight: bold; }
        .data-lamp-container { background-color: #1a0014; border: 3px solid #9c27b0; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(156, 39, 176, 0.5); }
        .data-lamp-title { color: #e040fb; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #e040fb; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #4a148c; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #31004a; color: #ffea00; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #1f0030; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff5252; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>

<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">e魔女と野獣</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉數</th><th>連莊數</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        class MajoToYajuu {
            constructor() { this.state = "NORMAL"; this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.history = []; }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉數: ${this.session_spins}`, "color-normal");

                let roll = Math.random();
                if (roll < 1 / 399.0) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い當選！`, "color-hit");
                    let r = Math.random();
                    this.session_payout += 400;

                    if (r < 0.01) {
                        addLog("✨ 超復讐BONUS (400玉)！", "color-ultimate");
                        addLog("🚀 運命分岐直行！！", "color-rush");
                        this.session_rush_count = 1;
                        updateUI(); await sleep(1000);
                        await this.play_unmei();
                        await this.play_rush(false);
                    } else if (r < 0.51) {
                        addLog("🔥 復讐BONUS (400玉)", "color-rush");
                        addLog("⚡ 復讐RUSH 突入！", "color-rush");
                        this.session_rush_count = 1;
                        updateUI(); await sleep(1000);
                        await this.play_rush(true);
                    } else {
                        addLog("💥 チャレンジ / 魔女決戦BONUS (400玉)", "color-hit");
                        addLog("💀 RUSH非突入... 通常へ戻る", "color-normal");
                        updateUI(); this.record_history();
                    }
                    return true;
                } else if (roll < (1 / 399.0) + (1 / 2799.0)) {
                    addLog(`\n[${this.session_spins} 回轉] 🔮 復讐CHARGE (300玉獲得)`, "color-charge");
                    this.session_payout += 300;
                    updateUI(); this.record_history();
                    return true;
                }
                return false;
            }

            async play_unmei() {
                addLog(`\n===== ⚖️ 運命分岐 発生！ =====`, "color-ultimate");
                await sleep(800);
                
                let ur = Math.random();
                if (ur < 0.50) {
                    this.session_payout += 3000;
                    addLog(`❌ 演出失敗... 3000玉獲得`, "color-hit");
                } else if (ur < 0.79) {
                    this.session_payout += 6000;
                    addLog(`🎉 演出成功！ 6000玉獲得！`, "color-ultimate");
                    // 🌟 喺呢度加上成功率 65%
                    addLog(`🔥 BEAST ATTACK 突入！ (上乗せ成功率: 65%)`, "color-rush");
                    await this.play_beast(0.65, 3000);
                } else {
                    this.session_payout += 9000;
                    addLog(`👑 大成功！ 9000玉獲得！`, "color-ultimate");
                    // 🌟 喺呢度加上成功率 30%
                    addLog(`💥 超 BEAST ATTACK 突入！ (上乗せ成功率: 30%)`, "color-ultimate");
                    await this.play_beast(0.30, 6000);
                }
                addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                updateUI(); await sleep(1000);
            }

            async play_beast(loopRate, addPayout) {
                while(Math.random() < loopRate) {
                    await sleep(600);
                    this.session_payout += addPayout;
                    // 🌟 喺後面加埋當前嘅累計出玉
                    addLog(`⚡ 上乗せ成功！ +${addPayout}玉！ (累計: ${this.session_payout} 玉)`, "color-ultimate");
                    updateUI();
                }
                addLog(`📉 上乗せ終了... RUSHへ戻る`, "color-normal");
            }

            async play_rush(isFirstHit) {
                addLog(`\n===== ⚔️ 復讐RUSH (ST 75回転) =====`, "color-rush");
                this.state = "RUSH";
                let st_remain = 75; 
                let initial_rush_count = this.session_rush_count; // 🌟 記低入 ST 前嘅連莊數
                updateUI();

                while (this.state === "RUSH" && st_remain > 0) {
                    await sleep(50);
                    document.getElementById("ui-spins").innerText = `ST残り: ${st_remain}/75`;

                    if (Math.random() < (1 / 95.0)) {
                        this.session_rush_count += 1;
                        let hitSpin = 75 - st_remain + 1;
                        addLog(`\n🎉 [ST ${hitSpin}回転目] 當選！ (總 ${this.session_rush_count}連)`, "color-hit");

                        if (isFirstHit) {
                            isFirstHit = false;
                            await this.play_unmei();
                        } else {
                            if (Math.random() < 0.52) {
                                await this.play_unmei();
                            } else {
                                this.session_payout += 1500;
                                addLog(`💥 BIG 1500 BONUS！`, "color-hit");
                                addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            }
                        }
                        st_remain = 75; 
                        updateUI(); await sleep(800);
                    } else { st_remain--; }
                }

                if (st_remain === 0) {
                    document.getElementById("ui-spins").innerText = `終了`;

                    // 🌟 判斷 ST 入面有無中過獎，無中過先至加上「駆け抜け」字眼
                    if (this.session_rush_count === initial_rush_count) {
                        addLog("\n💀 RUSH終了... (75回転駆け抜け)", "color-fall");
                    } else {
                        addLog("\n💀 RUSH終了...", "color-fall");
                    }

                    addLog(`📈 總連莊數: ${this.session_rush_count}連 (含初當)`);
                    addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                    this.state = "NORMAL"; this.record_history(); updateUI();
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0;
            }
        }

        let game = new MajoToYajuu();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            addLog("\n=== 復讐の始まりだ ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="plugin.js"></script>
    <div style="position: fixed; bottom: 0; left: 0; width: 100%; background-color: rgba(0,0,0,0.8); z-index: 9999; text-align: center; padding: 5px 0; border-top: 1px solid #333;">
        <script type="text/javascript">atOptions = { 'key' : 'ead8f1e5fdd30faaed33da77b3333cf4', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };</script>
        <script type="text/javascript" src="//www.highperformanceformat.com/ead8f1e5fdd30faaed33da77b3333cf4/invoke.js"></script>
    </div>
</body>
</html>
