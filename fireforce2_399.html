<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【無料】eフィーバー炎炎ノ消防隊2 399Ver | パチンコシミュレーター</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a0500; color: #eeeeee; text-align: center; padding-bottom: 60px; margin: 0; padding: 20px; }
        h1 { color: #ff5722; text-shadow: 0 0 15px rgba(255, 87, 34, 0.7); font-weight: 900; letter-spacing: 2px; }
        .main-container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { flex: 1; min-width: 320px; }
        .left-panel { max-width: 500px; }
        .right-panel { max-width: 400px; }
        .stats-board { background-color: #2b0a00; border: 2px solid #ff5722; border-radius: 10px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-around; font-size: 1.1em; box-shadow: inset 0 0 15px rgba(255, 87, 34, 0.5); }
        .stat-item span { display: block; font-weight: bold; color: #ff9800; font-size: 1.3em; margin-top: 5px; }
        button { background: linear-gradient(180deg, #d84315 0%, #bf360c 100%); color: white; border: 1px solid #ff9800; padding: 12px 25px; font-size: 1.1em; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: transform 0.1s, box-shadow 0.2s; }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px #ff5722; }
        button:disabled { background: #3e1500; border-color: #444; color: #777; cursor: not-allowed; transform: scale(1); box-shadow: none; }
        .log-container { background-color: #000000; border: 1px solid #ff3d00; border-radius: 5px; height: 400px; overflow-y: auto; padding: 10px; text-align: left; font-family: 'Courier New', Courier, monospace; line-height: 1.5; }
        .log-entry { margin: 5px 0; }
        .color-rush { color: #ff9800; font-weight: bold; text-shadow: 0 0 5px #ff9800; }
        .color-hit { color: #ff3d00; font-weight: bold; text-shadow: 0 0 5px #ff3d00; }
        .color-normal { color: #bdbdbd; }
        .color-lt { color: #e040fb; font-weight: 900; text-shadow: 0 0 15px #e040fb; font-size: 1.1em; }
        .color-ultimate { color: #ffea00; font-weight: 900; text-shadow: 0 0 15px #ffea00; font-size: 1.1em; }
        .color-fall { color: #757575; font-weight: bold; }
        .color-blue { color: #00e5ff; font-weight: bold; }
        .color-green { color: #00e676; font-weight: bold; }
        .color-white { color: #ffffff; font-weight: bold; }
        .data-lamp-container { background-color: #2b0a00; border: 3px solid #ff5722; border-radius: 8px; padding: 15px; box-shadow: 0 0 15px rgba(255, 87, 34, 0.5); }
        .data-lamp-title { color: #ff9800; margin-top: 0; margin-bottom: 15px; text-align: center; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 5px #ff9800; letter-spacing: 2px; }
        table.data-lamp { width: 100%; border-collapse: collapse; color: #fff; font-family: 'Courier New', Courier, monospace; }
        table.data-lamp th, table.data-lamp td { border: 1px solid #bf360c; padding: 10px 5px; text-align: center; }
        table.data-lamp th { background-color: #4a1400; color: #ffea00; font-size: 0.9em; }
        table.data-lamp tr:nth-child(even) { background-color: #330e00; }
        table.data-lamp td.hit-spins { color: #ffeb3b; font-weight: bold; }
        table.data-lamp td.hit-rush { color: #00e676; font-weight: bold; }
        table.data-lamp td.hit-payout { color: #ff5722; font-weight: bold; }
        .empty-row { color: #444 !important; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="hall-titles.css">
</head>

<body>
    <h1>🎰 パチンコシミュレーター <br><span style="font-size: 0.5em; color: #ffffff;">eフィーバー炎炎ノ消防隊2 399Ver</span></h1>
    <div class="main-container">
        <div class="left-panel">
            <div class="stats-board">
                <div class="stat-item">當前轉數 <span id="ui-spins">0</span></div>
                <div class="stat-item">本次出玉 <span id="ui-payout">0</span></div>
                <div class="stat-item">本次連莊 <span id="ui-rush">0</span></div>
            </div>
            <div style="margin-bottom: 15px;">
                <button id="btn-play" onclick="startPlay()">▶️ 遊技開始</button>
            </div>
            <div class="log-container" id="log-box"></div>
        </div>
        <div class="right-panel">
            <div class="data-lamp-container">
                <h3 class="data-lamp-title">DATA LAMP (最近10次)</h3>
                <table class="data-lamp">
                    <thead><tr><th>前次</th><th>當選回轉数</th><th>連莊数</th><th>獲得出玉</th></tr></thead>
                    <tbody id="history-tbody"><tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        class FireForce2_399 {
            constructor() { this.state = "NORMAL"; this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0; this.history = []; this.rush_spins = 0; }

            async play_normal() {
                this.session_spins += 1;
                if (this.session_spins % 100 === 0) addLog(`現在回轉数: ${this.session_spins}`, "color-normal");

                let roll = Math.random();
                let pHit = 1 / 399.9;
                let pCharge = 1 / 2186.0;

                // 🎯 1. 図柄揃い (1/399.9)
                if (roll < pHit) {
                    addLog(`\n[${this.session_spins} 回轉] 🎯 図柄揃い當選！`, "color-hit");
                    let r = Math.random();

                    // 50%: 3000玉 + 炎上バトルモード (LT)
                    if (r < 0.50) {
                        this.session_payout += 3000;
                        addLog("🔥 BONUS！ 3000玉獲得！", "color-ultimate");
                        addLog("🌈 炎上バトルモード (LT) 直行！！", "color-lt");
                        this.session_rush_count = 1;
                        updateUI(); 
                        await sleep(2000); // 🌟 調慢突入 RUSH 前嘅停頓，營造氣氛
                        await this.play_rush();
                    } 
                    // 46%: 1500玉 + 通常
                    else if (r < 0.96) {
                        this.session_payout += 1500;
                        addLog("💥 BONUS！ 1500玉獲得", "color-rush");
                        addLog("💀 昇格失敗... 通常へ戻る", "color-normal");
                        updateUI(); this.record_history();
                    } 
                    // 4%: 300玉 + 命の呼吸チャレンジ
                    else {
                        this.session_payout += 300;
                        addLog("💦 BONUS (300玉)", "color-normal");
                        addLog("⚠️ 命の呼吸チャレンジ (1回転決着) 突入！", "color-rush");
                        updateUI(); 
                        await sleep(1500); // 🌟 停頓等玩家睇清楚
                        
                        // 1回転で 1/2.0 を引けるか
                        if (Math.random() < (1 / 2.0)) {
                            this.session_payout += 1500;
                            addLog("🎉 チャレンジ成功！！ 1500玉獲得！", "color-hit");
                            addLog("🌈 炎上バトルモード (LT) 突入！！", "color-lt");
                            this.session_rush_count = 1;
                            updateUI(); 
                            await sleep(2000); // 🌟 調慢突入 RUSH 前嘅停頓
                            await this.play_rush();
                        } else {
                            addLog("💀 チャレンジ失敗... 通常へ戻る", "color-fall");
                            this.record_history();
                        }
                    }
                    return true;
                }
                // ⚡ 2. 炎炎チャージ (1/2186)
                else if (roll < pHit + pCharge) {
                    addLog(`\n[${this.session_spins} 回轉] ⚡ 炎炎チャージ當選！ (300玉)`, "color-normal");
                    this.session_payout += 300;
                    updateUI(); this.record_history();
                    return true;
                }
                return false;
            }

            async play_rush() {
                this.state = "LT";
                addLog(`\n===== 🌈 炎上バトルモード =====`, "color-lt");
                
                let initial_rush_count = this.session_rush_count;
                let isFirstBattle = true; // 🌟 標記係咪 RUSH 第一次戰鬥
                updateUI();

                // 右打ち中: 大当り確率 1/2.0 vs 転落確率 1/5.3
                let hitRate = 1 / 2.0;
                let fallRate = 1 / 5.3;
                let eventRate = hitRate + fallRate;
                
                while (this.state === "LT") {
                    await sleep(800); // 🌟 戰鬥前嘅醞釀時間
                    this.rush_spins++;
                    document.getElementById("ui-spins").innerText = `炎上バトル: ${this.rush_spins}回転目`;

                    // どちらを先に引くか (継続率 約72.6%)
                    if (Math.random() < (hitRate / eventRate)) {
                        // 🎯 大当り (1/2.0)
                        this.session_rush_count += 1;
                        addLog(`\n🎉 [バトル ${this.rush_spins}回転目] 勝利！ (總 ${this.session_rush_count}連)`, "color-hit");
                        
                        await sleep(800); // 🌟 勝利後，慢慢出狀態燈

                        let is4500 = false;

                        // 🌟 修正：RUSH 初回戰鬥必定為青ランプ (50% 攞 4500)
                        if (isFirstBattle) {
                            addLog(`🔵 内部状態: 青ランプ (初回突入)`, "color-blue");
                            if (Math.random() < 0.50) is4500 = true;
                            isFirstBattle = false; // 解除初回標記
                        } else {
                            // 内部状態のシミュレーション (白 60%, 緑 30%, 青 10% と仮定)
                            let stateRoll = Math.random();
                            if (stateRoll < 0.60) {
                                addLog(`⚪ 内部状態: 白ランプ`, "color-white");
                                if (Math.random() < 0.14) is4500 = true;
                            } else if (stateRoll < 0.90) {
                                addLog(`🟢 内部状態: 緑ランプ`, "color-green");
                                if (Math.random() < 0.33) is4500 = true;
                            } else {
                                addLog(`🔵 内部状態: 青ランプ`, "color-blue");
                                if (Math.random() < 0.50) is4500 = true;
                            }
                        }

                        await sleep(800); // 🌟 睇完燈，準備派彩

                        if (is4500) {
                            this.session_payout += 4500;
                            addLog(`👑 超炎上BURST！！ 4500玉獲得！`, "color-ultimate");
                            addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                            
                            // 約50%で3000個上乗せループ
                            let loopCount = 0;
                            while (Math.random() < 0.50) {
                                await sleep(1200); // 🌟 每次上乘前嘅心跳停頓
                                loopCount++;
                                this.session_payout += 3000;
                                // 🌟 修正：顯示累計出玉
                                addLog(`🔥 EXTRA上乗せ！！ +3000玉 (計 ${this.session_payout}玉)`, "color-lt");
                            }
                        } else {
                            this.session_payout += 1500;
                            addLog(`💥 炎上FEVER！ 1500玉獲得`, "color-rush");
                            addLog(`💰 累積出玉: ${this.session_payout} 玉`);
                        }

                        this.rush_spins = 0; // STリセット
                        updateUI(); 
                        await sleep(1500); // 🌟 派彩完結，抖陣先進入下一轉
                    } else {
                        // 💀 転落 (1/5.3)
                        await sleep(1000); // 🌟 戰鬥失敗嘅停頓
                        document.getElementById("ui-spins").innerText = `終了`;
                        addLog(`\n💀 バトル敗北... (転落 1/5.3)`, "color-fall");
                        addLog(`📈 總連莊数: ${this.session_rush_count}連 (含初當)`);
                        addLog(`💰 最終出玉: ${this.session_payout} 玉`);
                        this.state = "NORMAL"; 
                        this.rush_spins = 0;
                        this.record_history(); 
                        updateUI();
                        break;
                    }
                }
            }

            record_history() {
                this.history.unshift({ spins: this.session_spins, rush: this.session_rush_count, payout: this.session_payout });
                if (this.history.length > 10) this.history.pop();
                renderHistoryTable(this.history);
                this.session_spins = 0; this.session_payout = 0; this.session_rush_count = 0;
            }
        }

        let game = new FireForce2_399();
        let isPlaying = false;
        const logBox = document.getElementById("log-box");
        const btnPlay = document.getElementById("btn-play");
        const historyTbody = document.getElementById("history-tbody");

        function addLog(text, className = "") {
            const div = document.createElement("div"); div.className = `log-entry ${className}`; div.innerText = text;
            logBox.appendChild(div); logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            if (game.state === "NORMAL") document.getElementById("ui-spins").innerText = game.session_spins;
            document.getElementById("ui-payout").innerText = game.session_payout;
            document.getElementById("ui-rush").innerText = game.session_rush_count;
        }

        function renderHistoryTable(historyData) {
            historyTbody.innerHTML = "";
            if (historyData.length === 0) { historyTbody.innerHTML = `<tr><td colspan="4" class="empty-row">- 無紀錄 -</td></tr>`; return; }
            historyData.forEach((record, index) => {
                const tr = document.createElement("tr");
                let label = index === 0 ? "前回" : index === 1 ? "前々回" : `${index + 1}回前`;
                tr.innerHTML = `<td>${label}</td><td class="hit-spins">${record.spins}</td><td class="hit-rush">${record.rush}</td><td class="hit-payout">${record.payout}</td>`;
                historyTbody.appendChild(tr);
            });
        }

        async function startPlay() {
            if (isPlaying) return;
            isPlaying = true; btnPlay.disabled = true;
            addLog("\n=== 炎炎ノ消防隊2 (399Ver) 出動！ ===", "color-hit");
            while (isPlaying) {
                let ended = await game.play_normal(); updateUI();
                if (game.session_spins % 100 === 0 && game.state === "NORMAL") await sleep(10);
                if (ended) { isPlaying = false; break; }
            }
            btnPlay.disabled = false; btnPlay.innerText = "▶️ プレイ続行";
        }
    </script>
    <script src="hall-shared.js"></script>
    <script src="plugin.js"></script>

        <script type="text/javascript" src="//www.highperformanceformat.com/ead8f1e5fdd30faaed33da77b3333cf4/invoke.js"></script>
    </div>
</body>
